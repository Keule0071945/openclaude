<title>Clawd Code Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a learning adventure. Home = hero with Clawd + a winding map of 9 worlds.
   Lesson = tutor column (story + task) beside a live stage (pixel world / drawing board / bars / game) over a code editor. */
:root {
  --bg: #edf0f9;
  --surface: #ffffff;
  --surface-2: #f5f7fd;
  --ink: #1b1f3b;
  --muted: #5a6186;
  --line: #d9def0;
  --accent: #d77757;
  --accent-deep: #b85d3f;
  --accent-ink: #ffffff;
  --mint: #22a96a;
  --sky: #3d7ff5;
  --grape: #7b5cf5;
  --sun: #e9a92a;
  --danger: #d8434a;
  --shadow: 0 1px 2px rgba(27, 31, 59, .06), 0 8px 24px rgba(27, 31, 59, .08);
  --code-bg: #1b1f3b;
  --code-fg: #e8eaff;
  --code-muted: #7d84ad;
  --code-line: rgba(255, 255, 255, .06);
  --code-active: rgba(215, 119, 87, .22);
  --tok-key: #c9a4ff;
  --tok-fn: #ffb08f;
  --tok-str: #8fe3b4;
  --tok-num: #ffd479;
  --tok-com: #7d84ad;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1224; --surface: #181c34; --surface-2: #1f2442; --ink: #eceeff; --muted: #a0a6cc; --line: #2b3157;
    --accent: #e8896a; --accent-deep: #d77757; --accent-ink: #1b1f3b; --mint: #3ddc97; --sky: #6aa8ff; --grape: #a08aff;
    --sun: #f7c04a; --danger: #ff6b6b; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    --code-bg: #0b0e1c; --code-fg: #e8eaff; --code-muted: #6d749e; --code-line: rgba(255, 255, 255, .05); --code-active: rgba(232, 137, 106, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1224; --surface: #181c34; --surface-2: #1f2442; --ink: #eceeff; --muted: #a0a6cc; --line: #2b3157;
  --accent: #e8896a; --accent-deep: #d77757; --accent-ink: #1b1f3b; --mint: #3ddc97; --sky: #6aa8ff; --grape: #a08aff;
  --sun: #f7c04a; --danger: #ff6b6b; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  --code-bg: #0b0e1c; --code-fg: #e8eaff; --code-muted: #6d749e; --code-line: rgba(255, 255, 255, .05); --code-active: rgba(232, 137, 106, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.app { min-height: 100%; display: flex; flex-direction: column; }

/* ── top bar ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 6px; border-radius: 12px; }
.brand canvas { width: 36px; height: 24px; image-rendering: pixelated; }
.brand b { font: 700 19px var(--font-display); letter-spacing: -.01em; }
.brand b span { color: var(--accent); }
.spacer { flex: 1; }
.xp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.xp .lvl { font: 600 13px var(--font-display); color: var(--muted); white-space: nowrap; }
.xp .lvl b { color: var(--ink); }
.xpbar { width: 150px; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sun), var(--accent)); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 600 13px var(--font-display); white-space: nowrap; }
.pill .star { color: var(--sun); }

main { flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 40px; }

/* ── home ── */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: center; padding-block: 8px 26px; }
.hero h1 { font-size: clamp(34px, 5vw, 58px); }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); font-size: 17px; max-width: 34em; margin: 14px 0 22px; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 20px; font: 600 16px var(--font-display); background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); transition: transform .15s, box-shadow .15s, background .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); transform: translateY(3px); }
.btn.go { background: var(--mint); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--mint) 70%, #000); }
.btn.go:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--mint) 70%, #000); transform: translateY(3px); }
.btn.small { padding: 8px 13px; font-size: 14px; border-radius: 11px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.hero-stage { position: relative; aspect-ratio: 16 / 11; max-width: 100%; border-radius: 26px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.hero-stage canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.hero-code { position: absolute; left: 14px; bottom: 14px; padding: 10px 14px; border-radius: 12px; background: var(--code-bg); color: var(--code-fg); font: 13px/1.6 var(--font-code); box-shadow: var(--shadow); min-width: 0; max-width: calc(100% - 28px); }
.hero-code .on { background: var(--code-active); border-radius: 4px; }

.journey-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 16px; }
.journey-head h2 { font-size: 28px; }
.journey-head p { margin: 0; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--sky); font: 500 14px var(--font-body); padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.worlds { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.world { position: relative; padding: 18px 18px 16px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 12px; align-content: start; transition: transform .25s; animation: rise .6s backwards cubic-bezier(.2, .8, .2, 1); }
.world:hover { transform: translateY(-3px); }
.world.locked { opacity: .62; }
.world .wh { display: flex; gap: 12px; align-items: center; }
.world .badge { flex: none; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: color-mix(in srgb, var(--wc) 16%, var(--surface)); }
.world .badge canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.world .num { font: 600 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--wc); }
.world h3 { font-size: 20px; }
.world p { margin: 0; color: var(--muted); font-size: 14px; }
.lessons { display: flex; flex-wrap: wrap; gap: 8px; }
.ldot { position: relative; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); font: 700 15px var(--font-display); display: grid; place-items: center; transition: transform .15s, background .2s; }
.ldot:hover { transform: scale(1.08); }
.ldot.done { background: color-mix(in srgb, var(--wc) 22%, var(--surface)); box-shadow: inset 0 0 0 2px var(--wc); }
.ldot.next { background: var(--wc); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--wc) 70%, #000); animation: bob 1.6s ease-in-out infinite; }
.ldot.lock { color: var(--muted); }
.ldot .st { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: -1px; color: var(--sun); white-space: nowrap; text-shadow: 0 1px 0 var(--surface); }
.wprog { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.wprog i { display: block; height: 100%; background: var(--wc); border-radius: 99px; }

/* ── lesson ── */
.lesson { display: grid; grid-template-columns: minmax(300px, 410px) minmax(0, 1fr); gap: 20px; align-items: start; }
.crumbs { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.crumbs .wname { font: 600 13px var(--font-display); color: var(--wc); text-transform: uppercase; letter-spacing: .08em; }
.crumbs h2 { font-size: 26px; width: 100%; }
.tutor { position: sticky; top: 76px; display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.talk { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.talk canvas { width: 64px; height: 48px; image-rendering: pixelated; }
.bubble { position: relative; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 15px; min-height: 64px; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 18px; border: 7px solid transparent; border-left: 0; border-right-color: var(--surface-2); }
.bubble code, .task code, .hint code { font: 600 13px var(--font-code); background: var(--code-bg); color: var(--tok-fn); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.vis { margin-top: 12px; min-height: 150px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; position: relative; padding: 12px; }
.vis pre { margin: 0; font: 13px/1.65 var(--font-code); background: var(--code-bg); color: var(--code-fg); padding: 12px 14px; border-radius: 12px; overflow-x: auto; max-width: 100%; white-space: pre; }
.stepnav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.dots { display: flex; gap: 5px; flex: 1; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .3s, background .3s; }
.dots i.on { width: 22px; background: var(--accent); }
.task h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.task h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.task p { margin: 8px 0 0; }
.task .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.hint { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--sun) 16%, var(--surface)); font-size: 14px; animation: rise .35s backwards; }

.work { display: grid; gap: 14px; min-width: 0; }
.stagecard { padding: 12px; }
.stagebar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.stagebar .title { font: 600 14px var(--font-display); color: var(--muted); }
.tabs { display: flex; gap: 6px; }
.tab { border: 0; background: var(--surface-2); border-radius: 10px; padding: 5px 10px; font: 600 13px var(--font-display); color: var(--muted); }
.tab.on { background: var(--ink); color: var(--surface); }
.tab.ok { box-shadow: inset 0 0 0 2px var(--mint); }
.tab.bad { box-shadow: inset 0 0 0 2px var(--danger); }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: var(--surface-2); aspect-ratio: 16 / 10; max-width: 100%; }
.stage.square { aspect-ratio: 1 / 1; max-height: 520px; margin-inline: auto; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.stage .msg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px; background: var(--danger); color: #fff; font: 600 14px var(--font-display); box-shadow: var(--shadow); animation: shake .4s; max-width: 90%; text-align: center; }
.stage .msg.info { background: var(--ink); color: var(--surface); animation: rise .3s; }
.console { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; height: 100%; padding: 12px; position: absolute; inset: 0; }
.panel { background: var(--surface); border-radius: 12px; padding: 12px; overflow: auto; min-width: 0; }
.panel h4 { margin: 0 0 8px; font: 600 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.out { font: 14px/1.7 var(--font-code); }
.out div { animation: typein .3s backwards; border-bottom: 1px dashed var(--line); padding: 2px 0; overflow-wrap: anywhere; }
.out .err { color: var(--danger); }
.mem { display: flex; flex-wrap: wrap; gap: 10px; align-content: start; }
.vbox { display: grid; gap: 4px; animation: drop .5s backwards cubic-bezier(.3, 1.5, .5, 1); min-width: 0; max-width: 100%; }
.vbox .vn { font: 600 12px var(--font-code); color: var(--muted); }
.vbox .vv { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--sky) 14%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sky) 50%, transparent); font: 600 15px var(--font-code); overflow-wrap: anywhere; }
.vbox .vv.str { background: color-mix(in srgb, var(--mint) 14%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--mint) 50%, transparent); }
.vbox .vv.bool { background: color-mix(in srgb, var(--grape) 14%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--grape) 50%, transparent); }
.vbox .arr { display: flex; gap: 4px; flex-wrap: wrap; }
.vbox .arr span { display: grid; gap: 2px; text-align: center; }
.vbox .arr small { font: 10px var(--font-code); color: var(--muted); }
.vbox .arr b { padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--sun) 18%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sun) 55%, transparent); font: 600 13px var(--font-code); }
.vbox .obj { padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--grape) 12%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--grape) 45%, transparent); font: 13px/1.6 var(--font-code); }
.vbox .obj i { font-style: normal; color: var(--muted); }

.controls { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.speed { display: flex; align-items: center; gap: 6px; margin-left: auto; font: 600 12px var(--font-display); color: var(--muted); }
.speed input { width: 110px; accent-color: var(--accent); }
.pad { display: none; gap: 6px; }
.pad.on { display: flex; }
.pad button { width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); font: 700 16px var(--font-display); }

.editorcard { padding: 0; overflow: hidden; background: var(--code-bg); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--code-line); }
.chip { border: 0; border-radius: 9px; padding: 6px 10px; background: rgba(255, 255, 255, .07); color: var(--tok-fn); font: 600 13px var(--font-code); transition: background .15s, transform .15s; }
.chip:hover { background: rgba(255, 255, 255, .14); transform: translateY(-1px); }
.chip.k { color: var(--tok-key); }
.palette .lbl { font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--code-muted); align-self: center; margin-right: 4px; }
.editor { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); font: 15px/24px var(--font-code); min-height: 260px; max-height: 460px; overflow: auto; }
.gutter { padding: 12px 8px 12px 0; text-align: right; color: var(--code-muted); user-select: none; position: relative; z-index: 1; }
.gutter div { height: 24px; }
.gutter .err { color: var(--danger); font-weight: 700; }
.codewrap { position: relative; min-width: 0; }
.codewrap pre, .codewrap textarea { margin: 0; padding: 12px 14px 12px 6px; font: inherit; white-space: pre; tab-size: 2; overflow: hidden; border: 0; min-height: 100%; }
.codewrap pre { position: absolute; inset: 0; color: var(--code-fg); pointer-events: none; }
.codewrap textarea { position: relative; display: block; width: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--tok-fn); outline: none; min-height: 236px; }
.codewrap textarea::selection { background: rgba(255, 255, 255, .18); color: transparent; }
.lineglow { position: absolute; left: 0; right: 0; height: 24px; background: var(--code-active); border-left: 3px solid var(--accent); transition: top .18s cubic-bezier(.2, .8, .2, 1); pointer-events: none; display: none; }
.lineglow.err { background: rgba(255, 107, 107, .18); border-left-color: var(--danger); }
.t-key { color: var(--tok-key); } .t-fn { color: var(--tok-fn); } .t-str { color: var(--tok-str); } .t-num { color: var(--tok-num); } .t-com { color: var(--tok-com); font-style: italic; }
.edfoot { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--code-line); color: var(--code-muted); font: 12px var(--font-body); flex-wrap: wrap; }
.edfoot kbd { font: 11px var(--font-code); background: rgba(255, 255, 255, .08); border-radius: 5px; padding: 1px 5px; color: var(--code-fg); }

/* ── win dialog ── */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(15, 18, 36, .45); backdrop-filter: blur(4px); padding: 16px; animation: fade .25s; }
.win { width: min(440px, 100%); background: var(--surface); border-radius: 26px; padding: 26px 24px 22px; text-align: center; box-shadow: var(--shadow); animation: pop .5s cubic-bezier(.3, 1.5, .5, 1); }
.win canvas { width: 126px; height: 84px; image-rendering: pixelated; }
.win h2 { font-size: 34px; margin-top: 4px; }
.win p { color: var(--muted); margin: 8px 0 0; }
.stars { display: flex; justify-content: center; gap: 10px; margin: 14px 0 6px; }
.stars svg { width: 54px; height: 54px; transform: scale(0); animation: starpop .6s forwards cubic-bezier(.3, 1.6, .5, 1); }
.stars svg:nth-child(2) { animation-delay: .25s; } .stars svg:nth-child(3) { animation-delay: .5s; }
.win .gain { font: 700 18px var(--font-display); color: var(--accent); margin-top: 6px; }
.win .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ── intro visuals ── */
.v-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.v-chip { font: 600 14px var(--font-code); padding: 8px 12px; border-radius: 10px; background: var(--code-bg); color: var(--tok-fn); animation: slidein .5s backwards cubic-bezier(.3, 1.4, .5, 1); }
.v-box { display: grid; justify-items: center; gap: 6px; }
.v-crate { width: 96px; height: 74px; border-radius: 12px; background: color-mix(in srgb, var(--sky) 16%, var(--surface)); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--sky) 60%, transparent); display: grid; place-items: center; font: 700 24px var(--font-code); position: relative; overflow: hidden; }
.v-crate b { animation: dropin 2.6s infinite cubic-bezier(.3, 1.4, .5, 1); }
.v-label { font: 600 13px var(--font-code); color: var(--muted); }
.v-ring { width: 110px; height: 110px; position: relative; display: grid; place-items: center; }
.v-ring svg { position: absolute; inset: 0; animation: spin 2.4s linear infinite; }
.v-ring b { font: 700 34px var(--font-display); color: var(--accent); }
.v-cells { display: flex; gap: 6px; }
.v-cells span { display: grid; gap: 3px; justify-items: center; animation: slidein .5s backwards; }
.v-cells b { width: 46px; height: 40px; display: grid; place-items: center; border-radius: 9px; background: color-mix(in srgb, var(--sun) 20%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sun) 60%, transparent); font: 600 13px var(--font-code); }
.v-cells small { font: 11px var(--font-code); color: var(--muted); }
.v-obj { padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--grape) 12%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--grape) 50%, transparent); font: 14px/1.8 var(--font-code); }
.v-obj div { animation: slidein .45s backwards; }
.v-machine { display: flex; align-items: center; gap: 10px; }
.v-machine .m { width: 110px; height: 76px; border-radius: 14px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 600 13px var(--font-code); position: relative; }
.v-machine .m::after { content: ""; position: absolute; top: -8px; left: 20px; width: 14px; height: 8px; background: var(--accent); border-radius: 4px 4px 0 0; animation: blink 1s infinite; }
.v-ball { font: 700 16px var(--font-code); padding: 8px 12px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); }
.v-ball.in { animation: feed 2.4s infinite; }
.v-ball.outb { animation: spit 2.4s infinite; color: var(--accent); }
.v-keys { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
.v-keys b { height: 40px; border-radius: 9px; display: grid; place-items: center; background: var(--surface); box-shadow: inset 0 -3px 0 var(--line), inset 0 0 0 1.5px var(--line); font: 700 16px var(--font-display); }
.v-keys b.p { animation: press 1.6s infinite; }
.v-flip { display: flex; gap: 6px; }
.v-flip span { width: 50px; height: 50px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); position: relative; overflow: hidden; }
.v-flip span i { position: absolute; top: 18px; width: 14px; height: 14px; border-radius: 99px; background: var(--accent); }
.v-fork { width: 100%; max-width: 280px; height: auto; }
.v-bars { display: flex; align-items: end; gap: 6px; height: 110px; }
.v-bars i { width: 22px; border-radius: 6px 6px 3px 3px; background: var(--sky); transition: height .5s cubic-bezier(.3, 1.3, .5, 1), background .3s; }
.v-bars i.hot { background: var(--accent); }
.v-line { width: 100%; max-width: 300px; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.7); } }
@keyframes starpop { to { transform: scale(1); } }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes shake { 20%, 60% { transform: translateX(calc(-50% - 6px)); } 40%, 80% { transform: translateX(calc(-50% + 6px)); } }
@keyframes typein { from { opacity: 0; transform: translateX(-8px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-20px) scale(.8); } }
@keyframes slidein { from { opacity: 0; transform: translateY(10px) scale(.9); } }
@keyframes dropin { 0% { transform: translateY(-60px); opacity: 0; } 25%, 80% { transform: none; opacity: 1; } 100% { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes feed { 0% { transform: translateX(-20px); opacity: 0; } 30%, 50% { transform: none; opacity: 1; } 70%, 100% { transform: translateX(40px); opacity: 0; } }
@keyframes spit { 0%, 50% { transform: translateX(-30px); opacity: 0; } 75% { transform: none; opacity: 1; } 100% { opacity: 1; } }
@keyframes press { 0%, 40%, 100% { transform: none; background: var(--surface); } 20% { transform: translateY(2px); background: var(--accent); color: #fff; } }

@media (max-width: 980px) {
  .worlds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lesson { grid-template-columns: minmax(0, 1fr); }
  .tutor { position: static; }
}
@media (max-width: 680px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .worlds { grid-template-columns: minmax(0, 1fr); }
  .xpbar { width: 70px; }
  .top { padding: 8px 16px; gap: 8px; }
  .brand b { font-size: 16px; }
  .xp .lvl span { display: none; }
  main { padding-inline: 16px; }
  .console { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
  .stage { aspect-ratio: 1 / 1; }
  .speed { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

const KEYWORDS = new Set("let const var if else while for function return true false new of in class constructor this break continue null undefined typeof".split(" "));

function highlight(src) {

  while (i < src.length) {
    const rest = src.slice(i);
    let m;
    if ((m = /^\/\/[^\n]*/.exec(rest))) { out += `<span class="t-com">${escapeHtml(m[0])}</span>`; i += m[0].length; continue; }
    if ((m = /^("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?|`(?:[^`\\]|\\.)*`?)/.exec(rest))) { out += `<span class="t-str">${escapeHtml(m[0])}</span>`; i += m[0].length; continue; }
    if ((m = /^\d+(\.\d+)?/.exec(rest))) { out += `<span class="t-num">${m[0]}</span>`; i += m[0].length; continue; }
    if ((m = /^[A-Za-zÄÖÜäöüß_$][\wÄÖÜäöüß$]*/.exec(rest))) {
      const w = m[0];
      out += KEYWORDS.has(w) ? `<span class="t-key">${w}</span>` : API_WORDS.has(w) ? `<span class="t-fn">${w}</span>` : w;
      i += w.length; continue;

    out += escapeHtml(src[i]); i++;

async function animateStep(view, prev, f, ms, alive) {
  const s0 = Object.assign({}, view.state);
  const trail = (s0.trail || []).slice();
  if (f.ev === "move") trail.push({ x: prev.x, y: prev.y });
  const t0 = performance.now();
  if (reduceMotion) ms = Math.min(ms, 60);
  return new Promise(resolve => {
    function tick(t) {
      if (alive && !alive()) return resolve();
      const k = Math.min(1, (t - t0) / ms);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const st = { x: prev.x + (f.x - prev.x) * e, y: prev.y + (f.y - prev.y) * e, dir: k > 0.4 ? f.dir : prev.dir, got: k > 0.5 ? f.got : prev.got, hop: f.ev === "move" ? k : 0, bump: f.ev === "bump" ? k : 0, say: f.ev === "say" ? f.text : "", happy: 0, trail };

      if (k < 1) requestAnimationFrame(tick);
      else { if (f.ev === "collect") view.sparkle(); resolve(); }
    }
    requestAnimationFrame(tick);

}

async function run(stage, bar) {
  stopRun();
  const token = ++runToken;
  running = true;
  const code = editor.get();
  store.data.code[LI] = code; store.save();
  editor.mark(0);
  const alive = () => token === runToken;
  const r = { code, vars: {}, output: [], ops: [] };
  let verdict = null;

  if (L.type === "grid") {
    const results = L.maps.map(m => simulateGrid(code, parseMap(m)));
    r.variantGems = L.maps.map(m => parseMap(m).gems.length);
    r.variantSaid = results.map(x => x.said[x.said.length - 1]);
    const order = results.map((_, k) => k);
    for (const k of order) {
      if (!alive()) return;
      variantIdx = k; setupStage(stage, bar);
      const res = results[k];
      await playGrid(stageView, res, alive);
      if (!alive()) return;
      const tab = bar.querySelectorAll(".tab")[k];
      if (!res.ok) {
        if (tab) tab.classList.add("bad");
        const msg = res.err ? res.err.msg : res.goal;
        stageMsg(stage, (results.length > 1 ? "Welt " + (k + 1) + ": " : "") + msg);
        if (res.err) editor.mark(res.err.line, true);
        running = false; return;
      }
      if (tab) tab.classList.add("ok");
      stageView.set(Object.assign({}, stageView.state, { happy: 1 }));
      await sleep(results.length > 1 ? 650 : 300);
    }
    verdict = L.check ? L.check(r) : ok();
  } else if (L.type === "console") {
    const res = runConsole(code);
    Object.assign(r, res);
    renderConsole(res);
    if (res.err) { stageMsg(stage, res.err.msg); editor.mark(res.err.line, true); running = false; return; }
    await sleep(500);
    verdict = L.check(r);
  } else if (L.type === "draw") {
    const res = runConsole(code);
    Object.assign(r, res);
    if (res.err) { stageMsg(stage, res.err.msg); editor.mark(res.err.line, true); running = false; return; }
    await stageView.play(res.ops, alive);
    if (!alive()) return;
    verdict = L.check(r);
  } else if (L.type === "sort") {
    r.variantArrays = L.arrays; r.variantSaid = []; r.variantFinal = [];
    for (let k = 0; k < L.arrays.length; k++) {
      if (!alive()) return;
      variantIdx = k; setupStage(stage, bar);
      const res = runSort(code, L.arrays[k]);
      r.variantSaid.push(res.said[res.said.length - 1]); r.variantFinal.push(res.final);
      await stageView.play(res.ops, alive);
      if (!alive()) return;
      if (res.err) { stageMsg(stage, res.err.msg); editor.mark(res.err.line, true); running = false; return; }
      const tab = bar.querySelectorAll(".tab")[k];
      const partial = L.check({ variantArrays: [L.arrays[k]], variantSaid: [r.variantSaid[k]], variantFinal: [res.final] });
      if (!partial.ok) { if (tab) tab.classList.add("bad"); stageMsg(stage, partial.msg); running = false; return; }
      if (tab) tab.classList.add("ok");
      await sleep(500);
    }
    verdict = L.check(r);
  } else if (L.type === "guess") {
    r.variantGuess = [];
    for (let k = 0; k < L.secrets.length; k++) {
      if (!alive()) return;
      variantIdx = k; setupStage(stage, bar);
      const res = runGuess(code, L.secrets[k]);
      r.variantGuess.push(res);
      await stageView.play(res, alive);
      if (!alive()) return;
      if (res.err) { stageMsg(stage, res.err.msg); editor.mark(res.err.line, true); running = false; return; }
      const tab = bar.querySelectorAll(".tab")[k];
      if (!res.found || res.tries > 7) { if (tab) tab.classList.add("bad"); stageMsg(stage, !res.found ? "Die geheime Zahl wurde nicht gefunden." : res.tries + " Versuche – geht's in höchstens 7?"); running = false; return; }
      if (tab) tab.classList.add("ok");
      await sleep(500);
    }
    verdict = L.check(r);
  } else if (L.type === "game") {
    setupStage(stage, bar);
    const c = stage.querySelector("canvas");
    c.focus();
    game = startGame(c, code, stats => {
      if (!alive()) return;
      const v = L.check({ game: stats, code });
      if (v && v.ok) { game.pause(true); finish(v); }
      else if (v && !v.ok) { stageMsg(stage, v.msg); }
    }, err => { stageMsg(stage, err.msg); editor.mark(err.line, true); running = false; });

// ── editor ────────────────────────────────────────────────────────────
function makeEditor(initial, palette) {
  const ta = h("textarea", { spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": "Dein Code", id: "code" });
  const pre = h("pre", { "aria-hidden": "true" });
  const gutter = h("div", { class: "gutter", "aria-hidden": "true" });
  const glow = h("div", { class: "lineglow" });
  const wrapC = h("div", { class: "codewrap" }, glow, pre, ta);
  const ed = h("div", { class: "editor" }, gutter, wrapC);
  const pal = h("div", { class: "palette" }, h("span", { class: "lbl" }, "Einfügen:"));
  palette.forEach(snip => pal.append(h("button", { class: "chip" + (/^(if|for|while|function|class|let|wiederhole)/.test(snip) ? " k" : ""), type: "button", onclick: () => insert(snip) }, snip.split("\n")[0].replace(/\{\s*$/, "{ … }"))));
  const foot = h("div", { class: "edfoot" }, h("span", null, h("kbd", null, "Strg"), " + ", h("kbd", null, "Enter"), " führt aus"), h("span", null, "·"), h("span", null, "Tab rückt ein"));
  const el = h("div", { class: "card editorcard" }, palette.length ? pal : null, ed, foot);
  let errLine = 0;
  const api = { el, onRun: null, onChange: null };
  function refresh() {
    pre.innerHTML = highlight(ta.value);
    const n = ta.value.split("\n").length;
    gutter.innerHTML = "";
    for (let i = 1; i <= Math.max(n, 10); i++) gutter.append(h("div", { class: i === errLine ? "err" : "" }, i === errLine ? "●" : String(i)));
    ta.style.height = "auto"; ta.style.height = Math.max(236, ta.scrollHeight) + "px";
  }
  function insert(snip) {
    const v = ta.value, pos = ta.selectionStart;
    const lineStart = v.lastIndexOf("\n", pos - 1) + 1;
    const lineEnd = v.indexOf("\n", pos) < 0 ? v.length : v.indexOf("\n", pos);
    const curLine = v.slice(lineStart, lineEnd);
    const indent = /^\s*/.exec(curLine)[0];
    const blank = curLine.trim() === "";
    const text = snip.split("\n").map((l, i) => (i === 0 && !blank ? indent : indent) + l).join("\n");
    let at, before, after;
    if (blank) { before = v.slice(0, lineStart); after = v.slice(lineEnd); at = before.length; ta.value = before + text + after; }
    else { before = v.slice(0, lineEnd) + "\n"; after = v.slice(lineEnd); at = before.length; ta.value = before + text + after; }

  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); api.onRun && api.onRun(); return; }
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); document.execCommand("insertText", false, "  "); return; }
    if (e.key === "Enter") {
      const v = ta.value, pos = ta.selectionStart;
      const ls = v.lastIndexOf("\n", pos - 1) + 1, line = v.slice(ls, pos);
      let ind = /^\s*/.exec(line)[0];
      if (/[{(\[]\s*$/.test(line)) ind += "  ";
      e.preventDefault(); document.execCommand("insertText", false, "\n" + ind);
    }
    if (e.key === "}" ) {
      const v = ta.value, pos = ta.selectionStart, ls = v.lastIndexOf("\n", pos - 1) + 1, line = v.slice(ls, pos);
      if (/^\s+$/.test(line) && line.length >= 2) { e.preventDefault(); ta.setSelectionRange(pos - 2, pos); document.execCommand("insertText", false, "}"); }
    }

  api.set = v => { ta.value = v; errLine = 0; refresh(); api.onChange && api.onChange(v); };
  api.focus = () => ta.focus();
  api.mark = (line, err) => {
    errLine = err ? line : 0;
    if (!line) { glow.style.display = "none"; refresh(); return; }
    glow.style.display = "block"; glow.classList.toggle("err", !!err);

}

}
