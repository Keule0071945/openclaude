<script type="module">
import * as THREE from 'three';
import {OutlineEffect} from './OutlineEffect.js';
const W=1080,H=1920;
const glc=document.getElementById('gl');
const main=document.getElementById('c'),mctx=main.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.useLegacyLights=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const outline=new OutlineEffect(renderer,{defaultThickness:0.003,defaultColor:[0.08,0.05,0.03],defaultAlpha:1});
const camera=new THREE.PerspectiveCamera(40,W/H,0.05,300);
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
const offA=mk(),offB=mk();
let TL=null,TT=0;

// ---------------- helpers ----------------
const gm=(()=>{const d=new Uint8Array([110,190,255]);const t=new THREE.DataTexture(d,3,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const M=(c,o={})=>new THREE.MeshToonMaterial({color:c,gradientMap:gm,...o});
const NO=m=>{m.userData.outlineParameters={visible:false};return m;};
const E=(c,o={})=>NO(new THREE.MeshBasicMaterial({color:c,...o}));
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;const o={c,g:c.getContext('2d'),t,paint(f){setCtx(o.g);o.g.setTransform(1,0,0,1,0,0);o.g.clearRect(0,0,w,h);f(o.g);t.needsUpdate=true;}};if(fn)o.paint(fn);return o;}
function tiled(w,h,rx,ry,fn){const o=ctex(w,h,fn);o.t.wrapS=o.t.wrapT=THREE.RepeatWrapping;o.t.repeat.set(rx,ry);return o.t;}
function stoneTex(base,rx,ry,bw=128,bh=72){return tiled(512,512,rx,ry,g=>{g.fillStyle=base;g.fillRect(0,0,512,512);for(let r=0;r<512/bh+1;r++)for(let c=-1;c<512/bw+1;c++){const x=c*bw+(r%2)*bw/2,y=r*bh;g.fillStyle=mix(base,rnd(r*31+c)>0.5?'#ffffff':'#1a0e08',0.05+rnd(r*7+c*3)*0.07);g.fillRect(x+3,y+3,bw-6,bh-6);g.strokeStyle=dk(base,0.3);g.lineWidth=4;g.strokeRect(x+2,y+2,bw-4,bh-4);}});}
function woodTex(base,rx=1,ry=1){return tiled(512,512,rx,ry,g=>{g.fillStyle=base;g.fillRect(0,0,512,512);for(let i=0;i<8;i++){g.fillStyle=mix(base,i%2?'#ffffff':'#000000',0.05);g.fillRect(0,i*64,512,64);g.strokeStyle=dk(base,0.35);g.lineWidth=4;g.beginPath();g.moveTo(0,i*64);g.lineTo(512,i*64);g.stroke();for(let k=0;k<3;k++){g.beginPath();g.ellipse(rnd(i*9+k)*512,i*64+32,40,8,0,0,7);g.strokeStyle=dk(base,0.18);g.lineWidth=3;g.stroke();}}});}
function plainNoise(base,rx,ry,dots='#000000',a=0.08){return tiled(512,512,rx,ry,g=>{g.fillStyle=base;g.fillRect(0,0,512,512);for(let i=0;i<260;i++){g.fillStyle=rgba(dots,a*rnd(i*3.3));g.beginPath();g.ellipse(rnd(i)*512,rnd(i*1.7)*512,6+rnd(i*2)*22,4+rnd(i*5)*12,rnd(i*8)*3,0,7);g.fill();}});}
function gradBg(stops){const o=ctex(4,512,g=>{const gr=g.createLinearGradient(0,0,0,512);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));g.fillStyle=gr;g.fillRect(0,0,4,512);});return o.t;}
const RAD=ctex(128,128,g=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.35,'rgba(255,255,255,0.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);}).t;
const SHAFT=ctex(64,256,g=>{const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(255,255,255,0.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,256);const h=g.createLinearGradient(0,0,64,0);}).t;
function glowSprite(color,size,op=0.8){const m=NO(new THREE.SpriteMaterial({map:RAD,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));const s=new THREE.Sprite(m);s.scale.set(size,size,1);return s;}
function shaft(len,w0,w1,color,op){const g=new THREE.CylinderGeometry(w0,w1,len,24,1,true);g.translate(0,-len/2,0);const m=NO(new THREE.MeshBasicMaterial({map:SHAFT,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));const me=new THREE.Mesh(g,m);return me;}
function mesh(geo,mat,x=0,y=0,z=0,parent=null){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
const box=(w,h,d,mat,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p);
const cyl=(rt,rb,h,mat,x,y,z,p,seg=28)=>mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p);
const sph=(r,mat,x,y,z,p,sx=1,sy=1,sz=1)=>{const m=mesh(new THREE.SphereGeometry(r,28,18),mat,x,y,z,p);m.scale.set(sx,sy,sz);return m;};
function popS(obj,lt,t0,base=1,dur=0.35){const k=pop(lt,t0,dur);obj.visible=k>0.001;obj.scale.setScalar(Math.max(0.0001,k*base));return k;}
function wt(word,after=-1){for(const w of TL.words){if(w.w.replace(/[.,?:!…\s]/g,'')===word&&w.s>after)return w.s;}console.error('word?',word);return 0;}

// ---------- 2D card in 3D (characters & flat props) ----------
const KPX=2.2/900;
class Card{
  constructor(parent,x,z,o,s=1,{wide=false,bill=true,y=0}={}){this.o=o;this.s=s;this.bill=bill;this.wide=wide;this.tint=new THREE.Color(1,1,1);
    const cw=wide?1024:512;this.tex=ctex(cw,900);
    const geo=new THREE.PlaneGeometry(cw*KPX*s,900*KPX*s);geo.translate(wide?(cw/2-256)*KPX*s:0,(450-880)*KPX*s*-1,0);
    this.mat=NO(new THREE.MeshBasicMaterial({map:this.tex.t,transparent:true,alphaTest:0.45,side:THREE.DoubleSide}));
    this.mesh=new THREE.Mesh(geo,this.mat);this.mesh.position.set(x,y,z);this.mesh.castShadow=true;
    this.mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:this.tex.t,alphaTest:0.45});
    parent.add(this.mesh);this.key='';}
  update(lt,st={}){const opts={...this.o,...st};const F=opts.f;const key=JSON.stringify([F,opts.pose,opts.item,opts.tint,opts.sweat,Math.floor(TT*15)*(opts.sweat||opts.pose==='stir'||opts.pose==='shovel'?1:0)]);
    if(key!==this.key){this.key=key;this.tex.paint(g=>{g.translate(256,880);char({...opts,x:0,y:0,s:1.15,noShadow:true});});}
    if(this.bill){this.mesh.rotation.y=Math.atan2(camera.position.x-this.mesh.position.x,camera.position.z-this.mesh.position.z);}
    this.mat.color.copy(this.tint);}
}
class Flat{ // flat drawn prop panel
  constructor(parent,w,h,pxw,pxh,draw,{bill=false,lit=false}={}){this.tex=ctex(pxw,pxh);this.draw=draw;this.bill=bill;
    this.mat=lit?M('#ffffff',{map:this.tex.t,transparent:true,alphaTest:0.4,side:THREE.DoubleSide}):NO(new THREE.MeshBasicMaterial({map:this.tex.t,transparent:true,alphaTest:0.3,side:THREE.DoubleSide}));
    if(lit)NO(this.mat);
    this.mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),this.mat);this.mesh.castShadow=true;this.mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:this.tex.t,alphaTest:0.4});parent.add(this.mesh);this.key=null;this.pxw=pxw;this.pxh=pxh;}
  update(lt,key=0){if(key!==this.key){this.key=key;this.tex.paint(g=>this.draw(g,lt));}if(this.bill)this.mesh.rotation.y=Math.atan2(camera.position.x-this.mesh.getWorldPosition(new THREE.Vector3()).x,camera.position.z-this.mesh.getWorldPosition(new THREE.Vector3()).z);}
}

// adult face decal: almond eyes with lids, heavier brows, no blush
function drawFaceAdult(F,o){const g=ctx;const f=F.face,e=F.eye;const lk=(o.look||0)*6;
  const iris=o.iris||'#4a3220';const browC=o.browC||'#3a2416';
  [-1,1].forEach(sd=>{const x=sd*60,y=-6;
    const closed=(f==='laugh')||(f==='wink'&&sd<0)||e<0.2;
    if(closed){g.beginPath();g.moveTo(x-26,y+2);g.quadraticCurveTo(x,y+(f==='laugh'?-12:8),x+26,y+2);g.lineWidth=7;g.strokeStyle='#2a1a10';g.lineCap='round';g.stroke();}
    else{const open=e*(f==='shock'?1.25:f==='dreamy'?0.55:f==='smug'?0.7:1);
      g.save();g.beginPath();g.ellipse(x,y,27,15*open+2,0,0,Math.PI*2);g.fillStyle='#f6f1e8';g.fill();g.clip();
      g.beginPath();g.arc(x+lk,y+1,12,0,7);g.fillStyle=iris;g.fill();g.beginPath();g.arc(x+lk,y+1,6,0,7);g.fillStyle='#120a06';g.fill();
      g.beginPath();g.arc(x+lk+4,y-3,3,0,7);g.fillStyle='rgba(255,255,255,0.9)';g.fill();
      g.fillStyle='rgba(60,30,15,0.18)';g.fillRect(x-30,y-20,60,9);g.restore();
      g.beginPath();g.ellipse(x,y,27,15*open+2,0,Math.PI*1.05,Math.PI*1.95);g.lineWidth=6;g.strokeStyle='#2a1a10';g.stroke();}
    // brows
    const by=-40;g.beginPath();
    if(f==='worried'){g.moveTo(x-sd*24,by+2);g.lineTo(x+sd*20,by-10);}
    else if(f==='stern'){g.moveTo(x-sd*24,by-8);g.lineTo(x+sd*22,by+6);}
    else if(f==='shock'){g.moveTo(x-24,by-12);g.quadraticCurveTo(x,by-22,x+24,by-12);}
    else if(f==='smug'||f==='wink'){if(sd>0){g.moveTo(x-24,by-10);g.quadraticCurveTo(x,by-18,x+24,by-8);}else{g.moveTo(x-24,by);g.lineTo(x+24,by-2);}}
    else{g.moveTo(x-24,by);g.quadraticCurveTo(x,by-7,x+24,by-1);}
    g.lineWidth=11;g.strokeStyle=browC;g.lineCap='round';g.stroke();});
  // mouth
  const my=96;g.beginPath();g.lineCap='round';g.strokeStyle='#4a2418';
  if(f==='happy'||f==='laugh'){g.moveTo(-34,my-4);g.quadraticCurveTo(0,my+(f==='laugh'?34:24),34,my-4);g.quadraticCurveTo(0,my+6,-34,my-4);g.fillStyle='#5a2018';g.fill();
    g.beginPath();g.moveTo(-26,my-1);g.quadraticCurveTo(0,my+6,26,my-1);g.lineTo(24,my+5);g.quadraticCurveTo(0,my+11,-24,my+5);g.fillStyle='#f2ece0';g.fill();}
  else if(f==='shock'){g.ellipse(0,my+6,13,17,0,0,7);g.fillStyle='#4a1a12';g.fill();}
  else if(f==='smug'||f==='wink'){g.moveTo(-26,my+2);g.quadraticCurveTo(8,my+10,30,my-8);g.lineWidth=7;g.stroke();}
  else if(f==='worried'){g.moveTo(-26,my+6);g.quadraticCurveTo(0,my-4,26,my+6);g.lineWidth=7;g.stroke();}
  else if(f==='stern'){g.moveTo(-24,my+4);g.lineTo(24,my+4);g.lineWidth=7;g.stroke();}
  else{g.moveTo(-22,my+2);g.quadraticCurveTo(0,my+8,22,my+2);g.lineWidth=7;g.stroke();}
  // subtle nasolabial / chin shading for an older look
  g.strokeStyle='rgba(90,45,25,0.22)';g.lineWidth=4;[-1,1].forEach(sd=>{g.beginPath();g.moveTo(sd*40,52);g.quadraticCurveTo(sd*50,78,sd*42,100);g.stroke();});
  if(o.kind==='duke'){g.beginPath();g.moveTo(0,70);g.bezierCurveTo(-26,58,-58,80,-82,58);g.bezierCurveTo(-60,92,-24,84,0,78);g.bezierCurveTo(24,84,60,92,82,58);g.bezierCurveTo(58,80,26,58,0,70);g.fillStyle='#4a2a14';g.fill();}
  if(o.beard){g.beginPath();g.moveTo(-70,70);g.quadraticCurveTo(0,190,70,70);g.quadraticCurveTo(0,140,-70,70);g.fillStyle=o.beard;g.fill();}
  if(o.sweat){const sy=-60+((TT*60)%40);g.beginPath();g.moveTo(110,sy-24);g.bezierCurveTo(124,sy,120,sy+14,110,sy+14);g.bezierCurveTo(100,sy+14,96,sy,110,sy-24);g.fillStyle='#9fdcff';g.fill();}
}

// ---------- 3D characters (toon-shaded, big-head style, swappable face decal) ----------
// Pose angles per arm: f = forward swing (neg = forward/up), o = outward, e = elbow bend (neg = forward)
const POSE3={
  down:{L:{f:0.05,o:0.14,e:-0.2},R:{f:0.05,o:0.14,e:-0.2}},
  mug:{L:{f:0.05,o:0.14,e:-0.2},R:{f:-0.45,o:0.12,e:-1.55}},
  mugUp:{L:{f:0.05,o:0.18,e:-0.25},R:{f:-2.55,o:0.28,e:-0.35}},
  point:{L:{f:0.05,o:0.14,e:-0.2},R:{f:-2.3,o:0.32,e:-0.08}},
  stir:{L:{f:-0.85,o:-0.05,e:-0.75},R:{f:-1.0,o:0.05,e:-0.45}},
  throw:{L:{f:0.0,o:0.2,e:-0.3},R:{f:-2.05,o:0.3,e:-0.3}},
  hold:{L:{f:-0.55,o:-0.12,e:-1.25},R:{f:-0.55,o:-0.12,e:-1.25}},
  shrug:{L:{f:-0.25,o:0.95,e:-1.7},R:{f:-0.25,o:0.95,e:-1.7}},
  shovel:{L:{f:-0.7,o:-0.05,e:-0.9},R:{f:-0.95,o:0.1,e:-0.6}},
  cheer:{L:{f:-2.7,o:0.38,e:-0.2},R:{f:-2.7,o:0.38,e:-0.2}},
};
const ROBE={duke:'#2f4f9a',monk:'#7a5232',brewer:'#e9dcc0',baker:'#f4f1ea'};
const ERMINE=(()=>{const o=ctex(256,64,g=>{g.fillStyle='#fbf8f0';g.fillRect(0,0,256,64);for(let i=0;i<14;i++){g.fillStyle='#1a1a1a';g.beginPath();g.ellipse(9+i*18,18+(i%2)*26,3,6,0,0,7);g.fill();}});o.t.wrapS=THREE.RepeatWrapping;o.t.repeat.set(3,1);return o.t;})();
class Char3D{
  constructor(parent,x,z,o,s=1,{y=0}={}){
    this.o=o;this.s=s;this.tint=new THREE.Color(1,1,1);const kind=o.kind||'citizen';this.kind=kind;
    const skin=o.skin||SKIN[0];const robeC=mix(o.robe||ROBE[kind]||'#4f7fb8','#6a6058',0.22);
    const g=this.root=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);g.rotation.y=o.ry!==undefined?o.ry:(o.flip?-0.35:0.18*Math.sign(-x||1));parent.add(g);
    this.skinM=M(skin);const cl=M(robeC),cloth2=M(dk(robeC,0.3)),shoe=M('#3a2418');
    const body=this.body=new THREE.Group();g.add(body);
    const long=kind==='duke'||kind==='monk'||o.dress;
    if(!long){[-1,1].forEach(sd=>{mesh(new THREE.CapsuleGeometry(0.085,0.42,6,12),M(o.pants||'#3d3a48'),sd*0.11,0.38,0,body);sph(0.1,shoe,sd*0.11,0.07,0.05,body,1,0.6,1.5);});}
    else{const pts=[];for(let i=0;i<=12;i++){const t=i/12;pts.push(new THREE.Vector2(0.4-0.16*Math.pow(t,0.8),t*1.02));}pts.unshift(new THREE.Vector2(0,0));
      mesh(new THREE.LatheGeometry(pts,30),cl,0,0.02,0,body);[-1,1].forEach(sd=>sph(0.1,shoe,sd*0.13,0.05,0.3,body,1,0.55,1.4));
      if(kind==='duke'){const tr=mesh(new THREE.CylinderGeometry(0.035,0.055,1.0,10),M('#fbf8f0',{map:ERMINE}),0,0.52,0.36,body);tr.rotation.x=-0.18;}}
    const torso=mesh(new THREE.CapsuleGeometry(0.23,0.36,8,20),kind==='brewer'?M('#e9dcc0'):cl,0,1.05,0,body);torso.scale.set(1.12,1,0.74);torso.position.y=1.06;
    if(kind==='brewer'||kind==='baker'){const ap=mesh(new THREE.CylinderGeometry(0.255,0.34,0.95,24,1,true,-1.0,2.0),M(kind==='brewer'?'#3f7a4a':'#fffdf8',{side:THREE.DoubleSide}),0,0.72,0.02,body);ap.scale.set(1.08,1,0.85);
      const strap=mesh(new THREE.TorusGeometry(0.2,0.025,6,20,Math.PI),M(kind==='brewer'?'#3f7a4a':'#fffdf8'),0,1.18,0.12,body);strap.rotation.x=-0.4;}
    if(!long&&kind==='citizen'){const belt=mesh(new THREE.TorusGeometry(0.27,0.035,8,28),M('#4a2c1a'),0,0.85,0,body);belt.rotation.x=Math.PI/2;belt.scale.set(1.05,0.8,1);}
    if(kind==='monk'){const belt=mesh(new THREE.TorusGeometry(0.28,0.03,8,28),M('#d9c18a'),0,0.86,0,body);belt.rotation.x=Math.PI/2;belt.scale.set(1.05,0.82,1);
      const hood=mesh(new THREE.TorusGeometry(0.2,0.09,10,24),cl,0,1.36,-0.05,body);hood.rotation.x=Math.PI/2.4;}
    if(kind==='duke'){const col=mesh(new THREE.TorusGeometry(0.24,0.09,12,30),M('#ffffff',{map:ERMINE}),0,1.33,0,body);col.rotation.x=Math.PI/2;col.scale.set(1.1,0.85,1);
      const ch=mesh(new THREE.TorusGeometry(0.19,0.018,6,24,Math.PI),MAT.gold,0,1.2,0.14,body);ch.rotation.set(-0.35,0,Math.PI);sph(0.06,MAT.gold,0,1.02,0.24,body,1,1,0.5);}
    // head
    const neck=cyl(0.075,0.09,0.16,this.skinM,0,1.44,0,body,12);
    const head=this.head=new THREE.Group();head.position.set(0,1.64,0);head.scale.setScalar(0.74);body.add(head);
    sph(0.28,this.skinM,0,0,0,head,0.93,1.12,0.92);[-1,1].forEach(sd=>sph(0.06,this.skinM,sd*0.275,-0.01,-0.01,head,0.6,1,1));
    const nose=sph(0.042,this.skinM,0,-0.02,0.262,head,0.85,1.25,1.0);
    this.faceTex=ctex(512,384);const fg=new THREE.SphereGeometry(0.284,40,20,Math.PI/2-0.8,1.6,0.27*Math.PI,0.45*Math.PI);
    const fm=NO(new THREE.MeshToonMaterial({color:'#ffffff',gradientMap:gm,map:this.faceTex.t,transparent:true,alphaTest:0.25}));const face=new THREE.Mesh(fg,fm);face.scale.set(0.935,1.125,0.925);head.add(face);
    this.faceKey='';
    const hair=M(o.hair||'#6b4226');
    if(kind==='duke'){sph(0.285,hair,0,0.1,-0.05,head,0.96,0.95,0.97);
      const crown=new THREE.Group();crown.position.set(0,0.29,-0.01);head.add(crown);sph(0.19,M('#8a1a2a'),0,0.06,0,crown,1,0.7,1);
      cyl(0.215,0.205,0.13,MAT.gold,0,0.02,0,crown,28);for(let i=0;i<7;i++){const a=i/7*Math.PI*2;const pt=mesh(new THREE.ConeGeometry(0.045,0.13,8),MAT.gold,Math.sin(a)*0.205,0.15,Math.cos(a)*0.205,crown);sph(0.022,MAT.gold,Math.sin(a)*0.205,0.22,Math.cos(a)*0.205,crown);

function driftState(o,k,tau){const F=o._fit[k];return {c:F.c.clone().add(new THREE.Vector3(0,DRIFT.rise*tau*F.dist,0)),yaw:F.yaw+DRIFT.yaw*tau,pitch:F.pitch,dist:F.dist*Math.max(0.78,1-DRIFT.push*tau)};}
let SEGS=null;
function buildSegs(){SEGS=[];TL.scenes.forEach((sc,si)=>{const o=getScene(sc.name);if(!o._fit)o._fit=o.shots.map(sh=>fitShot(sh,o));
  o.shots.forEach((sh,k)=>SEGS.push({si,k,start:k===0?sc.start:sc.start+sh[0]-0.3}));});SEGS.forEach((g,i)=>g.end=i+1<SEGS.length?SEGS[i+1].start:TL.total);}
function segState(seg,t){const o=getScene(TL.scenes[seg.si].name);return driftState(o,seg.k,t-seg.start+0.4);}
function applyState(st){camera.fov=FOV;camera.setViewOffset(W,H,0,(0.5-LOOKY)*H,W,H);camera.updateProjectionMatrix();
  camera.position.copy(st.c).addScaledVector(dirFrom(st.yaw,st.pitch),st.dist);camera.lookAt(st.c);camera.updateMatrixWorld();}
function camSpeed(o,t){const a=camState(o,t),b=camState(o,t+1/30);const da=dirFrom(a.yaw,a.pitch),db=dirFrom(b.yaw,b.pitch);
  const pa=a.c.clone().addScaledVector(da,a.dist),pb=b.c.clone().addScaledVector(db,b.dist);
  const fa=a.c.clone().sub(pa).normalize(),fb=b.c.clone().sub(pb).normalize();
  return {ang:fa.angleTo(fb)*180/Math.PI*30, lin:pa.distanceTo(pb)*30/Math.max(0.5,a.dist)};}

// ================= compositor =================
const built={};
function getScene(name){if(!built[name]){built[name]=DEF[name].build();built[name].name=name;}return built[name];}
function velocity_unused(keys,t){const a=camAt(keys,t),b=camAt(keys,t+1/30);const da=a.l.clone().sub(a.p).normalize(),db=b.l.clone().sub(b.p).normalize();return da.angleTo(db)*30*900+a.p.distanceTo(b.p)*30*90;}
function grade2d(g,o){g.save();g.setTransform(1,0,0,1,0,0);if(o.mul){g.globalCompositeOperation='multiply';g.fillStyle=rgba(o.mul,o.a||0.1);g.fillRect(0,0,W,H);}
  if(o.scr){g.globalCompositeOperation='screen';g.fillStyle=rgba(o.scr,o.sa||0.05);g.fillRect(0,0,W,H);}
  g.globalCompositeOperation='source-over';const v=g.createRadialGradient(W/2,H*0.45,H*0.25,W/2,H*0.45,H*0.78);v.addColorStop(0,rgba(o.vigCol||'#140a04',0));v.addColorStop(1,rgba(o.vigCol||'#140a04',o.vig||0.4));g.fillStyle=v;g.fillRect(0,0,W,H);g.restore();}
function drawSeg(seg,t,target){const sc=TL.scenes[seg.si];const o=getScene(sc.name);const lt=t-sc.start;
  applyState(segState(seg,t));o.update(lt);outline.render(o.sc,camera);
  const g=target.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='contrast(1.08) saturate(0.86)';g.drawImage(glc,0,0);g.filter='none';grade2d(g,o.grade||{});}
let grain=[];function makeGrain(){for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const d=g.createImageData(540,960);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);grain.push(c);}}
let CH=null;
function buildChunks(){CH=[];const Wd=TL.words;for(let i=0;i<Wd.length;i++){let w=Wd[i].w,s=Wd[i].s,e=Wd[i].e;
  if(i+1<Wd.length&&(w.length<=4||Wd[i+1].w.length<=3)&&(w+' '+Wd[i+1].w).length<=13&&!/[.?!:,…]$/.test(w)&&Wd[i+1].s-e<0.2){w+=' '+Wd[i+1].w;e=Wd[i+1].e;i++;}CH.push({w,s,e});}}
function captions(t){let cur=null;for(let i=0;i<CH.length;i++){const c=CH[i];const nx=CH[i+1];const end=nx?Math.min(nx.s,c.e+0.35):c.e+0.6;if(t>=c.s-0.03&&t<end){cur=c;break;}}if(!cur)return;
  const k=1+0.14*clamp(1-(t-cur.s)/0.09);mctx.save();mctx.translate(W/2,H*0.645);mctx.scale(k,k);mctx.font=`900 84px Nunito, NunitoX, sans-serif`;mctx.textAlign='center';mctx.textBaseline='middle';
  mctx.shadowColor='rgba(0,0,0,0.45)';mctx.shadowBlur=18;mctx.shadowOffsetY=6;mctx.lineWidth=16;mctx.strokeStyle='#1c1008';mctx.lineJoin='round';mctx.strokeText(cur.w,0,0);mctx.shadowColor='transparent';mctx.fillStyle=isKey(cur.w)?'#ffd34d':'#fff';mctx.fillText(cur.w,0,0);mctx.restore();}
const KEYW=['1516','Herzog','Weizen','Alltag','Mönche','tabu','Trinken','stark','Brot','Kloster','Dorf','Stadt','Bilsenkraut','Gerste','Hopfen','Wasser','Hefe','niemand','verboten','heiß','verdarb','Keller','Kastanien','Schatten','Biergarten','1.500','Bäcker','Brotgesetz'];
const isKey=w=>KEYW.some(k=>w.replace(/[.,?:!…]/g,'').split(' ').includes(k));
let KEYT=null;
window.renderFrame=f=>{const t=f/30;TT=t;setT(t);if(!SEGS)buildSegs();if(!KEYT)KEYT=TL.words.filter(w=>isKey(w.w)).map(w=>w.s);
  let j=SEGS.findIndex(g=>t>=g.start&&t<g.end);if(j<0)j=SEGS.length-1;
  const XF=0.42;let a=j,b=-1,w=0;
  if(j+1<SEGS.length&&t>SEGS[j].end-XF/2){b=j+1;w=(t-(SEGS[j].end-XF/2))/XF;}else if(j>0&&t<SEGS[j].start+XF/2){a=j-1;b=j;w=(t-(SEGS[j].start-XF/2))/XF;}
  // keyword punch-in: tiny zoom pulse on emphasised words
  let pz=1;for(const kt of KEYT){const d=t-kt;if(d>=0&&d<0.6)pz=Math.max(pz,1+0.035*Math.exp(-d*6)*(d<0.06?d/0.06:1));}
  drawSeg(SEGS[a],t,offA);if(b>=0)drawSeg(SEGS[b],t,offB);
  mctx.setTransform(1,0,0,1,0,0);mctx.save();mctx.translate(W/2,H*0.4);mctx.scale(pz,pz);mctx.translate(-W/2,-H*0.4);
  mctx.globalAlpha=1;mctx.drawImage(offA,0,0);if(b>=0){mctx.globalAlpha=smooth(clamp(w));mctx.drawImage(offB,0,0);mctx.globalAlpha=1;}mctx.restore();
  mctx.save();mctx.globalCompositeOperation='screen';mctx.globalAlpha=0.16;mctx.filter='blur(26px) brightness(1.05)';mctx.drawImage(main,0,0);mctx.restore();
  // filmic split tone + grain
  mctx.save();mctx.globalCompositeOperation='soft-light';mctx.fillStyle='rgba(30,70,90,0.18)';mctx.fillRect(0,0,W,H);mctx.restore();
  mctx.save();mctx.globalCompositeOperation='overlay';mctx.globalAlpha=0.07;mctx.drawImage(grain[f%4],0,0,W,H);mctx.restore();
  // retention: curiosity title in the first seconds
  const ta=t<2.6?1:clamp(1-(t-2.6)/0.4);if(ta>0){mctx.save();mctx.globalAlpha=ta;mctx.font='900 50px Nunito, NunitoX, sans-serif';mctx.textAlign='center';mctx.textBaseline='middle';
    const l1='1516',l2='DAS SELTSAMSTE BIERGESETZ';mctx.fillStyle='rgba(12,8,4,0.55)';mctx.beginPath();mctx.roundRect(W/2-380,118,760,150,26);mctx.fill();
    mctx.fillStyle='#ffd34d';mctx.font='900 64px Nunito, NunitoX, sans-serif';mctx.fillText(l1,W/2,163);mctx.fillStyle='#ffffff';mctx.font='900 46px Nunito, NunitoX, sans-serif';mctx.fillText(l2,W/2,225);mctx.restore();}
  captions(t);
  // progress bar
  mctx.fillStyle='rgba(255,255,255,0.18)';mctx.fillRect(0,H-10,W,10);mctx.fillStyle='#ffd34d';mctx.fillRect(0,H-10,W*clamp(t/TL.total),10);
  return main.toDataURL('image/jpeg',0.92);};
window.init=async tl=>{TL=tl;makeGrain();buildChunks();await document.fonts.load('900 92px Nunito');await document.fonts.load('900 40px NunitoX');
  for(const s of TL.scenes)getScene(s.name);return document.fonts.check('900 92px Nunito')+' gl:'+renderer.getContext().getParameter(renderer.getContext().VERSION);};

// QA: per shot, project the required points and raycast for occluders; per scene, peak camera speed
window.qaShots=()=>{const out=[];const rc=new THREE.Raycaster();rc.camera=camera;
  TL.scenes.forEach(sc=>{const o=getScene(sc.name);if(!o._path)buildPath(o);const dur=sc.end-sc.start;
    o.shots.forEach((sh,k)=>{const tc=Math.min(dur-0.05,Math.max(0.05,sh[0]+0.2));
      applyState(camState(o,tc));o.update(tc);o.sc.updateMatrixWorld(true);const res={scene:sc.name,shot:k,t:+(sc.start+tc).toFixed(2),pts:[]};
      sh[2].forEach(p=>{const v=typeof p==='string'?o.anchors[p.split(':')[0]].anchor(p.split(':')[1]):new THREE.Vector3(...p);const pr=v.clone().project(camera);const sx=(pr.x+1)/2*100,sy=(1-pr.y)/2*100;
        const dir=v.clone().sub(camera.position);const dist=dir.length();rc.set(camera.position.clone(),dir.normalize());rc.far=dist;
        const hits=rc.intersectObjects(o.sc.children,true).filter(h=>h.object.isMesh&&h.object.visible&&h.object.material&&!h.object.material.transparent&&h.distance<dist-0.35);
        res.pts.push({p,sx:+sx.toFixed(1),sy:+sy.toFixed(1),ok:sx>=4&&sx<=96&&sy>=3&&sy<=62,occ:hits.length?(hits[0].object.geometry.type+'@'+hits[0].point.toArray().map(x=>x.toFixed(1)).join(',')):null});});
      out.push(res);});
    let mx={ang:0,lin:0,t:0};const kAt=t=>{let k=0;o.shots.forEach((sh,i)=>{if(t>=sh[0]-0.3)k=i;});return k;};for(let t=0;t<dur-0.05;t+=1/30){if(kAt(t)!==kAt(t+1/30))continue;const v=camSpeed(o,t);if(v.ang>mx.ang)mx={ang:+v.ang.toFixed(1),lin:+v.lin.toFixed(2),t:+t.toFixed(2)};}
    out.push({scene:sc.name,peak:mx});});
  return out;};
