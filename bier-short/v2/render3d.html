<script type="module">
import * as THREE from 'three';
import {OutlineEffect} from './OutlineEffect.js';
const W=1080,H=1920;
const glc=document.getElementById('gl');
const main=document.getElementById('c'),mctx=main.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.useLegacyLights=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const outline=new OutlineEffect(renderer,{defaultThickness:0.0042,defaultColor:[0.14,0.08,0.04],defaultAlpha:1});
const camera=new THREE.PerspectiveCamera(40,W/H,0.05,300);
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
const offA=mk(),offB=mk();
let TL=null,TT=0;

// ---------------- helpers ----------------
const gm=(()=>{const d=new Uint8Array([110,190,255]);const t=new THREE.DataTexture(d,3,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const M=(c,o={})=>new THREE.MeshToonMaterial({color:c,gradientMap:gm,...o});
const NO=m=>{m.userData.outlineParameters={visible:false};return m;};
const E=(c,o={})=>NO(new THREE.MeshBasicMaterial({color:c,...o}));
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;const o={c,g:c.getContext('2d'),t,paint(f){setCtx(o.g);o.g.setTransform(1,0,0,1,0,0);o.g.clearRect(0,0,w,h);f(o.g);t.needsUpdate=true;}};if(fn)o.paint(fn);return o;}
function tiled(w,h,rx,ry,fn){const o=ctex(w,h,fn);o.t.wrapS=o.t.wrapT=THREE.RepeatWrapping;o.t.repeat.set(rx,ry);return o.t;}
function stoneTex(base,rx,ry,bw=128,bh=72){return tiled(512,512,rx,ry,g=>{g.fillStyle=base;g.fillRect(0,0,512,512);for(let r=0;r<512/bh+1;r++)for(let c=-1;c<512/bw+1;c++){const x=c*bw+(r%2)*bw/2,y=r*bh;g.fillStyle=mix(base,rnd(r*31+c)>0.5?'#ffffff':'#1a0e08',0.05+rnd(r*7+c*3)*0.07);g.fillRect(x+3,y+3,bw-6,bh-6);g.strokeStyle=dk(base,0.3);g.lineWidth=4;g.strokeRect(x+2,y+2,bw-4,bh-4);}});}
function woodTex(base,rx=1,ry=1){return tiled(512,512,rx,ry,g=>{g.fillStyle=base;g.fillRect(0,0,512,512);for(let i=0;i<8;i++){g.fillStyle=mix(base,i%2?'#ffffff':'#000000',0.05);g.fillRect(0,i*64,512,64);g.strokeStyle=dk(base,0.35);g.lineWidth=4;g.beginPath();g.moveTo(0,i*64);g.lineTo(512,i*64);g.stroke();for(let k=0;k<3;k++){g.beginPath();g.ellipse(rnd(i*9+k)*512,i*64+32,40,8,0,0,7);g.strokeStyle=dk(base,0.18);g.lineWidth=3;g.stroke();}}});}
function plainNoise(base,rx,ry,dots='#000000',a=0.08){return tiled(512,512,rx,ry,g=>{g.fillStyle=base;g.fillRect(0,0,512,512);for(let i=0;i<260;i++){g.fillStyle=rgba(dots,a*rnd(i*3.3));g.beginPath();g.ellipse(rnd(i)*512,rnd(i*1.7)*512,6+rnd(i*2)*22,4+rnd(i*5)*12,rnd(i*8)*3,0,7);g.fill();}});}
function gradBg(stops){const o=ctex(4,512,g=>{const gr=g.createLinearGradient(0,0,0,512);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));g.fillStyle=gr;g.fillRect(0,0,4,512);});return o.t;}
const RAD=ctex(128,128,g=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.35,'rgba(255,255,255,0.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);}).t;
const SHAFT=ctex(64,256,g=>{const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(255,255,255,0.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,256);const h=g.createLinearGradient(0,0,64,0);}).t;
function glowSprite(color,size,op=0.8){const m=NO(new THREE.SpriteMaterial({map:RAD,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));const s=new THREE.Sprite(m);s.scale.set(size,size,1);return s;}
function shaft(len,w0,w1,color,op){const g=new THREE.CylinderGeometry(w0,w1,len,24,1,true);g.translate(0,-len/2,0);const m=NO(new THREE.MeshBasicMaterial({map:SHAFT,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));const me=new THREE.Mesh(g,m);return me;}
function mesh(geo,mat,x=0,y=0,z=0,parent=null){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
const box=(w,h,d,mat,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p);
const cyl=(rt,rb,h,mat,x,y,z,p,seg=28)=>mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p);
const sph=(r,mat,x,y,z,p,sx=1,sy=1,sz=1)=>{const m=mesh(new THREE.SphereGeometry(r,28,18),mat,x,y,z,p);m.scale.set(sx,sy,sz);return m;};
function popS(obj,lt,t0,base=1,dur=0.35){const k=pop(lt,t0,dur);obj.visible=k>0.001;obj.scale.setScalar(Math.max(0.0001,k*base));return k;}
function wt(word,after=-1){for(const w of TL.words){if(w.w.replace(/[.,?:!…\s]/g,'')===word&&w.s>after)return w.s;}console.error('word?',word);return 0;}

// ---------- 2D card in 3D (characters & flat props) ----------
const KPX=2.2/900;
class Card{
  constructor(parent,x,z,o,s=1,{wide=false,bill=true,y=0}={}){this.o=o;this.s=s;this.bill=bill;this.wide=wide;this.tint=new THREE.Color(1,1,1);
    const cw=wide?1024:512;this.tex=ctex(cw,900);
    const geo=new THREE.PlaneGeometry(cw*KPX*s,900*KPX*s);geo.translate(wide?(cw/2-256)*KPX*s:0,(450-880)*KPX*s*-1,0);
    this.mat=NO(new THREE.MeshBasicMaterial({map:this.tex.t,transparent:true,alphaTest:0.45,side:THREE.DoubleSide}));
    this.mesh=new THREE.Mesh(geo,this.mat);this.mesh.position.set(x,y,z);this.mesh.castShadow=true;
    this.mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:this.tex.t,alphaTest:0.45});
    parent.add(this.mesh);this.key='';}
  update(lt,st={}){const opts={...this.o,...st};const F=opts.f;const key=JSON.stringify([F,opts.pose,opts.item,opts.tint,opts.sweat,Math.floor(TT*15)*(opts.sweat||opts.pose==='stir'||opts.pose==='shovel'?1:0)]);
    if(key!==this.key){this.key=key;this.tex.paint(g=>{g.translate(256,880);char({...opts,x:0,y:0,s:1.15,noShadow:true});});}
    if(this.bill){this.mesh.rotation.y=Math.atan2(camera.position.x-this.mesh.position.x,camera.position.z-this.mesh.position.z);}
    this.mat.color.copy(this.tint);}
}
class Flat{ // flat drawn prop panel
  constructor(parent,w,h,pxw,pxh,draw,{bill=false,lit=false}={}){this.tex=ctex(pxw,pxh);this.draw=draw;this.bill=bill;
    this.mat=lit?M('#ffffff',{map:this.tex.t,transparent:true,alphaTest:0.4,side:THREE.DoubleSide}):NO(new THREE.MeshBasicMaterial({map:this.tex.t,transparent:true,alphaTest:0.3,side:THREE.DoubleSide}));
    if(lit)NO(this.mat);
    this.mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),this.mat);this.mesh.castShadow=true;this.mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:this.tex.t,alphaTest:0.4});parent.add(this.mesh);this.key=null;this.pxw=pxw;this.pxh=pxh;}
  update(lt,key=0){if(key!==this.key){this.key=key;this.tex.paint(g=>this.draw(g,lt));}if(this.bill)this.mesh.rotation.y=Math.atan2(camera.position.x-this.mesh.getWorldPosition(new THREE.Vector3()).x,camera.position.z-this.mesh.getWorldPosition(new THREE.Vector3()).z);}
}
// ---------- 3D props ----------
const MAT={glass:NO(new THREE.MeshToonMaterial({color:'#e8f6f6',gradientMap:gm,transparent:true,opacity:0.45})),beer:M('#f0a51c',{emissive:'#5a3000'}),foam:M('#fffaf0'),
  copper:M('#d07a3a'),iron:M('#3a3a42'),wood:M('#8a5a32'),darkwood:M('#5e3a1f'),hoop:M('#4a4a52'),bread:M('#c47a32'),leaf:M('#4f8f3a',{flatShading:true}),leaf2:M('#5fa043',{flatShading:true}),trunk:M('#6b4226'),white:M('#fbf6ea'),red:M('#c4281f'),gold:M('#e2b23c')};
function mug3d(parent,x,y,z,s=1,liq){const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);parent.add(g);
  const beerM=liq?M(liq,{emissive:dk(liq,0.7)}):MAT.beer;
  const b=cyl(0.1,0.1,0.21,beerM,0,0.115,0,g);const gl=cyl(0.118,0.118,0.25,MAT.glass,0,0.125,0,g);gl.castShadow=false;
  for(let i=0;i<7;i++){const a=i/7*Math.PI*2;sph(0.055,MAT.foam,Math.cos(a)*0.07,0.26,Math.sin(a)*0.07,g);}sph(0.07,MAT.foam,0,0.28,0,g);
  const h=mesh(new THREE.TorusGeometry(0.07,0.018,10,20,Math.PI),MAT.glass,0.12,0.13,0,g);h.rotation.z=-Math.PI/2;g.userData.beer=b;return g;}
function barrel3d(parent,x,y,z,s=1,ry=0){const pts=[];for(let i=0;i<=10;i++){const t=i/10;pts.push(new THREE.Vector2(0.33+Math.sin(t*Math.PI)*0.07,t*0.9));}
  const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);g.rotation.y=ry;parent.add(g);
  const tex=tiled(256,256,6,1,gg=>{gg.fillStyle='#9a6236';gg.fillRect(0,0,256,256);for(let i=0;i<4;i++){gg.fillStyle=mix('#9a6236','#000000',0.15*rnd(i));gg.fillRect(i*64,0,60,256);gg.fillStyle=dk('#9a6236',0.4);gg.fillRect(i*64+60,0,4,256);}});
  mesh(new THREE.LatheGeometry(pts,24),M('#ffffff',{map:tex}),0,0,0,g);
  [0.14,0.76].forEach(h=>{const t=mesh(new THREE.TorusGeometry(0.37,0.022,8,30),MAT.hoop,0,h,0,g);t.rotation.x=Math.PI/2;});
  const top=cyl(0.33,0.33,0.02,MAT.wood,0,0.9,0,g);g.userData.top=top;return g;}
function candle3d(parent,x,y,z,s=1,col='#ffb347',inten=1.4,dist=6){const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);parent.add(g);
  cyl(0.05,0.05,0.25,M('#f5ecd6'),0,0.125,0,g);const f=sph(0.035,E('#ffd255'),0,0.29,0,g,1,1.8,1);f.castShadow=false;
  const gs=glowSprite(col,0.9,0.85);gs.position.set(0,0.3,0);g.add(gs);const L=new THREE.PointLight(col,inten,dist,2);L.position.set(0,0.35,0);g.add(L);g.userData={L,f,base:inten};return g;}
function flicker(c,k=0.15){c.userData.L.intensity=c.userData.base*(1+Math.sin(TT*17+c.position.x*3)*k*0.6+Math.sin(TT*31)*k*0.4);c.userData.f.scale.y=1.8+Math.sin(TT*23+c.position.x)*0.3;}
function tree3d(parent,x,z,s=1,seed=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);parent.add(g);
  cyl(0.18,0.28,2.6,MAT.trunk,0,1.3,0,g,10);
  const blobs=[[0,3.4,0,1.5],[-1.0,3.0,0.2,1.1],[1.0,3.0,-0.1,1.1],[0.2,4.2,0.3,1.1],[-0.5,3.8,-0.6,1.0],[0.6,3.7,0.7,1.0]];
  blobs.forEach(([a,b,c,r],i)=>{const m=mesh(new THREE.IcosahedronGeometry(r,1),i%2?MAT.leaf:MAT.leaf2,a,b,c,g);m.rotation.set(rnd(seed+i),rnd(seed*2+i),0);});
  for(let i=0;i<14;i++){const a=rnd(seed*5+i)*Math.PI*2,r=1.2+rnd(seed+i*3)*0.4;const c=mesh(new THREE.ConeGeometry(0.07,0.22,6),MAT.white,Math.cos(a)*r,3.0+rnd(i*7+seed)*1.4,Math.sin(a)*r,g);c.castShadow=false;}
  return g;}
function fachwerkTex(col,seed){return ctex(512,512,g=>{g.fillStyle=col;g.fillRect(0,0,512,512);g.strokeStyle='#4a2c1a';g.lineWidth=22;g.strokeRect(0,0,512,512);
  [180,330].forEach(y=>{g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke();});[170,340].forEach(x=>{g.beginPath();g.moveTo(x,0);g.lineTo(x,512);g.stroke();});
  g.beginPath();g.moveTo(0,0);g.lineTo(170,180);g.moveTo(512,0);g.lineTo(340,180);g.stroke();
  for(let i=0;i<3;i++){g.fillStyle=rnd(seed+i)>0.4?'#ffe39a':'#6fa3c9';g.fillRect(i*170+40,215,90,85);g.strokeStyle='#3a2314';g.lineWidth=8;g.strokeRect(i*170+40,215,90,85);}
  g.fillStyle='#6b3d22';g.fillRect(212,380,88,132);}).t;}
function house3d(parent,x,z,w,h,d,col,roof,ry=0,seed=1){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;parent.add(g);
  const fm=M('#ffffff',{map:fachwerkTex(col,seed)});const side=M(col);
  const b=box(w,h,d,[side,side,side,side,fm,fm],0,h/2,0,g);
  const shape=new THREE.Shape();shape.moveTo(-w/2-0.2,0);shape.lineTo(0,w*0.55);shape.lineTo(w/2+0.2,0);shape.lineTo(-w/2-0.2,0);
  const rg=new THREE.ExtrudeGeometry(shape,{depth:d+0.4,bevelEnabled:false});rg.translate(0,0,-(d+0.4)/2);mesh(rg,M(roof),0,h,0,g);
  box(0.35,0.9,0.35,M('#8a6a5a'),w*0.25,h+w*0.35,0,g);return g;}
function table3d(parent,x,z,w,d,h=0.85,mat=MAT.wood){const g=new THREE.Group();g.position.set(x,0,z);parent.add(g);box(w,0.1,d,mat,0,h,0,g);[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(0.1,h,0.1,MAT.darkwood,a*(w/2-0.15),h/2,b*(d/2-0.12),g));return g;}
function room(scene,{w=16,d=14,h=9,wall,floor,wallRep=[4,2],floorRep=[4,4]}){const fl=mesh(new THREE.PlaneGeometry(w,d),M('#ffffff',{map:floor}),0,0,-d/2+3,scene);fl.rotation.x=-Math.PI/2;fl.castShadow=false;
  const wm=M('#ffffff',{map:wall});const bw=box(w,h,0.4,wm,0,h/2,-d+3,scene);
  [-1,1].forEach(s=>{const sw=box(0.4,h,d,wm,s*w/2,h/2,-d/2+3,scene);});return {fl,bw};}
function windowGlow(parent,x,y,z,w,h,col,ry=0,arch=true){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;parent.add(g);
  const sh=new THREE.Shape();sh.moveTo(-w/2,-h/2);sh.lineTo(w/2,-h/2);sh.lineTo(w/2,h/2-(arch?w/2:0));if(arch)sh.absarc(0,h/2-w/2,w/2,0,Math.PI,false);sh.lineTo(-w/2,h/2-(arch?w/2:0));sh.lineTo(-w/2,-h/2);
  const pane=new THREE.Mesh(new THREE.ShapeGeometry(sh,24),E(col));g.add(pane);
  box(0.12,h,0.12,MAT.darkwood,0,0,0.05,g);box(w,0.12,0.12,MAT.darkwood,0,0,0.05,g);
  const frame=new THREE.Mesh(new THREE.ShapeGeometry(sh,24),E('#2a1a10'));frame.scale.set(1.08,1.05,1);frame.position.z=-0.01;g.add(frame);
  const gs=glowSprite(col,Math.max(w,h)*1.3,0.35);gs.position.z=0.2;g.add(gs);return g;}
function particlesSprites(parent,n,col,size,op,blend=THREE.NormalBlending){const arr=[];for(let i=0;i<n;i++){const m=NO(new THREE.SpriteMaterial({map:RAD,color:col,transparent:true,opacity:op,depthWrite:false,blending:blend}));const s=new THREE.Sprite(m);s.scale.setScalar(size);parent.add(s);arr.push(s);}return arr;}
function lightsBasic(scene,{hemi=['#ffffff','#444444',0.6],sun=null,amb=0}){const hl=new THREE.HemisphereLight(hemi[0],hemi[1],hemi[2]);scene.add(hl);
  let dl=null;if(sun){dl=new THREE.DirectionalLight(sun.c,sun.i);dl.position.set(...sun.p);dl.target.position.set(...(sun.t||[0,0,0]));scene.add(dl.target);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);const r=sun.r||12;Object.assign(dl.shadow.camera,{left:-r,right:r,top:r,bottom:-r,near:0.5,far:80});dl.shadow.bias=-0.0006;dl.shadow.radius=3;scene.add(dl);}
  if(amb){scene.add(new THREE.AmbientLight('#ffffff',amb));}return {hl,dl};}
function spotOn(scene,pos,target,col,inten,angle=0.5,pen=0.6){const s=new THREE.SpotLight(col,inten,0,angle,pen,1.2);s.position.set(...pos);s.target.position.set(...target);scene.add(s.target);s.castShadow=true;s.shadow.mapSize.set(2048,2048);s.shadow.bias=-0.0006;scene.add(s);return s;}

// ---------- camera keys ----------
function camAt(keys,t){let i=0;while(i<keys.length-1&&t>keys[i+1][0])i++;const a=keys[i],b=keys[Math.min(i+1,keys.length-1)];
  const u=b[0]===a[0]?0:clamp((t-a[0])/(b[0]-a[0]));const e=ease(u);const L=(k)=>lerp(a[k],b[k],e);
  const p=new THREE.Vector3(L(1),L(2),L(3)),l=new THREE.Vector3(L(4),L(5),L(6));
  p.lerp(l,Math.min(0.25,0.018*t));return {p,l,fov:lerp(a[7]||40,b[7]||40,e)};}
function applyCam(c){camera.position.copy(c.p);camera.lookAt(c.l);if(camera.fov!==c.fov){camera.fov=c.fov;camera.updateProjectionMatrix();}}

// ================= SCENES =================
const DEF={};
// ---- shared: hall (hook / twist) ----
function buildHall(mode){const dawn=mode==='dawn';const sc=new THREE.Scene();
  sc.background=gradBg(dawn?['#5a4038','#2a1810']:['#141020','#0a0608']);sc.fog=new THREE.Fog(dawn?'#4a3020':'#0c0812',9,30);
  room(sc,{w:16,d:12,h:10,wall:stoneTex(dawn?'#8a6f5a':'#5a4a48',5,3),floor:stoneTex(dawn?'#7a6250':'#4a3c3a',5,5,160,160)});
  [-5,5].forEach(x=>cyl(0.55,0.6,10,M(dawn?'#9b7f68':'#6a5a56'),x,5,-6.5,sc,20));
  const ban=ctex(256,512,g=>{g.fillStyle='#f2efe6';g.fillRect(0,0,256,512);for(let i=-2;i<10;i++)for(let j=-1;j<5;j++){if((i+j)%2)continue;g.fillStyle='#4f8fd6';g.beginPath();g.moveTo(j*64,i*64+32);g.lineTo(j*64+32,i*64);g.lineTo(j*64+64,i*64+32);g.lineTo(j*64+32,i*64+64);g.fill();}});
  [-3.2,-0.4].forEach(x=>{const b=mesh(new THREE.PlaneGeometry(1.7,3.6),M('#ffffff',{map:ban.t,side:THREE.DoubleSide}),x,6.0,-8.7,sc);});
  windowGlow(sc,3.2,6.0,-8.75,2.2,4.2,dawn?'#ffd9a0':'#4a6aa8');
  const sh=shaft(14,1.1,2.8,dawn?'#ffd59a':'#9bb8ff',dawn?0.28:0.1);sh.position.set(3.2,6.5,-8.4);sh.rotation.set(-0.95,0,0.42);sc.add(sh);
  // desk
  const deskTex=woodTex('#7b4a2a',2,1);const desk=box(4.6,1.0,1.5,M('#ffffff',{map:deskTex}),0,0.5,0,sc);
  box(4.8,0.08,1.62,M('#6a3e22'),0,1.02,0,sc);
  const duke=new Card(sc,-0.15,-1.1,{kind:'duke',skin:SKIN[0]},1.15);

  const wh=new Flat(sc,0.9,1.1,400,500,(g)=>{setCtx(g);wheat(200,480,1.3,9);});wh.mesh.position.set(1.4,1.25,1.0);wh.update(0,1);

// ================= compositor =================
const built={};
function getScene(name){if(!built[name])built[name]=DEF[name].build();return built[name];}
function velocity(keys,t){const a=camAt(keys,t),b=camAt(keys,t+1/30);const da=a.l.clone().sub(a.p).normalize(),db=b.l.clone().sub(b.p).normalize();return da.angleTo(db)*30*900+a.p.distanceTo(b.p)*30*90;}
function grade2d(g,o){g.save();g.setTransform(1,0,0,1,0,0);if(o.mul){g.globalCompositeOperation='multiply';g.fillStyle=rgba(o.mul,o.a||0.1);g.fillRect(0,0,W,H);}
  if(o.scr){g.globalCompositeOperation='screen';g.fillStyle=rgba(o.scr,o.sa||0.05);g.fillRect(0,0,W,H);}
  g.globalCompositeOperation='source-over';const v=g.createRadialGradient(W/2,H*0.45,H*0.25,W/2,H*0.45,H*0.78);v.addColorStop(0,rgba(o.vigCol||'#140a04',0));v.addColorStop(1,rgba(o.vigCol||'#140a04',o.vig||0.4));g.fillStyle=v;g.fillRect(0,0,W,H);g.restore();}
function drawScene(i,t,target){const sc=TL.scenes[i];const o=getScene(sc.name);const lt=t-sc.start;
  const c=camAt(o.keys,lt);applyCam(c);o.update(lt);outline.render(o.sc,camera);
  const g=target.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.drawImage(glc,0,0);grade2d(g,o.grade||{});return velocity(o.keys,lt);}
let grain=[];function makeGrain(){for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const d=g.createImageData(540,960);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);grain.push(c);}}
let CH=null;
function buildChunks(){CH=[];const Wd=TL.words;for(let i=0;i<Wd.length;i++){let w=Wd[i].w,s=Wd[i].s,e=Wd[i].e;
  if(i+1<Wd.length&&(w.length<=4||Wd[i+1].w.length<=3)&&(w+' '+Wd[i+1].w).length<=13&&!/[.?!:,…]$/.test(w)&&Wd[i+1].s-e<0.2){w+=' '+Wd[i+1].w;e=Wd[i+1].e;i++;}CH.push({w,s,e});}}
function captions(t){let cur=null;for(let i=0;i<CH.length;i++){const c=CH[i];const nx=CH[i+1];const end=nx?Math.min(nx.s,c.e+0.35):c.e+0.6;if(t>=c.s-0.03&&t<end){cur=c;break;}}if(!cur)return;
  const k=1+0.14*clamp(1-(t-cur.s)/0.09);mctx.save();mctx.translate(W/2,H*0.645);mctx.scale(k,k);mctx.font=`900 92px Nunito, NunitoX, sans-serif`;mctx.textAlign='center';mctx.textBaseline='middle';
  mctx.shadowColor='rgba(0,0,0,0.45)';mctx.shadowBlur=18;mctx.shadowOffsetY=6;mctx.lineWidth=16;mctx.strokeStyle='#1c1008';mctx.lineJoin='round';mctx.strokeText(cur.w,0,0);mctx.shadowColor='transparent';mctx.fillStyle='#fff';mctx.fillText(cur.w,0,0);mctx.restore();}
window.renderFrame=f=>{const t=f/30;TT=t;setT(t);const sc=TL.scenes;let i=sc.findIndex(s=>t>=s.start&&t<s.end);if(i<0)i=sc.length-1;
  const XF=0.2;let j=-1,w=0;if(i+1<sc.length&&t>sc[i].end-XF/2){j=i+1;w=(t-(sc[i].end-XF/2))/XF;}else if(i>0&&t<sc[i].start+XF/2){j=i;i=i-1;w=(t-(sc[j].start-XF/2))/XF;}
  const v=drawScene(i,t,offA);mctx.setTransform(1,0,0,1,0,0);mctx.globalAlpha=1;mctx.filter=v>140?`blur(${Math.min(6,(v-140)/60)}px)`:'none';mctx.drawImage(offA,0,0);mctx.filter='none';
  if(j>=0){drawScene(j,t,offB);mctx.globalAlpha=clamp(w);mctx.drawImage(offB,0,0);mctx.globalAlpha=1;}
  mctx.save();mctx.globalCompositeOperation='screen';mctx.globalAlpha=0.2;mctx.filter='blur(26px) brightness(1.1)';mctx.drawImage(main,0,0);mctx.restore();
  mctx.save();mctx.globalCompositeOperation='overlay';mctx.globalAlpha=0.06;mctx.drawImage(grain[f%4],0,0,W,H);mctx.restore();
  captions(t);
  if(t<0.15||t>TL.total-0.35){mctx.fillStyle=`rgba(0,0,0,${t<0.15?1-t/0.15:clamp((t-(TL.total-0.35))/0.35)})`;mctx.fillRect(0,0,W,H);}
  return main.toDataURL('image/jpeg',0.92);};
window.init=async tl=>{TL=tl;makeGrain();buildChunks();await document.fonts.load('900 92px Nunito');await document.fonts.load('900 40px NunitoX');
  for(const s of TL.scenes)getScene(s.name);return document.fonts.check('900 92px Nunito')+' gl:'+renderer.getContext().getParameter(renderer.getContext().VERSION);};
