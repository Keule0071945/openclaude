<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Drohnenflug durch eine Voxelwelt im letzten Sonnenlicht: Punktlichter, Gottesstrahlen, Bewegungsunschaerfe und anamorpher Bloom, 58 Sekunden ohne Schnitt.">
<title>Meadow Hill Flyover</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{ --ground:#0c0913; --ink:#efe7ff; --muted:#8b80ad;
    --pixel:'Silkscreen','Courier New',monospace;
    --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(120% 90% at 50% 0%, #17122a 0%, var(--ground) 70%, #070510 100%);
    color:var(--ink);font-family:var(--mono);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .film{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:12px}
  .frame{
    position:relative;line-height:0;border-radius:4px;overflow:hidden;background:#07050e;
    box-shadow:0 24px 70px rgba(0,0,0,.62);cursor:pointer;
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#1a1526}
  .caption{
    position:absolute;left:3%;bottom:6.5%;pointer-events:none;
    font-family:var(--pixel);font-size:clamp(11px,1.5vw,18px);letter-spacing:.04em;
    color:#fff6e6;text-shadow:0 2px 10px rgba(0,0,0,.75);
    opacity:0;transition:opacity .9s ease;
  }
  .titlecard{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;pointer-events:none;
    opacity:0;transition:opacity 1.1s ease;
  }
  .titlecard b{
    font-family:var(--pixel);font-weight:700;font-size:clamp(18px,3.6vw,40px);
    letter-spacing:.1em;color:#fff8ea;text-shadow:0 4px 24px rgba(0,0,0,.7);
  }
  .titlecard span{
    font-size:clamp(9px,1.2vw,13px);letter-spacing:.4em;color:#f0dcc4;
    text-shadow:0 2px 12px rgba(0,0,0,.7);
  }
  .paused{
    position:absolute;right:3%;top:5.5%;pointer-events:none;font-family:var(--pixel);
    font-size:clamp(10px,1.2vw,14px);color:#fff4dd;text-shadow:0 2px 8px rgba(0,0,0,.8);
    opacity:0;transition:opacity .25s ease;
  }
  .foot{
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:11.5px;letter-spacing:.04em;color:var(--muted);
  }
  .foot b{color:var(--ink);font-weight:500}
  .oops{padding:40px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
</style>

</head>
<body>
<main class="film">
  <div class="frame" id="frame">
    <canvas id="scene" role="img"
      aria-label="Durchgehender Drohnenflug durch eine Voxelwelt in goldenem Abendlicht: über Windmühle, Dorf, Lagerfeuer und See, über die Inselkante am Wasserfall hinab und unter der schwebenden Insel hindurch zurück in die Höhe."></canvas>
    <div class="caption" id="caption"></div>
    <div class="titlecard" id="titlecard"><b>MEADOW HILL</b><span>EINE SCHWEBENDE INSEL</span></div>
    <div class="paused" id="pausedTag">PAUSE</div>
  </div>
  <p class="foot">
    <span><b>Eine Einstellung</b>, 64 Sekunden, nahtlos geloopt · WebGL, Schattenwurf und Bloom</span>
    <span>Klick oder Leertaste pausiert</span>
  </p>
</main>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('scene');
  var gl = cv.getContext('webgl2', {antialias:false, alpha:false, preserveDrawingBuffer:true});
  if(!gl){
    document.querySelector('.frame').innerHTML =
      '<p class="oops">Dieser Flug braucht WebGL2.<br>Bitte in einem aktuellen Browser öffnen.</p>';
    return;
  }
  var hdrExt = gl.getExtension('EXT_color_buffer_float');
  var linExt = gl.getExtension('OES_texture_float_linear');

  /* ---------------- Palette ---------------- */
  var PAL = {
    grass:'#5cb04a', grassLt:'#79c95c', grassDk:'#3f8f43',
    sand:'#e3cd94', dirt:'#9c6c40', dirtDk:'#7a5230',
    rock:'#7c8098', rockDk:'#5c6076',
    path:'#d8bd8b', water:'#3fa8d0', waterLt:'#63c8e2', waterDk:'#2b86b0',
    wood:'#9a6a3e', woodDk:'#6d4a2c',
    wall:'#f0dfbe', wallDk:'#cfb896', win:'#6d8ab0',
    roofA:'#d4645c', roofB:'#5f8fc4', roofC:'#d99a4f',
    leaf:'#4fa14a', leafDk:'#2f7440', leafLt:'#79c25c',
    pine:'#3d8c5a', pineDk:'#2a6a45',
    fleece:'#f5eee0', duck:'#fbf6ea', ink:'#2b2038',
    cat:'#ef9f52', catDk:'#c9762f',
    cloud:'#e9eefb', mist:'#dff0f7',
    stone:'#a9adc2', canvasT:'#e07a63'
  };
  var EM = { win:'#ffd27a', fire:'#ffb03a', fireHot:'#fff2b0', lamp:'#ffdf9a', fly:'#d8ff96' };
  var LIGHTS = true;
  var SHADOW_C = [[-4,3,7.5],[9,-6,6.5],[3,11,8.5]];


  /* =========================================================
     Welt: 52x52-Raster, Radius 23 (rund dreifache Fläche)
     ========================================================= */
  var G = 52, CX = 25.5, CY = 25.5, RAD = 23.0;
  var SLAB = -5.5, WATER_Z = 4.0;
  var LAKE_X = 15.5, LAKE_Y = 34.0, LAKE_R = 7.5;
  var VIL_X = 37.0, VIL_Y = 20.0;
  var FARM_X = 34.0, FARM_Y = 36.5;
  var heights = new Float32Array(G*G);
  var kinds = new Uint8Array(G*G);
  var paved = new Uint8Array(G*G);
  var K_VOID = 0, K_LAND = 1, K_WATER = 2;
  var terrain = [];
  var spillDir = [0,0], spillPt = [0,0];

  function idx(i,j){ return j*G + i; }
  function hAt(x,y){
    var i = Math.round(x), j = Math.round(y);
    if(i<0||j<0||i>=G||j>=G) return 0;
    return heights[idx(i,j)];
  }
  function kindAt(i,j){
    if(i<0||j<0||i>=G||j>=G) return K_VOID;
    return kinds[idx(i,j)];
  }


  /* --------- Stadt: Gasse, Torbögen, Marktplatz --------- */
  var ST = [[46,20],[30,20],[24,26]];        // Hauptgasse und Knick
  var MARKT = [28.5, 20.5];
  function segDist(px,py, ax,ay, bx,by){
    var vx=bx-ax, vy=by-ay, l2=vx*vx+vy*vy;
    var t = l2 > 0 ? Math.max(0, Math.min(1, ((px-ax)*vx + (py-ay)*vy)/l2)) : 0;
    var dx = px-(ax+vx*t), dy = py-(ay+vy*t);
    return { d: Math.hypot(dx,dy), t: t };
  }
  function streetDist(i,j){
    var best = 999;
    for(var k=0;k<ST.length-1;k++){
      var r = segDist(i,j, ST[k][0],ST[k][1], ST[k+1][0],ST[k+1][1]);
      if(r.d < best) best = r.d;
    }
    return best;
  }

  var PATH_PTS = [
    [28,22],[27,26],[26,31],[24,34],[20,35],[17.5,34],
    null,
    [30,23],[32,29],[33.5,35.5],
    null,
    [26,27],[27,33],[28,37.5]
  ];
  function onPath(i,j){
    for(var k=0;k<PATH_PTS.length-1;k++){
      var a = PATH_PTS[k], b = PATH_PTS[k+1];
      if(!a || !b) continue;
      var vx = b[0]-a[0], vy = b[1]-a[1], l2 = vx*vx+vy*vy;
      var t = Math.max(0, Math.min(1, ((i-a[0])*vx + (j-a[1])*vy)/l2));
      var dx = i - (a[0]+vx*t), dy = j - (a[1]+vy*t);
      if(dx*dx+dy*dy < 0.75) return true;
    }
    return false;
  }

  function buildTerrain(){
    var dl = Math.hypot(LAKE_X-CX, LAKE_Y-CY);
    spillDir = [(LAKE_X-CX)/dl, (LAKE_Y-CY)/dl];
    for(var j=0;j<G;j++){
      for(var i=0;i<G;i++){
        var dx = i-CX, dy = j-CY, r = Math.hypot(dx,dy);
        if(r > RAD){ kinds[idx(i,j)] = K_VOID; continue; }
        var e = 1 - r/RAD;
        var h = 1.8 + 8.0*Math.pow(e, 0.42);
        h += 0.85*Math.sin(i*0.33+0.4)*Math.cos(j*0.29-0.2);
        h += 0.42*Math.sin((i+j)*0.4+1.1);
        // Waldhügel im Nordwesten
        var dh = Math.hypot(i-16.5, j-17.0);
        if(dh < 9.5){ var wh = Math.cos(dh/9.5*Math.PI/2); h += 3.6*wh*wh; }
        // Stadtkorridor entlang der Gasse, dazu der Marktplatz
        var sdv = streetDist(i,j);
        if(sdv < 9.0){ var w = Math.min(1,(9.0-sdv)/3.4); h = h*(1-w) + 7.0*w; }
        var dmk = Math.hypot(i-MARKT[0], j-MARKT[1]);
        if(dmk < 5.4){ var wm = Math.min(1,(5.4-dmk)/2.0); h = h*(1-wm) + 7.0*wm; }
        // Gehöft
        var df = Math.hypot(i-FARM_X, j-FARM_Y);
        if(df < 4.6){ var w2 = Math.min(1,(4.6-df)/2.0); h = h*(1-w2) + 6.0*w2; }
        // Seebecken
        var dk = Math.hypot(i-LAKE_X, j-LAKE_Y);
        if(dk < LAKE_R + 2.0){
          var wl = Math.min(1, (LAKE_R+2.0-dk)/3.4);
          h = h*(1-wl) + 2.4*wl;
        }
        // Abflussrinne zum Rand
        var proj = ((i-CX)*spillDir[0] + (j-CY)*spillDir[1]);
        var perp = Math.abs((i-CX)*(-spillDir[1]) + (j-CY)*spillDir[0]);
        if(proj > dl - 1.5 && perp < 2.2){
          var wc = Math.min(1, (2.2-perp)/1.6);
          h = h*(1-wc) + (3.2 - (proj-(dl-1.5))*0.14)*wc;
        }
        h = Math.round(h*2)/2;
        heights[idx(i,j)] = h;
        var isW = (h < WATER_Z - 0.2) && (dk < LAKE_R + 1.6 || (proj > dl-1.5 && perp < 2.0));
        kinds[idx(i,j)] = isW ? K_WATER : K_LAND;
        if(!isW && (onPath(i,j) || sdv < 1.95 || dmk < 4.3)) paved[idx(i,j)] = 1;
      }
    }
    spillPt = [CX + spillDir[0]*(RAD-0.8), CY + spillDir[1]*(RAD-0.8)];

    for(var j2=0;j2<G;j2++){
      for(var i2=0;i2<G;i2++){
        var k = kinds[idx(i2,j2)];
        if(k === K_VOID) continue;
        var h2 = heights[idx(i2,j2)];
        var isW2 = k === K_WATER;
        var top = isW2 ? WATER_Z : h2;
        var topC, sideC;
        if(isW2){ topC = PAL.water; sideC = PAL.waterDk; }
        else if(h2 < 4.2){ topC = PAL.sand; sideC = PAL.dirt; }
        else if(h2 > 11.4){
          var rk = (i2*5+j2*7) % 6;
          topC = rk < 2 ? '#7c8096' : (rk < 3 ? '#6f8f66' : PAL.rock);
          sideC = PAL.rockDk;
        }
        else if(paved[idx(i2,j2)]){
          topC = ((i2*5+j2*3) % 4 === 0) ? '#c9ab7a' : PAL.path;
          sideC = PAL.dirt;
        }
        else {
          topC = (i2*3+j2*5) % 7 < 2 ? PAL.grassLt : PAL.grass;
          sideC = PAL.dirt;
        }
        var nb = [], dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(var d=0; d<4; d++){
          var ni = i2+dirs[d][0], nj = j2+dirs[d][1];
          var nk = kindAt(ni,nj);
          nb.push(nk === K_VOID ? SLAB : Math.min(heights[idx(ni,nj)], isW2 ? top : 99));
        }
        terrain.push({
          x:i2-CX, y:j2-CY, z0:SLAB, z1:top, sx:1, sy:1,
          top:topC, side:sideC, water:isW2,
          nPX:nb[0], nMX:nb[1], nPY:nb[2], nMY:nb[3], bias:0
        });
      }
    }
  }
  buildTerrain();

  /* --------- statische Requisiten --------- */
  var props = [];
  var LP = [];                                   // Punktlichter der Welt
  function addLight(x,y,z,col,rad,inten){
    var c = [parseInt(col.slice(1,3),16)/255, parseInt(col.slice(3,5),16)/255, parseInt(col.slice(5,7),16)/255];
    LP.push({x:x-CX, y:y-CY, z:z, r:c[0]*inten, g:c[1]*inten, b:c[2]*inten, rad:rad});
  }
  function P(x,y,z0,z1,sx,sy,top,side,bias){
    props.push({x:x-CX, y:y-CY, z0:z0, z1:z1, sx:sx, sy:sy, top:top, side:side||top, bias:bias||0});
  }
  function Pe(x,y,z0,z1,sx,sy,col,bias){
    props.push({x:x-CX, y:y-CY, z0:z0, z1:z1, sx:sx, sy:sy, top:col, side:col, em:true, bias:bias||0});
  }
  function tree(x,y,s){
    var g = hAt(x,y);
    P(x,y,g-0.5,g+1.3*s, 0.4,0.4, PAL.woodDk, PAL.woodDk);
    P(x,y,g+1.2*s,g+2.4*s, 2.2*s,2.2*s, PAL.leaf, PAL.leafDk);
    P(x,y,g+2.4*s,g+3.2*s, 1.6*s,1.6*s, PAL.leafLt, PAL.leaf);
    P(x,y,g+3.2*s,g+3.6*s, 0.85*s,0.85*s, PAL.leafLt, PAL.leaf);
  }
  function pineTree(x,y,s){
    var g = hAt(x,y);
    P(x,y,g-0.5,g+1.0*s, 0.34,0.34, PAL.woodDk, PAL.woodDk);
    P(x,y,g+0.9*s,g+1.9*s, 2.1*s,2.1*s, PAL.pine, PAL.pineDk);
    P(x,y,g+1.9*s,g+2.8*s, 1.5*s,1.5*s, PAL.pine, PAL.pineDk);
    P(x,y,g+2.8*s,g+3.7*s, 0.9*s,0.9*s, PAL.pine, PAL.pineDk);
    P(x,y,g+3.7*s,g+4.1*s, 0.4*s,0.4*s, PAL.pineDk, PAL.pineDk);
  }
  function bushAt(x,y){
    var g = hAt(x,y);
    P(x,y,g-0.3,g+0.6, 1.1,1.1, PAL.leafDk, PAL.leafDk);
    P(x,y,g+0.6,g+0.95, 0.65,0.65, PAL.leaf, PAL.leafDk);
  }
  var HOUSES = [], LAMPS = [];
  function house(x,y,roof,w,d,hgt2){
    var g = hAt(x,y);
    P(x,y,g-0.7,g+hgt2, w,d, PAL.wall, PAL.wallDk);
    P(x,y,g+hgt2,g+hgt2+0.6, w+0.55,d+0.55, roof, roof);
    P(x,y,g+hgt2+0.6,g+hgt2+1.15, w*0.62,d*0.62, roof, roof);
    P(x,y,g+hgt2+1.15,g+hgt2+1.5, w*0.26,d*0.26, roof, roof);
    P(x+w*0.32, y-d*0.28, g+hgt2, g+hgt2+1.7, 0.45,0.45, PAL.stone, PAL.rockDk);
    // Fenster mit Rahmen
    var wz = g + 0.7;
    var sides = [[ w/2+0.04, -0.35, 0.08, 0.7],[ -w/2-0.04, 0.35, 0.08, 0.7],
                 [ 0.35, d/2+0.04, 0.7, 0.08],[ -0.35, -d/2-0.04, 0.7, 0.08]];
    for(var q=0;q<4;q++){
      var sd = sides[q];
      P(x+sd[0], y+sd[1], wz-0.14, wz+0.8, sd[2]+0.18, sd[3]+0.18, PAL.woodDk, PAL.woodDk, 0.9);
      P(x+sd[0], y+sd[1], wz, wz+0.62, sd[2]+0.05, sd[3]+0.05, PAL.win, PAL.win, 1.0);
    }
    P(x, y - d/2 - 0.05, g-0.7, g+1.3, 0.7, 0.12, PAL.woodDk, PAL.woodDk, 0.9);
    P(x, y - d/2 - 0.07, g-0.7, g+1.15, 0.54, 0.12, PAL.wood, PAL.wood, 1.0);
    P(x+0.18, y - d/2 - 0.12, g+0.55, g+0.66, 0.09, 0.09, EM.lamp, EM.lamp, 1.1);
    P(x, y - d/2 - 0.5, g-0.6, g-0.2, 1.0, 0.6, PAL.stone, PAL.rockDk, 0.6);
    P(x + w/2 + 0.14, y - 0.35, wz-0.38, wz-0.06, 0.24, 0.8, PAL.woodDk, PAL.woodDk, 1.0);
    P(x + w/2 + 0.14, y - 0.5, wz-0.06, wz+0.09, 0.22, 0.22, '#ff8fb1', '#ff8fb1', 1.1);
    P(x + w/2 + 0.14, y - 0.2, wz-0.06, wz+0.09, 0.22, 0.22, '#ffd166', '#ffd166', 1.1);
    HOUSES.push({x:x, y:y, g:g, w:w, d:d, h:hgt2, chx:x+w*0.32, chy:y-d*0.28, chz:g+hgt2+1.7, face:-1, dz:y-d/2-0.05, town:false});
  }
  function lampAt(x,y){
    var g = hAt(x,y);
    P(x,y,g-0.4,g+2.4, 0.22,0.22, PAL.woodDk, PAL.woodDk);
    P(x,y,g+2.4,g+2.85, 0.55,0.55, PAL.rockDk, PAL.rockDk);
    LAMPS.push({x:x, y:y, z:g+2.45});
    addLight(x, y, g+2.7, '#ffcf8a', 8.0, 0.70);
  }
  function fenceRun(x,y,dx,dy,n){
    for(var i=0;i<n;i++){
      var fx = x+dx*i, fy = y+dy*i, g = hAt(fx,fy);
      P(fx,fy,g-0.35,g+1.15, 0.24,0.24, PAL.wood, PAL.woodDk);
      if(i < n-1){
        P(fx+dx*0.5, fy+dy*0.5, g+0.5, g+0.7, dx?1:0.15, dy?1:0.15, PAL.wood, PAL.woodDk);
        P(fx+dx*0.5, fy+dy*0.5, g+0.88, g+1.08, dx?1:0.15, dy?1:0.15, PAL.wood, PAL.woodDk);
      }
    }
  }
  var CAMPFIRE = [28.0, 39.0], WINDMILL = [41.0, 15.5, 0], TOWER = [12.5, 26.0, 0];

  var ROOFS = ['#d4645c','#5f8fc4','#d99a4f','#a8563f','#6f8f5a','#c07a4a'];
  var DOORS = ['#7a4a2c','#3f5f8a','#8a4a5a','#4a6a4a','#8a6a2a','#9a4a3a'];
  var SHUT  = ['#4d6fb3','#b3564d','#6a8f4a','#8a5aa8','#c98a3a','#3f8a8a'];
  var GREATTREE = [25.5,25.5,0];

  function townHouse(x, y, face, seed){
    var g = hAt(x,y);
    var w = 2.3 + (seed % 3)*0.4, d = 2.5, hh = 2.3 + (seed % 4)*0.4;
    var roof = ROOFS[seed % ROOFS.length];
    P(x,y,g-0.9,g+hh, w,d, PAL.wall, PAL.wallDk);
    // Fachwerk
    P(x,y,g+hh*0.52-0.09,g+hh*0.52+0.09, w+0.05,d+0.05, PAL.woodDk, PAL.woodDk, 0.5);
    P(x-w/2+0.13,y,g-0.9,g+hh, 0.18,d+0.05, PAL.woodDk, PAL.woodDk, 0.5);
    P(x+w/2-0.13,y,g-0.9,g+hh, 0.18,d+0.05, PAL.woodDk, PAL.woodDk, 0.5);
    // überhängendes Obergeschoss zur Gasse
    var over = (seed % 2 === 0) ? 0.75 : 0.0;
    var oy = y + face*over*0.5, od = d + over;
    if(over > 0){
      P(x, oy, g+hh, g+hh+1.6, w+0.16, od, PAL.wall, PAL.wallDk);
      P(x, oy, g+hh+0.8-0.08, g+hh+0.8+0.08, w+0.22, od+0.05, PAL.woodDk, PAL.woodDk, 0.5);
      P(x, y + face*(d/2+0.1), g+hh-0.35, g+hh, 0.5, 0.6, PAL.woodDk, PAL.woodDk, 0.6);
    }
    var top = g + hh + (over>0 ? 1.6 : 0);
    P(x,oy, top, top+0.6, w+0.55, od+0.55, roof, roof);
    P(x,oy, top+0.6, top+1.2, w*0.66, od*0.66, roof, roof);
    P(x,oy, top+1.2, top+1.6, w*0.3, od*0.3, roof, roof);
    var chx = x + w*0.3, chy = y - face*d*0.3;
    P(chx, chy, top, top+1.7, 0.42,0.42, PAL.stone, PAL.rockDk);
    // Tür und Fenster zur Gasse
    var dz = y + face*(d/2 + 0.07);
    P(x, dz, g-0.9, g+1.4, 0.76, 0.13, PAL.woodDk, PAL.woodDk, 0.9);
    P(x, dz + face*0.03, g-0.9, g+1.25, 0.58, 0.13, DOORS[seed % DOORS.length], DOORS[seed % DOORS.length], 1.0);

  var dyn = [];
  function D(x,y,z0,z1,sx,sy,top,side,bias){
    dyn.push({x:x-CX, y:y-CY, z0:z0, z1:z1, sx:sx, sy:sy, top:top, side:side||top, bias:bias||0});
  }
  function De(x,y,z0,z1,sx,sy,col,bias){
    dyn.push({x:x-CX, y:y-CY, z0:z0, z1:z1, sx:sx, sy:sy, top:col, side:col, em:true, bias:bias||0});
  }

  // Mensch: Beine, Schuhe, Rumpf, Arme, Hände, Kopf, Haar
  function figure(x, y, g, dx, dy, ph, coat, pants, skin, hair, sc){
    sc = sc || 1;
    var lx = -dy, ly = dx;
    var sw = Math.sin(ph)*0.17*sc;
    var z = g - 0.12 + Math.abs(Math.cos(ph))*0.05*sc;
    D(x + dx*sw + lx*0.11*sc, y + dy*sw + ly*0.11*sc, z, z+0.42*sc, 0.15*sc,0.15*sc, pants, pants, 1.30);
    D(x - dx*sw - lx*0.11*sc, y - dy*sw - ly*0.11*sc, z, z+0.42*sc, 0.15*sc,0.15*sc, pants, pants, 1.30);
    D(x + dx*(sw+0.05) + lx*0.11, y + dy*(sw+0.05) + ly*0.11, z-0.02, z+0.10*sc, 0.20*sc,0.18*sc, '#3a2f2a','#3a2f2a', 1.32);
    D(x - dx*(sw+0.05) - lx*0.11, y - dy*(sw+0.05) - ly*0.11, z-0.02, z+0.10*sc, 0.20*sc,0.18*sc, '#3a2f2a','#3a2f2a', 1.32);
    D(x, y, z+0.40*sc, z+0.84*sc, 0.34*sc,0.25*sc, coat, coat, 1.34);
    D(x - dx*sw*0.85 + lx*0.24*sc, y - dy*sw*0.85 + ly*0.24*sc, z+0.44*sc, z+0.82*sc, 0.12*sc,0.12*sc, coat, coat, 1.36);
    D(x + dx*sw*0.85 - lx*0.24*sc, y + dy*sw*0.85 - ly*0.24*sc, z+0.44*sc, z+0.82*sc, 0.12*sc,0.12*sc, coat, coat, 1.36);
    D(x - dx*sw*0.95 + lx*0.24*sc, y - dy*sw*0.95 + ly*0.24*sc, z+0.38*sc, z+0.47*sc, 0.13*sc,0.13*sc, skin, skin, 1.38);
    D(x + dx*sw*0.95 - lx*0.24*sc, y + dy*sw*0.95 - ly*0.24*sc, z+0.38*sc, z+0.47*sc, 0.13*sc,0.13*sc, skin, skin, 1.38);
    D(x, y, z+0.84*sc, z+1.12*sc, 0.27*sc,0.25*sc, skin, skin, 1.40);
    D(x, y, z+1.07*sc, z+1.20*sc, 0.33*sc,0.31*sc, hair, hair, 1.42);
    D(x + dx*0.14*sc + lx*0.06*sc, y + dy*0.14*sc + ly*0.06*sc, z+0.96*sc, z+1.02*sc, 0.05*sc,0.05*sc, '#2b2038','#2b2038', 1.46);
    D(x + dx*0.14*sc - lx*0.06*sc, y + dy*0.14*sc - ly*0.06*sc, z+0.96*sc, z+1.02*sc, 0.05*sc,0.05*sc, '#2b2038','#2b2038', 1.46);
  }

  // Katze: vier Beine, Kopf mit Ohren, wippender Schwanz
  function catFig(x, y, z, dx, dy, ph){
    var lx = -dy, ly = dx;
    var a = Math.sin(ph)*0.10, b = Math.sin(ph + Math.PI)*0.10;
    var pairs = [[0.20, a, 0.11],[0.20, b, -0.11],[-0.20, b, 0.11],[-0.20, a, -0.11]];
    for(var i=0;i<4;i++){
      var px = x + dx*(pairs[i][0]+pairs[i][1]) + lx*pairs[i][2];
      var py = y + dy*(pairs[i][0]+pairs[i][1]) + ly*pairs[i][2];
      D(px, py, z, z+0.24, 0.10,0.10, PAL.catDk, PAL.catDk, 1.42);
    }
    D(x, y, z+0.22, z+0.50, 0.66,0.32, PAL.cat, PAL.catDk, 1.44);
    D(x + dx*0.40, y + dy*0.40, z+0.34, z+0.66, 0.31,0.29, PAL.cat, PAL.catDk, 1.46);
    D(x + dx*0.44 + lx*0.11, y + dy*0.44 + ly*0.11, z+0.64, z+0.76, 0.11,0.10, PAL.cat, PAL.catDk, 1.48);
    D(x + dx*0.44 - lx*0.11, y + dy*0.44 - ly*0.11, z+0.64, z+0.76, 0.11,0.10, PAL.cat, PAL.catDk, 1.48);
    D(x + dx*0.54 + lx*0.07, y + dy*0.54 + ly*0.07, z+0.48, z+0.55, 0.05,0.05, '#2b2038','#2b2038', 1.50);
    D(x + dx*0.54 - lx*0.07, y + dy*0.54 - ly*0.07, z+0.48, z+0.55, 0.05,0.05, '#2b2038','#2b2038', 1.50);
    for(var s=0;s<3;s++){
      var tz = z + 0.42 + s*0.10 + Math.sin(ph*1.5 + s*0.7)*0.05;
      D(x - dx*(0.38 + s*0.10), y - dy*(0.38 + s*0.10), tz, tz+0.11, 0.11,0.11, PAL.catDk, PAL.catDk, 1.44);
    }
  }

  function sheepFig(x, y, g, dx, dy, ph){
    var lx = -dy, ly = dx;
    var a = Math.sin(ph)*0.05;
    var z = g - 0.1;
    for(var i=0;i<4;i++){
      var fx = (i<2 ? 0.22 : -0.22), fy = (i%2 ? 0.14 : -0.14);
      D(x + dx*(fx + (i%2?a:-a)) + lx*fy, y + dy*(fx + (i%2?a:-a)) + ly*fy, z, z+0.26, 0.11,0.11, '#4a3a44','#4a3a44', 1.30);
    }
    D(x, y, z+0.24, z+0.68, 0.78,0.46, PAL.fleece, '#ded6c4', 1.32);
    D(x + dx*0.30, y + dy*0.30, z+0.52, z+0.76, 0.24,0.22, PAL.fleece, '#ded6c4', 1.34);
    D(x + dx*0.44, y + dy*0.44, z+0.46, z+0.68, 0.22,0.20, '#3c3340','#3c3340', 1.36);
    D(x + dx*0.40 + lx*0.13, y + dy*0.40 + ly*0.13, z+0.64, z+0.72, 0.10,0.08, '#3c3340','#3c3340', 1.38);
    D(x + dx*0.40 - lx*0.13, y + dy*0.40 - ly*0.13, z+0.64, z+0.72, 0.10,0.08, '#3c3340','#3c3340', 1.38);
  }

  function chickenFig(x, y, g, dx, dy, peck){
    var lx = -dy, ly = dx;
    var z = g - 0.08;
    D(x + lx*0.07, y + ly*0.07, z, z+0.12, 0.05,0.05, '#e0a54f','#e0a54f', 1.30);
    D(x - lx*0.07, y - ly*0.07, z, z+0.12, 0.05,0.05, '#e0a54f','#e0a54f', 1.30);
    D(x, y, z+0.10, z+0.36, 0.30,0.22, '#fbf6ea','#e3dccb', 1.32);
    D(x - dx*0.18, y - dy*0.18, z+0.26, z+0.44, 0.14,0.12, '#f2ece0','#ddd6c6', 1.33);
    D(x + dx*0.16, y + dy*0.16, z+0.32 - peck, z+0.50 - peck, 0.15,0.14, '#fbf6ea','#e3dccb', 1.34);
    D(x + dx*0.16, y + dy*0.16, z+0.50 - peck, z+0.56 - peck, 0.09,0.08, '#d4645c','#d4645c', 1.36);
    D(x + dx*0.25, y + dy*0.25, z+0.38 - peck, z+0.44 - peck, 0.08,0.06, '#e0a54f','#e0a54f', 1.36);
  }

  function duckFig(x, y, z, dx, dy, small){
    var s = small ? 0.62 : 1.0;
    var body = small ? '#ffe9a8' : PAL.duck;
    D(x, y, z-0.06, z+0.24*s, 0.52*s,0.40*s, body, '#ddd6c6', 1.30);
    D(x - dx*0.24*s, y - dy*0.24*s, z+0.14*s, z+0.30*s, 0.18*s,0.16*s, body, '#ddd6c6', 1.31);
    D(x + dx*0.20*s, y + dy*0.20*s, z+0.20*s, z+0.34*s, 0.16*s,0.15*s, body, '#ddd6c6', 1.32);
    D(x + dx*0.20*s, y + dy*0.20*s, z+0.34*s, z+0.52*s, 0.19*s,0.18*s, body, '#ddd6c6', 1.33);
    D(x + dx*0.30*s, y + dy*0.30*s, z+0.38*s, z+0.45*s, 0.10*s,0.08*s, '#ffb038','#ffb038', 1.35);
  }

  function dogFig(x,y,g,dx,dy,ph){
    var lx=-dy, ly=dx, z=g-0.1;
    var a=Math.sin(ph)*0.09, b=Math.sin(ph+Math.PI)*0.09;
    var legs=[[0.17,a,0.09],[0.17,b,-0.09],[-0.17,b,0.09],[-0.17,a,-0.09]];
    for(var i=0;i<4;i++)
      D(x+dx*(legs[i][0]+legs[i][1])+lx*legs[i][2], y+dy*(legs[i][0]+legs[i][1])+ly*legs[i][2],
        z, z+0.21, 0.085,0.085, '#6b4a32','#6b4a32', 1.4);
    D(x,y,z+0.19,z+0.44, 0.55,0.27, '#8a6242','#6b4a32', 1.42);
    D(x+dx*0.34,y+dy*0.34,z+0.36,z+0.62, 0.27,0.25, '#8a6242','#6b4a32', 1.44);
    D(x+dx*0.36+lx*0.11,y+dy*0.36+ly*0.11,z+0.60,z+0.73, 0.1,0.09, '#6b4a32','#6b4a32', 1.46);
    D(x+dx*0.36-lx*0.11,y+dy*0.36-ly*0.11,z+0.60,z+0.73, 0.1,0.09, '#6b4a32','#6b4a32', 1.46);
    D(x-dx*0.32,y-dy*0.32,z+0.40+Math.sin(ph*2)*0.09,z+0.52+Math.sin(ph*2)*0.09, 0.1,0.1, '#8a6242','#8a6242', 1.44);
  }
  function cartFig(x,y,g,dx,dy){
    var lx=-dy, ly=dx;
    D(x,y,g+0.38,g+1.0, 1.6,1.05, PAL.wood, PAL.woodDk, 1.2);
    D(x,y,g+1.0,g+1.22, 1.3,0.85, '#c0512f','#a04527', 1.25);
    for(var s=-1;s<=1;s+=2)
      D(x-dx*0.5+lx*s*0.58, y-dy*0.5+ly*s*0.58, g-0.05, g+0.6, 0.6,0.15, PAL.woodDk, PAL.woodDk, 1.3);
    D(x+dx*0.95, y+dy*0.95, g+0.55, g+0.68, 1.05,0.11, PAL.woodDk, PAL.woodDk, 1.2);
  }
  function buildDynamic(t, night){
    dyn.length = 0;

    // ---- Mühlenflügel
    var mg = WINDMILL[2] + 4.4;
    for(var b=0;b<4;b++){
      var a = t*1.0 + b*Math.PI/2;
      for(var d=1; d<=13; d++){
        var rr2 = d*0.29;
        var bz = mg + Math.sin(a)*rr2;
        var sail = d >= 6;
        var th = sail ? 0.38 : 0.20;
        D(WINDMILL[0] + Math.cos(a)*rr2, WINDMILL[1]-1.55, bz-th/2, bz+th/2, th, 0.26,
          sail ? PAL.wall : PAL.woodDk, sail ? PAL.wallDk : PAL.woodDk, 0.8);
      }
    }
    D(WINDMILL[0], WINDMILL[1]-1.4, mg-0.3, mg+0.3, 0.5,0.5, PAL.woodDk, PAL.woodDk, 0.9);

    // ---- Rauch
    for(var hI=0; hI<HOUSES.length; hI++){
      var ho = HOUSES[hI];
      for(var k=0;k<5;k++){
        var pr = ((t*0.20 + k/5 + hI*0.31) % 1);
        var sz = 0.26 + pr*0.5;
        D(ho.chx + Math.sin(pr*4+hI)*0.7, ho.chy + Math.cos(pr*3)*0.4,
          ho.chz + pr*3.8, ho.chz + pr*3.8 + sz*0.7, sz, sz,
          '#cfd2e0', '#b3b7c9', 1.2);
      }
    }

    // ---- Lagerfeuer
    var cg = hAt(CAMPFIRE[0], CAMPFIRE[1]);
    D(CAMPFIRE[0], CAMPFIRE[1], cg-0.25, cg+0.32, 1.2,0.38, PAL.woodDk, PAL.woodDk, 0.4);
    D(CAMPFIRE[0], CAMPFIRE[1], cg-0.25, cg+0.32, 0.38,1.2, PAL.wood, PAL.woodDk, 0.5);
    var fl = 0.6 + 0.28*Math.sin(t*9) + 0.22*Math.sin(t*14.3);
    De(CAMPFIRE[0], CAMPFIRE[1], cg+0.30, cg+0.36+fl*1.1, 0.7,0.7, EM.fire, 0.9);
    De(CAMPFIRE[0], CAMPFIRE[1], cg+0.36+fl*1.1, cg+0.5+fl*1.8, 0.4,0.4, EM.fireHot, 1.0);
    for(var sp=0; sp<6; sp++){
      var spr = ((t*0.7 + sp*0.17) % 1);
      De(CAMPFIRE[0] + Math.sin(spr*6+sp)*0.8, CAMPFIRE[1] + Math.cos(spr*5+sp)*0.8,
         cg+1.8+spr*3.0, cg+1.98+spr*3.0, 0.18,0.18, spr > 0.6 ? '#ff7a3a' : EM.fire, 1.1);
    }
    // Leuchtfeuer im Turm
    De(TOWER[0], TOWER[1], TOWER[2]+5.7, TOWER[2]+6.2, 1.9,1.9, EM.lamp, 1.0);

    // ---- Wasserfall
    var wf = spillPt;
    for(var w2=0; w2<16; w2++){
      var fp = ((t*0.42 + w2/16) % 1);
      var fz = WATER_Z - 0.8 - fp*13.5;
      var sway = Math.sin(fp*5 + t)*0.4;
      D(wf[0] + sway, wf[1] + sway*0.6, fz-0.8, fz, 1.5 - fp*0.5, 1.35 - fp*0.45,
        (w2 % 3 === 0) ? PAL.mist : (fp < 0.45 ? PAL.waterLt : PAL.water), PAL.waterLt, 0.7);
      if(w2 % 2 === 0) De(wf[0] + sway*1.6 + 0.6, wf[1] + sway - 0.5, fz-0.3, fz-0.05, 0.26,0.24, '#eaf9ff', 0.9);
    }
    for(var ms=0; ms<7; ms++){
      var mp = ((t*0.4 + ms/7) % 1);
      D(wf[0] + Math.sin(mp*6+ms)*1.7, wf[1] + Math.cos(mp*6+ms)*1.5,
        WATER_Z-14.0-mp*2.2, WATER_Z-13.4-mp*2.2, 1.8-mp*0.6, 1.7-mp*0.6, PAL.mist, PAL.mist, 0.6);
    }

    // ---- Enten und Küken
    for(var dk=0; dk<4; dk++){
      var da = t*0.24 + dk*1.7;
      var dxp = LAKE_X + Math.cos(da)*(2.2 + dk*1.1);
      var dyp = LAKE_Y + Math.sin(da)*(1.9 + dk*0.9);
      var bob = Math.sin(t*2.4 + dk)*0.06;
      duckFig(dxp, dyp, WATER_Z + bob, Math.cos(da+1.6), Math.sin(da+1.6), false);
      if(dk === 0) for(var kk=0; kk<3; kk++){
        var ka = da - 0.28 - kk*0.2;
        duckFig(LAKE_X + Math.cos(ka)*2.2, LAKE_Y + Math.sin(ka)*1.9,
                WATER_Z + Math.sin(t*2.8+kk)*0.05, Math.cos(ka+1.6), Math.sin(ka+1.6), true);
      }
    }
    // ---- Boot am Steg
    var bb = Math.sin(t*1.3)*0.06;
    D(LAKE_X+2.2, LAKE_Y+0.8, WATER_Z-0.35+bb, WATER_Z+0.35+bb, 1.9,0.9, PAL.wood, PAL.woodDk, 0.8);
    D(LAKE_X+2.3, LAKE_Y+0.8, WATER_Z+0.35+bb, WATER_Z+2.0+bb, 0.16,0.16, PAL.woodDk, PAL.woodDk, 0.9);
    D(LAKE_X+2.3, LAKE_Y+0.8, WATER_Z+1.0+bb, WATER_Z+1.95+bb, 0.12,0.85, PAL.wall, PAL.wallDk, 1.0);

    // ---- Leben in der Gasse und auf dem Markt
    var COATS = ['#4d6fb3','#b3564d','#6a8f4a','#8a5aa8','#c98a3a'];
    var PANTS = ['#3b4266','#4a3a44','#3f4a38','#43385a','#5a4630'];
    var SKIN  = ['#f0c9a0','#e0b183','#d9a877','#f2d2ad','#c98f63'];
    var HAIR  = ['#4a3524','#2f2b30','#7a5a3a','#a06a3a','#33303a'];
    for(var vi=0; vi<6; vi++){
      var ph2 = ((t*0.085 + vi*0.17) % 1 + 1) % 1;
      var tri = ph2 < 0.5 ? ph2*2 : (1-ph2)*2;
      var vx = 31.5 + tri*13.5;
      var vy = 20 + ((vi%2) ? 0.9 : -0.9);
      var vdir = ph2 < 0.5 ? 1 : -1;
      figure(vx, vy, hAt(vx,vy), vdir, 0, t*3.6 + vi*2,
             COATS[vi%5], PANTS[vi%5], SKIN[vi%5], HAIR[vi%5], 1.0);
    }
    var STALLS = [[MARKT[0]-2.2, MARKT[1]-1.6],[MARKT[0]+1.9, MARKT[1]-1.9],
                  [MARKT[0]-2.6, MARKT[1]+2.1],[MARKT[0]+2.3, MARKT[1]+1.8]];
    for(var si=0; si<4; si++){
      var sxp = STALLS[si][0], syp = STALLS[si][1];
      var ddx = MARKT[0]-sxp, ddy = MARKT[1]-syp, dl2 = Math.hypot(ddx,ddy)||1;
      figure(sxp - ddx/dl2*1.15, syp - ddy/dl2*1.15, hAt(sxp,syp), ddx/dl2, ddy/dl2,
             Math.sin(t*1.2+si)*0.32, COATS[(si+1)%5], PANTS[(si+2)%5], SKIN[si%5], HAIR[(si+3)%5], 1.0);
    }
    for(var ki=0; ki<3; ki++){
      var ka2 = t*0.8 + ki*2.1;
      var kx = MARKT[0] + Math.cos(ka2)*2.8, ky = MARKT[1] + Math.sin(ka2)*2.3;
      figure(kx, ky, hAt(kx,ky), -Math.sin(ka2), Math.cos(ka2), t*6.5 + ki*2,
             ['#d4645c','#5f8fc4','#6f8f5a'][ki], '#4a3a44', SKIN[ki], HAIR[ki], 0.66);
    }
    var cph = ((t*0.05) % 1 + 1) % 1;
    var ctri = cph < 0.5 ? cph*2 : (1-cph)*2;
    var cxp2 = 32.0 + ctri*12.5, cdir = cph < 0.5 ? 1 : -1;
    cartFig(cxp2, 20.5, hAt(cxp2,20.5), cdir, 0);
    figure(cxp2 + cdir*1.7, 20.5, hAt(cxp2+cdir*1.7,20.5), cdir, 0, t*3.2,
           '#8a5aa8','#43385a', SKIN[2], HAIR[1], 1.0);
    for(var dg=0; dg<2; dg++){
      var da2 = t*0.9 + dg*3.0;
      var dxp2 = MARKT[0] + Math.cos(da2)*3.4, dyp2 = MARKT[1] + Math.sin(da2)*2.8;
      dogFig(dxp2, dyp2, hAt(dxp2,dyp2), -Math.sin(da2), Math.cos(da2), t*7 + dg*2);
    }
    // Katzen auf den Dächern
    for(var rc=0; rc<2; rc++){
      var rh = HOUSES[rc*2];
      if(rh && rh.town)
        catFig(rh.x - 0.4 + rc*0.8, rh.y, rh.g + rh.h + 0.65, rc? -1:1, 0, Math.sin(t*0.7+rc)*0.5);
    }
    // Bewohner am Gehöft
    for(var wi=0; wi<2; wi++){
      var wa = t*0.22 + wi*2.6;
      var wx2 = FARM_X - 1.5 + Math.cos(wa)*2.0;
      var wy2 = FARM_Y + 2.4 + Math.sin(wa)*1.6;
      var wdx = -Math.sin(wa), wdy = Math.cos(wa)*0.8, wl = Math.hypot(wdx,wdy)||1;
      figure(wx2, wy2, hAt(wx2,wy2), wdx/wl, wdy/wl, t*3.2 + wi*3,
             COATS[(wi+2)%5], PANTS[(wi+1)%5], SKIN[(wi+3)%5], HAIR[(wi+4)%5], 1.0);
    }
    // ---- Schafe auf der Koppel
    for(var sh=0; sh<5; sh++){
      var sa = t*0.10 + sh*1.4;
      var sx2 = FARM_X - 0.5 + Math.cos(sa)*(1.6 + sh*0.35);
      var sy2 = FARM_Y + 4.6 + Math.sin(sa)*1.3;
      sheepFig(sx2, sy2, hAt(sx2,sy2), -Math.sin(sa), Math.cos(sa), t*2.2 + sh*2);
    }
    // ---- Hühner
    for(var ch=0; ch<4; ch++){
      var cxh = FARM_X - 3.0 + ch*0.95 + Math.sin(t*0.7 + ch*2)*0.6;
      var cyh = FARM_Y + 0.4 + Math.cos(t*0.6 + ch)*0.5;
      chickenFig(cxh, cyh, hAt(cxh,cyh), Math.cos(t*0.6+ch), Math.sin(t*0.6+ch),
                 Math.max(0, Math.sin(t*3 + ch*2))*0.14);
    }
    // ---- Wäscheleine
    var la1 = HOUSES[0], la2b = HOUSES[2];
    for(var wl2=0; wl2<5; wl2++){
      var u2 = (wl2+1)/6;

      var cx2 = VP[0]*sp[0] + VP[4]*sp[1] + VP[8]*sp[2] + VP[12];
      var cy2 = VP[1]*sp[0] + VP[5]*sp[1] + VP[9]*sp[2] + VP[13];
      var cw2 = VP[3]*sp[0] + VP[7]*sp[1] + VP[11]*sp[2] + VP[15];
      if(cw2 > 0.001){
        var ux = (cx2/cw2)*0.5 + 0.5, uy = (cy2/cw2)*0.5 + 0.5;
        var inside = ux > -0.45 && ux < 1.45 && uy > -0.45 && uy < 1.45;
        sunUV = [ux, uy, inside ? 1 : 0];
      } else sunUV = [0.5, 0.5, 0];
    })();

    var cl = [];
    for(var i=0;i<3;i++){
      cl.push(SHADOW_C[i][0] + (((t*0.6 + i*19) % 52) - 26),
              SHADOW_C[i][1] + Math.sin(t*0.07 + i)*2.5, SHADOW_C[i][2]);
    }

    // 1) Schattenkarte
    gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
    gl.viewport(0,0,SM,SM);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
    gl.useProgram(pShadow.p);
    gl.uniformMatrix4fv(pShadow.u.uLVP, false, lightVP);
    drawGeom(pShadow);
    gl.cullFace(gl.BACK);

    // 2) Szene
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.msFBO);
    gl.viewport(0,0,W,H);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Himmel
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(pSky.p);
    var f = norm([camAt[0]-camPos[0], camAt[1]-camPos[1], camAt[2]-camPos[2]]);
    var upv = [0,0,1];
    var rr = norm(cross(f, upv)), uu = cross(rr, f);
    if(camRoll){
      var c2 = Math.cos(camRoll), s2 = Math.sin(camRoll);
      var r3 = [rr[0]*c2+uu[0]*s2, rr[1]*c2+uu[1]*s2, rr[2]*c2+uu[2]*s2];
      var u3 = [uu[0]*c2-rr[0]*s2, uu[1]*c2-rr[1]*s2, uu[2]*c2-rr[2]*s2];
      rr = r3; uu = u3;
    }
    var ty = Math.tan(FOVY/2), tx = ty*W/H;
    gl.uniform3fv(pSky.u.uFwd, f); gl.uniform3fv(pSky.u.uRight, rr); gl.uniform3fv(pSky.u.uUp, uu);
    gl.uniform3fv(pSky.u.uSun, SUN); gl.uniform3fv(pSky.u.uSunCol, SUN_COL);
    gl.uniform3fv(pSky.u.uZenith, ZEN); gl.uniform3fv(pSky.u.uHorizon, HOR); gl.uniform3fv(pSky.u.uHaze, HAZE);
    gl.uniform2f(pSky.u.uTan, tx, ty); gl.uniform1f(pSky.u.uFar, FAR);
    gl.uniform3fv(pSky.u.uCamP, camPos); gl.uniform1f(pSky.u.uTime, t);
    fullscreen();

    // Geometrie
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.useProgram(pScene.p);
    gl.uniformMatrix4fv(pScene.u.uVP, false, VP);
    gl.uniformMatrix4fv(pScene.u.uLVP, false, lightVP);
    gl.uniform3fv(pScene.u.uSun, SUN);
    gl.uniform3fv(pScene.u.uSunCol, SUN_COL);
    gl.uniform3fv(pScene.u.uSkyCol, SKY_AMB);
    gl.uniform3fv(pScene.u.uGndCol, GND_AMB);
    gl.uniform3fv(pScene.u.uFogCol, FOG_COL);
    gl.uniform3fv(pScene.u.uCam, camPos);
    gl.uniform3f(pScene.u.uCl0, cl[0], cl[1], cl[2]);
    gl.uniform3f(pScene.u.uCl1, cl[3], cl[4], cl[5]);
    gl.uniform3f(pScene.u.uCl2, cl[6], cl[7], cl[8]);
    gl.uniform1f(pScene.u.uTime, t);
    gl.uniform1f(pScene.u.uFar, FAR);
    gl.uniform1f(pScene.u.uDirect, POST ? 0.0 : 1.0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.uniform1i(pScene.u.uShadow, 0);
    uploadLights();
    drawGeom(pScene);

    // 3) Auflösen
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.sceneF);
    gl.blitFramebuffer(0,0,W,H, 0,0,W,H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    var hw = RT.hw, hh = RT.hh;

    // 4) Bloom
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.brightF);
    gl.viewport(0,0,hw,hh);
    gl.useProgram(pBright.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneT);
    gl.uniform1i(pBright.u.uT, 0);
    fullscreen();
    blurPass(RT.brightT, RT.blurF, [1,0], hw, hh);
    blurPass(RT.blurT, RT.brightF, [0,1], hw, hh);
    blurPass(RT.brightT, RT.blurF, [5.2,0], hw, hh);
    blurPass(RT.blurT, RT.brightF, [0,1.7], hw, hh);

    // 4b) Gottesstrahlen aus der Helligkeitsmaske
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.rayF);
    gl.viewport(0,0,hw,hh);
    gl.useProgram(pRay.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.brightT);
    gl.uniform1i(pRay.u.uT, 0);
    gl.uniform2f(pRay.u.uSunUV, sunUV[0], sunUV[1]);
    gl.uniform1f(pRay.u.uOn, sunUV[2]);
    fullscreen();

    // 5) Unschärfe für die Tiefe
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.dofF);
    gl.viewport(0,0,hw,hh);
    gl.useProgram(pCopy.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneT);
    gl.uniform1i(pCopy.u.uT, 0);
    fullscreen();
    blurPass(RT.dofT, RT.dofF2, [1.5,0], hw, hh);
    blurPass(RT.dofT2, RT.dofF, [0,1.5], hw, hh);

    // 6) Zusammensetzen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,W,H);
    gl.useProgram(pComp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneT);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, RT.brightT);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, RT.dofT);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, RT.rayT);
    gl.uniform1i(pComp.u.uScene, 0); gl.uniform1i(pComp.u.uBloom, 1); gl.uniform1i(pComp.u.uBlur, 2);
    gl.uniform1i(pComp.u.uRays, 3);
    gl.uniformMatrix4fv(pComp.u.uPrevVP, false, prevVP);
    gl.uniform3fv(pComp.u.uCamP2, camPos);
    gl.uniform3fv(pComp.u.uFwd2, f); gl.uniform3fv(pComp.u.uRight2, rr); gl.uniform3fv(pComp.u.uUp2, uu);
    gl.uniform2f(pComp.u.uTan2, tx, ty);
    gl.uniform1f(pComp.u.uMB, 0.55);
    gl.uniform1f(pComp.u.uRayStr, 0.14);
    gl.uniform1f(pComp.u.uTime, t);
    gl.uniform1f(pComp.u.uExp, 0.82);
    gl.uniform1f(pComp.u.uBloomStr, 0.26);
    gl.uniform1f(pComp.u.uFar, FAR);
    gl.uniform1f(pComp.u.uDofNear, 78.0);
    gl.uniform1f(pComp.u.uDofFar, 195.0);
    gl.uniform1f(pComp.u.uVig, 0.46);
    fullscreen();
    prevVP.set(VP);
  }

  /* =========================================================
     Wiedergabe
     ========================================================= */
  var REGIONS = [
    [0.000,'Anflug'],[0.140,'Durch die Gasse'],[0.400,'Marktplatz'],[0.480,'Der große Baum'],
    [0.600,'Der See'],[0.700,'Wasserfall'],[0.780,'Um die Insel']
  ];
  var elCap = document.getElementById('caption');
  var elTitle = document.getElementById('titlecard');
  var elPaused = document.getElementById('pausedTag');
  var elFrame = document.getElementById('frame');
  var clock = 0, playing = true, last = null, capIdx = -1;

  function setPlaying(v){ playing = v; elPaused.style.opacity = v ? '0' : '1'; }
  elFrame.addEventListener('click', function(){ setPlaying(!playing); });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); }
  });
  function overlay(t){
    var tc = ((t % T_LOOP) + T_LOOP) % T_LOOP;
    elTitle.style.opacity = tc < 3.0 ? '1' : '0';
    var u = camU, ri = 0;
    for(var i=0;i<REGIONS.length;i++) if(u >= REGIONS[i][0]) ri = i;
    if(ri !== capIdx){ capIdx = ri; elCap.textContent = REGIONS[ri][1]; }
    var next = ri+1 < REGIONS.length ? REGIONS[ri+1][0] : 1.0;
    var span = next - REGIONS[ri][0];
    var lu = (u - REGIONS[ri][0]) / span;
    elCap.style.opacity = (tc > 3.4 && lu > 0.12 && lu < 0.62) ? '1' : '0';
  }
  function draw(dt, force){
    if(playing || force) clock += dt;
    frame(clock);
    overlay(clock);
  }
  function loop(now){
    if(last === null) last = now;
    var dt = Math.min(0.05, (now-last)/1000);
    last = now;
    draw(playing ? dt : 0, false);
    requestAnimationFrame(loop);
  }
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    playing = false; clock = 6;
  }
  window.addEventListener('resize', function(){ RT.W = -1; });
  window.__renderAt = function(tt){ clock = tt; frame(tt); overlay(tt); };
  window.__total = T_LOOP;
  setPlaying(playing);
  draw(0, true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
