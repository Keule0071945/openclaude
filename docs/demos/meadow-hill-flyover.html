<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Durchgehender Drohnenflug durch eine Voxelwelt in WebGL: Schattenwurf, Ambient Occlusion, Wind, Bloom und Tonemapping, 64 Sekunden ohne Schnitt.">
<title>Meadow Hill Flyover</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{ --ground:#0c0913; --ink:#efe7ff; --muted:#8b80ad;
    --pixel:'Silkscreen','Courier New',monospace;
    --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace; }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(120% 90% at 50% 0%, #17122a 0%, var(--ground) 70%, #070510 100%);
    color:var(--ink);font-family:var(--mono);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .film{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:12px}
  .frame{
    position:relative;line-height:0;border-radius:4px;overflow:hidden;background:#07050e;
    box-shadow:0 24px 70px rgba(0,0,0,.62);cursor:pointer;
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#1a1526}
  .caption{
    position:absolute;left:3%;bottom:6.5%;pointer-events:none;
    font-family:var(--pixel);font-size:clamp(11px,1.5vw,18px);letter-spacing:.04em;
    color:#fff6e6;text-shadow:0 2px 10px rgba(0,0,0,.75);
    opacity:0;transition:opacity .9s ease;
  }
  .titlecard{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;pointer-events:none;
    opacity:0;transition:opacity 1.1s ease;
  }
  .titlecard b{
    font-family:var(--pixel);font-weight:700;font-size:clamp(18px,3.6vw,40px);
    letter-spacing:.1em;color:#fff8ea;text-shadow:0 4px 24px rgba(0,0,0,.7);
  }
  .titlecard span{
    font-size:clamp(9px,1.2vw,13px);letter-spacing:.4em;color:#f0dcc4;
    text-shadow:0 2px 12px rgba(0,0,0,.7);
  }
  .paused{
    position:absolute;right:3%;top:5.5%;pointer-events:none;font-family:var(--pixel);
    font-size:clamp(10px,1.2vw,14px);color:#fff4dd;text-shadow:0 2px 8px rgba(0,0,0,.8);
    opacity:0;transition:opacity .25s ease;
  }
  .foot{
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:11.5px;letter-spacing:.04em;color:var(--muted);
  }
  .foot b{color:var(--ink);font-weight:500}
  .oops{padding:40px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
</style>

</head>
<body>
<main class="film">
  <div class="frame" id="frame">
    <canvas id="scene" role="img"
      aria-label="Durchgehender Drohnenflug durch eine Voxelwelt in goldenem Abendlicht: über Windmühle, Dorf, Lagerfeuer und See, über die Inselkante am Wasserfall hinab und unter der schwebenden Insel hindurch zurück in die Höhe."></canvas>
    <div class="caption" id="caption"></div>
    <div class="titlecard" id="titlecard"><b>MEADOW HILL</b><span>EINE SCHWEBENDE INSEL</span></div>
    <div class="paused" id="pausedTag">PAUSE</div>
  </div>
  <p class="foot">
    <span><b>Eine Einstellung</b>, 64 Sekunden, nahtlos geloopt · WebGL, Schattenwurf und Bloom</span>
    <span>Klick oder Leertaste pausiert</span>
  </p>
</main>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('scene');
  var gl = cv.getContext('webgl2', {antialias:false, alpha:false, preserveDrawingBuffer:true});
  if(!gl){
    document.querySelector('.frame').innerHTML =
      '<p class="oops">Dieser Flug braucht WebGL2.<br>Bitte in einem aktuellen Browser öffnen.</p>';
    return;
  }
  var hdrExt = gl.getExtension('EXT_color_buffer_float');
  var linExt = gl.getExtension('OES_texture_float_linear');

  /* ---------------- Palette ---------------- */
  var PAL = {
    grass:'#5cb04a', grassLt:'#79c95c', grassDk:'#3f8f43',
    sand:'#e3cd94', dirt:'#9c6c40', dirtDk:'#7a5230',
    rock:'#8f92ab', rockDk:'#666a86',
    path:'#d8bd8b', water:'#3fa8d0', waterLt:'#63c8e2', waterDk:'#2b86b0',
    wood:'#9a6a3e', woodDk:'#6d4a2c',
    wall:'#f0dfbe', wallDk:'#cfb896', win:'#6d8ab0',
    roofA:'#d4645c', roofB:'#5f8fc4', roofC:'#d99a4f',
    leaf:'#4fa14a', leafDk:'#2f7440', leafLt:'#79c25c',
    pine:'#3d8c5a', pineDk:'#2a6a45',
    fleece:'#f5eee0', duck:'#fbf6ea', ink:'#2b2038',
    cat:'#ef9f52', catDk:'#c9762f',
    cloud:'#e9eefb', mist:'#dff0f7',
    stone:'#a9adc2', canvasT:'#e07a63'
  };
  var EM = { win:'#ffd27a', fire:'#ffb03a', fireHot:'#fff2b0', lamp:'#ffdf9a', fly:'#d8ff96' };
  var LIGHTS = true;
  var SHADOW_C = [[-4,3,7.5],[9,-6,6.5],[3,11,8.5]];

  /* =========================================================
     Welt
     ========================================================= */
  var G = 30, CX = 14.5, CY = 14.5, RAD = 13.0;
  var SLAB = -3.2, WATER_Z = 2.6;
  var LAKE_X = 9.4, LAKE_Y = 20.6, LAKE_R = 3.9;
  var VIL_X = 20.5, VIL_Y = 10.5;
  var heights = new Float32Array(G*G);
  var kinds = new Uint8Array(G*G);      // 0 = leer, 1 = Land, 2 = Wasser
  var K_VOID = 0, K_LAND = 1, K_WATER = 2;
  var terrain = [];
  var spillDir = [0,0], spillPt = [0,0];

  function idx(i,j){ return j*G + i; }
  function hAt(x,y){
    var i = Math.round(x), j = Math.round(y);
    if(i<0||j<0||i>=G||j>=G) return 0;
    return heights[idx(i,j)];
  }
  function kindAt(i,j){
    if(i<0||j<0||i>=G||j>=G) return K_VOID;
    return kinds[idx(i,j)];
  }

  var paved = new Uint8Array(G*G);
  var PATH_PTS = [
    [20.5,10.5],[18.6,12.4],[16.8,14.6],[14.2,16.4],[11.8,18.6],[10.6,20.0],
    null,
    [17.6,13.4],[17.9,16.4],[17.4,19.2],[16.9,21.4]
  ];
  function onPath(i,j){
    for(var k=0;k<PATH_PTS.length-1;k++){
      var a = PATH_PTS[k], b = PATH_PTS[k+1];
      if(!a || !b) continue;
      var vx = b[0]-a[0], vy = b[1]-a[1];
      var len2 = vx*vx+vy*vy;
      var t = Math.max(0, Math.min(1, ((i-a[0])*vx + (j-a[1])*vy)/len2));
      var dx = i - (a[0]+vx*t), dy = j - (a[1]+vy*t);
      if(dx*dx+dy*dy < 0.62) return true;
    }
    return false;
  }
  function buildTerrain(){
    var dirLen = Math.hypot(LAKE_X-CX, LAKE_Y-CY);
    spillDir = [(LAKE_X-CX)/dirLen, (LAKE_Y-CY)/dirLen];
    for(var j=0;j<G;j++){
      for(var i=0;i<G;i++){
        var dx = i-CX, dy = j-CY, r = Math.hypot(dx,dy);
        if(r > RAD){ kinds[idx(i,j)] = K_VOID; continue; }
        var e = 1 - r/RAD;
        var h = 1.3 + 5.2*Math.pow(e, 0.42);
        h += 0.62*Math.sin(i*0.46+0.4)*Math.cos(j*0.41-0.2);
        h += 0.28*Math.sin((i+j)*0.62+1.1);
        // Dorfplateau
        var dv = Math.hypot(i-VIL_X, j-VIL_Y);
        if(dv < 4.2){ var w = Math.min(1,(4.2-dv)/1.8); h = h*(1-w) + 4.6*w; }
        // Seebecken
        var dl = Math.hypot(i-LAKE_X, j-LAKE_Y);
        if(dl < LAKE_R + 1.2){
          var wl = Math.min(1, (LAKE_R+1.2-dl)/2.2);
          h = h*(1-wl) + 1.5*wl;
        }
        // Abflussrinne Richtung Inselrand
        var proj = ((i-CX)*spillDir[0] + (j-CY)*spillDir[1]);
        var perp = Math.abs((i-CX)*(-spillDir[1]) + (j-CY)*spillDir[0]);
        if(proj > dirLen - 1 && perp < 1.6){
          var wc = Math.min(1, (1.6-perp)/1.2);
          h = h*(1-wc) + (2.0 - (proj-(dirLen-1))*0.16)*wc;
        }
        h = Math.round(h*2)/2;
        heights[idx(i,j)] = h;
        if(onPath(i,j)) paved[idx(i,j)] = 1;
        kinds[idx(i,j)] = (h < WATER_Z - 0.2 && (dl < LAKE_R + 1.0 || (proj > dirLen-1 && perp < 1.5))) ? K_WATER : K_LAND;
      }
    }
    // Ausflusspunkt am Rand merken
    spillPt = [CX + spillDir[0]*(RAD-0.6), CY + spillDir[1]*(RAD-0.6)];

    // statische Terrain-Boxen
    for(var j2=0;j2<G;j2++){
      for(var i2=0;i2<G;i2++){
        var k = kinds[idx(i2,j2)];
        if(k === K_VOID) continue;
        var h2 = heights[idx(i2,j2)];
        var isW = k === K_WATER;
        var top = isW ? WATER_Z : h2;
        var topC, sideC;
        if(isW){ topC = PAL.water; sideC = PAL.waterDk; }
        else if(h2 < 3.0){ topC = PAL.sand; sideC = ((i2*7+j2*13) % 5 < 2) ? PAL.rockDk : PAL.rock; }
        else if(h2 > 6.9){
          var rk = (i2*5+j2*7) % 6;
          topC = rk < 2 ? '#7c8096' : (rk < 3 ? '#6f8f66' : PAL.rock);
          sideC = PAL.rockDk;
        }
        else if(paved[idx(i2,j2)]){
          topC = ((i2*5+j2*3) % 4 === 0) ? '#c9ab7a' : PAL.path;
          sideC = PAL.dirt;
        }
        else {
          topC = (i2*3+j2*5) % 7 < 2 ? PAL.grassLt : PAL.grass;
          sideC = PAL.dirt;
        }
        var nb = [];
        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(var d=0; d<4; d++){
          var ni = i2+dirs[d][0], nj = j2+dirs[d][1];
          var nk = kindAt(ni,nj);
          nb.push(nk === K_VOID ? SLAB : Math.min(heights[idx(ni,nj)], isW ? top : 99));
        }
        terrain.push({
          x:i2-CX, y:j2-CY, z0:SLAB, z1:top, sx:1, sy:1,
          top:topC, side:sideC, water:isW,
          nPX:nb[0], nMX:nb[1], nPY:nb[2], nMY:nb[3],
          bias:0
        });
      }
    }
  }
  buildTerrain();

  /* --------- Requisiten (statische Voxelcluster) --------- */
  var props = [];
  function P(x,y,z0,z1,sx,sy,top,side,bias){
    props.push({x:x-CX, y:y-CY, z0:z0, z1:z1, sx:sx, sy:sy, top:top, side:side||top, bias:bias||0});
  }
  function Pe(x,y,z0,z1,sx,sy,col,bias){
    props.push({x:x-CX, y:y-CY, z0:z0, z1:z1, sx:sx, sy:sy, top:col, side:col, em:true, bias:bias||0});
  }
  function tree(x,y,s){
    var g = hAt(x,y);
    P(x,y,g-0.4,g+1.1*s, 0.34,0.34, PAL.woodDk, PAL.woodDk);
    P(x,y,g+1.0*s,g+2.0*s, 1.9*s,1.9*s, PAL.leaf, PAL.leafDk);
    P(x,y,g+2.0*s,g+2.7*s, 1.35*s,1.35*s, PAL.leafLt, PAL.leaf);
    P(x,y,g+2.7*s,g+3.05*s, 0.7*s,0.7*s, PAL.leafLt, PAL.leaf);
  }
  function pineTree(x,y,s){
    var g = hAt(x,y);
    P(x,y,g-0.4,g+0.8*s, 0.3,0.3, PAL.woodDk, PAL.woodDk);
    P(x,y,g+0.7*s,g+1.6*s, 1.8*s,1.8*s, PAL.pine, PAL.pineDk);
    P(x,y,g+1.6*s,g+2.4*s, 1.25*s,1.25*s, PAL.pine, PAL.pineDk);
    P(x,y,g+2.4*s,g+3.1*s, 0.7*s,0.7*s, PAL.pine, PAL.pineDk);
  }
  function bushAt(x,y){
    var g = hAt(x,y);
    P(x,y,g-0.3,g+0.55, 0.95,0.95, PAL.leafDk, PAL.leafDk);
    P(x,y,g+0.55,g+0.85, 0.55,0.55, PAL.leaf, PAL.leafDk);
  }
  var HOUSES = [];
  function house(x,y,roof,wide){
    var g = hAt(x,y);
    var w = wide ? 2.6 : 2.1, d = wide ? 2.2 : 1.9;
    P(x,y,g-0.6,g+1.8, w,d, PAL.wall, PAL.wallDk);
    P(x,y,g+1.8,g+2.35, w+0.5,d+0.5, roof, roof);
    P(x,y,g+2.35,g+2.85, w*0.62,d*0.62, roof, roof);
    P(x,y,g+2.85,g+3.2, w*0.26,d*0.26, roof, roof);
    // Schornstein
    P(x+w*0.32, y-d*0.28, g+1.8, g+3.5, 0.4,0.4, PAL.stone, PAL.rockDk);
    // Fensterrahmen und Scheiben an allen vier Waenden
    var wz = g + 0.55;
    var sides = [[ w/2+0.03, -0.3, 0.07, 0.62],[ -w/2-0.03, 0.3, 0.07, 0.62],
                 [ 0.3, d/2+0.03, 0.62, 0.07],[ -0.3, -d/2-0.03, 0.62, 0.07]];
    for(var q=0;q<4;q++){
      var sd2 = sides[q];
      P(x+sd2[0], y+sd2[1], wz-0.12, wz+0.7, sd2[2]+0.16, sd2[3]+0.16, PAL.woodDk, PAL.woodDk, 0.9);
      P(x+sd2[0], y+sd2[1], wz, wz+0.56, sd2[2]+0.04, sd2[3]+0.04, PAL.win, PAL.win, 1.0);
    }
    // Tuer mit Stufe
    P(x, y - d/2 - 0.04, g-0.6, g+1.15, 0.62, 0.1, PAL.woodDk, PAL.woodDk, 0.9);
    P(x, y - d/2 - 0.06, g-0.6, g+1.02, 0.48, 0.1, PAL.wood, PAL.wood, 1.0);
    P(x+0.16, y - d/2 - 0.1, g+0.5, g+0.6, 0.08, 0.08, EM.lamp, EM.lamp, 1.1);
    P(x, y - d/2 - 0.42, g-0.5, g-0.18, 0.9, 0.5, PAL.stone, PAL.stoneDk || PAL.rockDk, 0.6);
    // Blumenkasten unter dem Seitenfenster
    P(x + w/2 + 0.12, y - 0.3, wz-0.34, wz-0.06, 0.22, 0.72, PAL.woodDk, PAL.woodDk, 1.0);
    P(x + w/2 + 0.12, y - 0.42, wz-0.06, wz+0.08, 0.2, 0.2, '#ff8fb1', '#ff8fb1', 1.1);
    P(x + w/2 + 0.12, y - 0.18, wz-0.06, wz+0.08, 0.2, 0.2, '#ffd166', '#ffd166', 1.1);
    HOUSES.push({x:x, y:y, g:g, w:w, d:d});
  }
  function fenceRun(x,y,dx,dy,n){
    for(var i=0;i<n;i++){
      var fx = x+dx*i, fy = y+dy*i, g = hAt(fx,fy);
      P(fx,fy,g-0.3,g+1.0, 0.22,0.22, PAL.wood, PAL.woodDk);
      if(i < n-1){
        P(fx+dx*0.5, fy+dy*0.5, g+0.45, g+0.62, dx?1:0.14, dy?1:0.14, PAL.wood, PAL.woodDk);
        P(fx+dx*0.5, fy+dy*0.5, g+0.78, g+0.95, dx?1:0.14, dy?1:0.14, PAL.wood, PAL.woodDk);
      }
    }
  }
  var LAMPS = [];
  function lampAt(x,y){
    var g = hAt(x,y);
    P(x,y,g-0.3,g+2.1, 0.2,0.2, PAL.woodDk, PAL.woodDk);
    P(x,y,g+2.1,g+2.5, 0.5,0.5, PAL.rockDk, PAL.rockDk);
    LAMPS.push({x:x, y:y, z:g+2.15});
  }
  function dock(x,y,dx,dy,n){
    for(var i=0;i<n;i++){
      P(x+dx*i, y+dy*i, WATER_Z-0.9, WATER_Z+0.35, 1.0,1.0, PAL.wood, PAL.woodDk);
    }
  }

  // Landschaft bestuecken
  (function populate(){
    // Dorf
    house(VIL_X-1.4, VIL_Y-1.2, PAL.roofA, false);
    house(VIL_X+1.6, VIL_Y+0.4, PAL.roofB, true);
    house(VIL_X-0.6, VIL_Y+2.4, PAL.roofC, false);
    lampAt(VIL_X+0.2, VIL_Y-0.6);
    lampAt(VIL_X+0.4, VIL_Y+3.2);
    fenceRun(VIL_X-3.2, VIL_Y+3.6, 1, 0, 5);
    fenceRun(VIL_X-3.2, VIL_Y+3.6, 0, -1, 4);
    // Treppe vom Weg aufs Dorfplateau
    for(var st=0; st<4; st++){
      P(VIL_X-3.6+st*0.62, VIL_Y+4.6-st*0.5, hAt(VIL_X-3.6+st*0.62, VIL_Y+4.6-st*0.5)-0.6,
        hAt(VIL_X-3.6, VIL_Y+4.6)+0.15+st*0.42, 0.95, 0.7, PAL.stone, PAL.rockDk, 0.4);
    }
    // Wegweiser am Abzweig
    var sgx = 17.6, sgy = 13.6, sgg = hAt(sgx,sgy);
    P(sgx, sgy, sgg-0.4, sgg+1.7, 0.16,0.16, PAL.woodDk, PAL.woodDk, 0.5);
    P(sgx+0.42, sgy, sgg+1.15, sgg+1.5, 0.75,0.1, PAL.wood, PAL.woodLt || PAL.wood, 0.7);
    P(sgx-0.35, sgy+0.2, sgg+0.7, sgg+1.02, 0.6,0.1, PAL.wood, PAL.wood, 0.7);
    // Steg am See
    dock(LAKE_X+2.2, LAKE_Y-1.2, 0.9, 0.3, 3);
    lampAt(LAKE_X+2.0, LAKE_Y-2.4);
    // Baeume: Mischwald im Westen, Nadelwald im Norden
    var spots = [
      [8.5,9.5,1.05],[10.8,7.4,0.9],[6.9,12.6,1.0],[9.6,13.8,0.85],
      [12.4,6.4,1.0],[15.8,5.6,0.95],[18.6,6.2,0.85],[7.6,16.4,0.9],
      [13.2,21.4,1.0],[16.4,20.2,0.9],[19.2,18.4,1.05],[21.8,15.4,0.9],
      [22.6,19.2,0.85],[17.8,23.0,0.9],[11.4,24.2,0.85],[5.6,19.4,0.8]
    ];
    for(var i=0;i<spots.length;i++){
      var s = spots[i];
      if(kindAt(Math.round(s[0]), Math.round(s[1])) !== K_LAND) continue;
      if(i % 3 === 0) pineTree(s[0], s[1], s[2]); else tree(s[0], s[1], s[2]);
    }
    var bushes = [[12.6,12.4],[16.2,9.4],[8.2,22.2],[20.4,22.0],[24.0,13.2],[6.4,15.0],[14.8,17.6],[11.2,17.0]];
    for(var b=0;b<bushes.length;b++){
      if(kindAt(Math.round(bushes[b][0]), Math.round(bushes[b][1])) === K_LAND) bushAt(bushes[b][0], bushes[b][1]);
    }
    // Blumen
    for(var f=0; f<46; f++){
      var fx = CX + (Math.sin(f*12.9898)*43758.5453 % 1) * 0;
      var a = f*2.39996, rr = 2 + (f % 11);
      var x = CX + Math.cos(a)*rr, y = CY + Math.sin(a)*rr;
      var i2 = Math.round(x), j2 = Math.round(y);
      if(kindAt(i2,j2) !== K_LAND) continue;
      var g = heights[idx(i2,j2)];
      if(g < 3.1 || g > 6.4) continue;
      var cols = ['#ff8fb1','#ffd166','#c58bff','#fff2d8','#ff9f6b'];
      P(x, y, g, g+0.3, 0.2,0.2, cols[f % cols.length], cols[f % cols.length], 0.6);
    }
    // Lagerfeuerplatz im Wald
    var cf = [16.9, 21.6];
    for(var r2=0; r2<6; r2++){
      var aa = r2/6*Math.PI*2;
      P(cf[0]+Math.cos(aa)*0.85, cf[1]+Math.sin(aa)*0.85, hAt(cf[0],cf[1])-0.2, hAt(cf[0],cf[1])+0.25, 0.4,0.4, PAL.stone, PAL.rockDk);
    }
    // Zelt
    var tx = 18.9, ty = 22.6, tg = hAt(tx,ty);
    P(tx,ty,tg-0.4,tg+0.9, 2.0,1.7, PAL.canvasT, '#a8443f');
    P(tx,ty,tg+0.9,tg+1.5, 1.35,1.15, PAL.canvasT, '#a8443f');
    P(tx,ty,tg+1.5,tg+1.9, 0.6,0.5, PAL.canvasT, '#a8443f');
    // Steine
    var rocks = [[23.5,11.4],[5.2,11.0],[12.0,25.0],[22.4,7.6]];
    for(var rk=0; rk<rocks.length; rk++){

  })();
  function uAtDist(d){
    d = ((d % ARC.len) + ARC.len) % ARC.len;
    var lo = 0, hi = ARC.N;
    while(lo < hi){ var mid = (lo+hi)>>1; if(ARC.tbl[mid] < d) lo = mid+1; else hi = mid; }
    var i = Math.max(1, lo);
    var a = ARC.tbl[i-1], b = ARC.tbl[i];
    var f = b > a ? (d-a)/(b-a) : 0;
    return (i-1+f)/ARC.N;
  }

  /* =========================================================
     Himmel, Licht, Bildschleife
     ========================================================= */
  var SKY_FS = HEAD + FP + 'in vec2 vUV;\n' +
  'uniform vec3 uFwd, uRight, uUp, uSun, uSunCol, uZenith, uHorizon, uHaze, uCamP;\n' +
  'uniform vec2 uTan; uniform float uFar, uTime;\n' +
  'out vec4 o;\n' +
  'float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }\n' +
  'float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);\n' +
  '  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }\n' +
  'float fbm(vec2 p){ float s=0.0, a=0.5;\n' +
  '  for(int i=0;i<4;i++){ s += a*vn(p); p *= 2.03; a *= 0.5; }\n' +
  '  return s; }\n' +
  'void main(){\n' +
  '  vec3 d = normalize(uFwd + uRight*((vUV.x*2.0-1.0)*uTan.x) + uUp*((vUV.y*2.0-1.0)*uTan.y));\n' +
  '  float h = d.z;\n' +
  '  vec3 c = mix(uHorizon, uZenith, smoothstep(-0.02, 0.62, h));\n' +
  '  c = mix(uHaze, c, smoothstep(-0.42, 0.01, h));\n' +
  '  float sd = max(dot(d, uSun), 0.0);\n' +
  '  c += uSunCol * pow(sd, 2200.0) * 4.0;\n' +
  '  c += uSunCol * pow(sd, 18.0) * 0.20;\n' +
  '  c += uSunCol * pow(sd, 4.0) * 0.045;\n' +
  '  float cz = 34.0;\n' +
  '  if(d.z > 0.035 && uCamP.z < cz){\n' +
  '    float tt = (cz - uCamP.z)/d.z;\n' +
  '    vec2 pw = uCamP.xy + d.xy*tt;\n' +
  '    float n = fbm(pw*0.028 + vec2(uTime*0.010, uTime*0.004));\n' +
  '    float cov = smoothstep(0.46, 0.76, n);\n' +
  '    float fade = smoothstep(0.035, 0.30, d.z);\n' +
  '    float lit = smoothstep(0.34, 0.82, n);\n' +
  '    vec3 cc = mix(vec3(0.26,0.19,0.20), vec3(1.02,0.72,0.50), lit);\n' +
  '    cc += uSunCol*pow(sd, 8.0)*0.25;\n' +
  '    c = mix(c, cc, cov*fade*0.88);\n' +
  '  }\n' +
  '  o = vec4(c, 0.82); }';
  var pSky = prog(QUAD_VS, SKY_FS);

  var SUN = (function(){
    var a = 0.4695*Math.PI*2, v = [Math.cos(a), 0.34, Math.sin(a)];
    var l = Math.hypot(v[0],v[1],v[2]);
    return [v[0]/l, v[1]/l, v[2]/l];
  })();
  var SUN_COL = [1.52, 0.94, 0.54];
  var SKY_AMB = [0.20, 0.25, 0.38];
  var GND_AMB = [0.26, 0.21, 0.18];
  var FOG_COL = [0.30, 0.20, 0.17];
  var ZEN = [0.09, 0.15, 0.34], HOR = [0.68, 0.39, 0.24], HAZE = [0.24, 0.15, 0.14];
  var FAR = 130, FOVY = 40*Math.PI/180;
  var T_LOOP = 64;

  var lightVP = (function(){
    var eye = [SUN[0]*46, SUN[1]*46, SUN[2]*46];
    var v = lookAt(eye, [0,0,0], 0);
    var o = ortho(-24, 24, -24, 24, 1, 100);
    return mul(o, v);
  })();

  var dynMesh = new Mesh();
  function buildDynMesh(t){
    buildDynamic(t, 0.10);
    dynMesh.v.length = 0; dynMesh.i.length = 0;
    for(var k=0;k<dyn.length;k++) emitBox(dynMesh, dyn[k], FLAT);
    upload(GD, dynMesh, gl.DYNAMIC_DRAW);
  }

  function drawGeom(prg){
    gl.bindVertexArray(GS.vao);
    gl.drawElements(gl.TRIANGLES, GS.count, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(GD.vao);
    gl.drawElements(gl.TRIANGLES, GD.count, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(null);
  }
  function fullscreen(){
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }
  function blurPass(srcTex, dstF, dir, w, h){
    gl.bindFramebuffer(gl.FRAMEBUFFER, dstF);
    gl.viewport(0,0,w,h);
    gl.useProgram(pBlur.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(pBlur.u.uT, 0);
    gl.uniform2f(pBlur.u.uDir, dir[0]/w, dir[1]/h);
    fullscreen();
  }

  var camPos = [0,0,0], camAt = [0,0,0], camRoll = 0, camU = 0;
  function clearAt(x,y){                 // höchster Boden in der Nachbarschaft
    var m = -99;
    for(var a=0;a<9;a++){
      var g = gh(x + ((a%3)-1)*1.3, y + (Math.floor(a/3)-1)*1.3);
      if(g !== null && g > m) m = g;
    }
    return m;
  }
  function updateCamera(t){
    var tt = ((t/T_LOOP) % 1 + 1) % 1;
    var K = 3, A = 0.38;                     // Tempo atmet dreimal pro Runde
    var d = ARC.len * (tt + (A/(2*Math.PI*K))*Math.sin(2*Math.PI*K*tt));
    var u = uAtDist(d);
    camU = u;
    var eye = splineAt(CAM_PTS, u), at = splineAt(LOOK_PTS, u);
    eye[0] += Math.sin(t*1.35)*0.075; eye[1] += Math.cos(t*1.12)*0.075; eye[2] += Math.sin(t*1.9)*0.055;
    var c = clearAt(eye[0], eye[1]);
    if(c > -50 && eye[2] > SLAB + 0.5 && eye[2] < c + 2.7) eye[2] = c + 2.7;
    var rad = Math.hypot(eye[0], eye[1]);
    if(eye[2] < SLAB + 0.5 && rad < RAD + 2.0 && eye[2] > -11.2) eye[2] = -11.2;
    // Neigung in Kurven
    var a = splineAt(CAM_PTS, u - 0.004), b = splineAt(CAM_PTS, u + 0.004);
    var v1 = [eye[0]-a[0], eye[1]-a[1]], v2 = [b[0]-eye[0], b[1]-eye[1]];
    var cz = v1[0]*v2[1] - v1[1]*v2[0];
    camRoll += (Math.max(-0.18, Math.min(0.18, cz*1.15)) - camRoll) * 0.08;
    camPos = eye; camAt = at;
  }

  function frame(t){
    resize();
    updateCamera(t);
    buildDynMesh(t);

    var W = RT.W, H = RT.H;
    var view = lookAt(camPos, camAt, camRoll);
    var proj = persp(FOVY, W/H, 0.35, FAR);
    var VP = mul(proj, view);

    var cl = [];
    for(var i=0;i<3;i++){
      cl.push(SHADOW_C[i][0] + (((t*0.6 + i*19) % 52) - 26),
              SHADOW_C[i][1] + Math.sin(t*0.07 + i)*2.5, SHADOW_C[i][2]);
    }

    // 1) Schattenkarte
    gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
    gl.viewport(0,0,SM,SM);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
    gl.useProgram(pShadow.p);
    gl.uniformMatrix4fv(pShadow.u.uLVP, false, lightVP);
    drawGeom(pShadow);
    gl.cullFace(gl.BACK);

    // 2) Szene
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.msFBO);
    gl.viewport(0,0,W,H);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Himmel
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(pSky.p);
    var f = norm([camAt[0]-camPos[0], camAt[1]-camPos[1], camAt[2]-camPos[2]]);
    var upv = [0,0,1];
    var rr = norm(cross(f, upv)), uu = cross(rr, f);
    if(camRoll){
      var c2 = Math.cos(camRoll), s2 = Math.sin(camRoll);
      var r3 = [rr[0]*c2+uu[0]*s2, rr[1]*c2+uu[1]*s2, rr[2]*c2+uu[2]*s2];
      var u3 = [uu[0]*c2-rr[0]*s2, uu[1]*c2-rr[1]*s2, uu[2]*c2-rr[2]*s2];
      rr = r3; uu = u3;
    }
    var ty = Math.tan(FOVY/2), tx = ty*W/H;
    gl.uniform3fv(pSky.u.uFwd, f); gl.uniform3fv(pSky.u.uRight, rr); gl.uniform3fv(pSky.u.uUp, uu);
    gl.uniform3fv(pSky.u.uSun, SUN); gl.uniform3fv(pSky.u.uSunCol, SUN_COL);
    gl.uniform3fv(pSky.u.uZenith, ZEN); gl.uniform3fv(pSky.u.uHorizon, HOR); gl.uniform3fv(pSky.u.uHaze, HAZE);
    gl.uniform2f(pSky.u.uTan, tx, ty); gl.uniform1f(pSky.u.uFar, FAR);
    gl.uniform3fv(pSky.u.uCamP, camPos); gl.uniform1f(pSky.u.uTime, t);
    fullscreen();

    // Geometrie
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.useProgram(pScene.p);
    gl.uniformMatrix4fv(pScene.u.uVP, false, VP);
    gl.uniformMatrix4fv(pScene.u.uLVP, false, lightVP);
    gl.uniform3fv(pScene.u.uSun, SUN);
    gl.uniform3fv(pScene.u.uSunCol, SUN_COL);
    gl.uniform3fv(pScene.u.uSkyCol, SKY_AMB);
    gl.uniform3fv(pScene.u.uGndCol, GND_AMB);
    gl.uniform3fv(pScene.u.uFogCol, FOG_COL);
    gl.uniform3fv(pScene.u.uCam, camPos);
    gl.uniform3f(pScene.u.uCl0, cl[0], cl[1], cl[2]);
    gl.uniform3f(pScene.u.uCl1, cl[3], cl[4], cl[5]);
    gl.uniform3f(pScene.u.uCl2, cl[6], cl[7], cl[8]);
    gl.uniform1f(pScene.u.uTime, t);
    gl.uniform1f(pScene.u.uFar, FAR);
    gl.uniform1f(pScene.u.uDirect, POST ? 0.0 : 1.0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.uniform1i(pScene.u.uShadow, 0);
    drawGeom(pScene);

    // 3) Auflösen
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.msFBO);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.sceneF);
    gl.blitFramebuffer(0,0,W,H, 0,0,W,H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    var hw = RT.hw, hh = RT.hh;

    // 4) Bloom
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.brightF);
    gl.viewport(0,0,hw,hh);
    gl.useProgram(pBright.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneT);
    gl.uniform1i(pBright.u.uT, 0);
    fullscreen();
    blurPass(RT.brightT, RT.blurF, [1,0], hw, hh);
    blurPass(RT.blurT, RT.brightF, [0,1], hw, hh);
    blurPass(RT.brightT, RT.blurF, [2.4,0], hw, hh);
    blurPass(RT.blurT, RT.brightF, [0,2.4], hw, hh);

    // 5) Unschärfe für die Tiefe
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.dofF);
    gl.viewport(0,0,hw,hh);
    gl.useProgram(pCopy.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneT);
    gl.uniform1i(pCopy.u.uT, 0);
    fullscreen();
    blurPass(RT.dofT, RT.dofF2, [1.5,0], hw, hh);
    blurPass(RT.dofT2, RT.dofF, [0,1.5], hw, hh);

    // 6) Zusammensetzen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,W,H);
    gl.useProgram(pComp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneT);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, RT.brightT);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, RT.dofT);
    gl.uniform1i(pComp.u.uScene, 0); gl.uniform1i(pComp.u.uBloom, 1); gl.uniform1i(pComp.u.uBlur, 2);
    gl.uniform1f(pComp.u.uTime, t);
    gl.uniform1f(pComp.u.uExp, 1.06);
    gl.uniform1f(pComp.u.uBloomStr, 0.34);
    gl.uniform1f(pComp.u.uFar, FAR);
    gl.uniform1f(pComp.u.uDofNear, 46.0);
    gl.uniform1f(pComp.u.uDofFar, 118.0);
    gl.uniform1f(pComp.u.uVig, 0.40);
    fullscreen();
  }

  /* =========================================================
     Wiedergabe
     ========================================================= */
  var REGIONS = [
    [0.000,'Anflug'],[0.125,'Windmühle'],[0.250,'Über dem Dorf'],[0.375,'Lagerfeuer'],
    [0.500,'Der See'],[0.625,'Wasserfall'],[0.750,'Unter der Insel'],[0.940,'Aufstieg']
  ];
  var elCap = document.getElementById('caption');
  var elTitle = document.getElementById('titlecard');
  var elPaused = document.getElementById('pausedTag');
  var elFrame = document.getElementById('frame');
  var clock = 0, playing = true, last = null, capIdx = -1;

  function setPlaying(v){ playing = v; elPaused.style.opacity = v ? '0' : '1'; }
  elFrame.addEventListener('click', function(){ setPlaying(!playing); });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); }
  });
  function overlay(t){
    var tc = ((t % T_LOOP) + T_LOOP) % T_LOOP;
    elTitle.style.opacity = tc < 3.0 ? '1' : '0';
    var u = camU, ri = 0;
    for(var i=0;i<REGIONS.length;i++) if(u >= REGIONS[i][0]) ri = i;
    if(ri !== capIdx){ capIdx = ri; elCap.textContent = REGIONS[ri][1]; }
    var next = ri+1 < REGIONS.length ? REGIONS[ri+1][0] : 1.0;
    var span = next - REGIONS[ri][0];
    var lu = (u - REGIONS[ri][0]) / span;
    elCap.style.opacity = (tc > 3.4 && lu > 0.12 && lu < 0.62) ? '1' : '0';
  }
  function draw(dt, force){
    if(playing || force) clock += dt;
    frame(clock);
    overlay(clock);
  }
  function loop(now){
    if(last === null) last = now;
    var dt = Math.min(0.05, (now-last)/1000);
    last = now;
    draw(playing ? dt : 0, false);
    requestAnimationFrame(loop);
  }
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    playing = false; clock = 6;
  }
  window.addEventListener('resize', function(){ RT.W = -1; });
  window.__renderAt = function(tt){ clock = tt; frame(tt); overlay(tt); };
  window.__total = T_LOOP;
  setPlaying(playing);
  draw(0, true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
