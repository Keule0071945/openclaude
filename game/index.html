   beim Start durch eine Pipeline aus Kontur, Lichtkante und Emissiv-Maske

   weichgezeichnet additiv ueber die Szene gelegt wird — daher der Neon-Look.
   ========================================================================= */

function surface(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, x: c.getContext('2d') };
}

function fit(){
  const s = Math.max(1, Math.min(Math.floor(innerWidth/CW), Math.floor((innerHeight-30)/CH)));
  cv.style.width  = (CW*s)+'px';
  cv.style.height = (CH*s)+'px';
}
addEventListener('resize', fit); fit();

const pressed = Object.create(null);          // Einmal-Trigger pro Tastendruck
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();

addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const hit = k => { if (pressed[k]) { pressed[k] = false; return true; } return false; };
const clearPressed = () => { for (const k in pressed) pressed[k] = false; };

/* --------------------------------- Ton ---------------------------------- */
let muted = false, actx = null;
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0){
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (_) { /* Audio ist Beiwerk, nie spielentscheidend */ }
}

function seeded(seed){
  let s = seed >>> 0;
  return () => ((s = (s*1664525 + 1013904223) >>> 0) / 4294967296);

  // amt > 0 hellt Richtung Weiss auf, amt < 0 dunkelt ab
  const [r,g,b] = hex2rgb(hex);
  const f = v => amt >= 0 ? Math.round(v + (255-v)*amt) : Math.round(v*(1+amt));
  return '#' + [f(r),f(g),f(b)].map(v => clamp(v,0,255).toString(16).padStart(2,'0')).join('');

/* ========================= Sprite-Pipeline =============================== */
/* Ein Sprite entsteht in vier Schritten:
     1. Zeichenraster + Palette   -> Pixel
     2. Lichtkante                -> obere Raender heller, untere dunkler
     3. Kontur                    -> dunkle Umrandung der Silhouette
     4. Emissiv-Maske             -> leuchtende Zeichen zusaetzlich in die Glow-Ebene
   Ergebnis ist ein Objekt { c, g, w, h }: Farbebene, Glow-Ebene, Masse.        */

const OUTLINE = '#0b0913';

function buildSprite(rows, pal, opt = {}){
  const w0 = rows[0].length, h0 = rows.length;
  for (let i = 0; i < h0; i++)
    if (rows[i].length !== w0)
      throw new Error('Sprite-Raster: Zeile ' + i + ' hat ' + rows[i].length + ' statt ' + w0);

  const P = 1, w = w0 + 2*P, h = h0 + 2*P;          // 1px Rand fuer die Kontur
  const N = w*h;
  const col = new Array(N).fill(null);
  const solid = new Uint8Array(N);
  const glowing = new Uint8Array(N);
  const glowChars = opt.glow || '';

  for (let y = 0; y < h0; y++){
    for (let x = 0; x < w0; x++){
      const ch = rows[y][x];
      const c = pal[ch];
      if (!c) continue;
      const i = (y+P)*w + (x+P);
      col[i] = c; solid[i] = 1;
      if (glowChars.indexOf(ch) >= 0) glowing[i] = 1;
    }
  }

  // Lichtkante: was oben frei liegt wird heller, was unten haengt dunkler.
  const shaded = col.slice();
  for (let y = 1; y < h-1; y++){
    for (let x = 1; x < w-1; x++){
      const i = y*w + x;
      if (!solid[i] || glowing[i]) continue;
      if (!solid[i-w])      shaded[i] = tone(col[i],  0.30);
      else if (!solid[i+w]) shaded[i] = tone(col[i], -0.30);
      else if (!solid[i-1]) shaded[i] = tone(col[i],  0.12);
      else if (!solid[i+1]) shaded[i] = tone(col[i], -0.14);
    }
  }

  // Kontur um die Silhouette
  const oc = opt.outline || OUTLINE;
  if (opt.outline !== false){
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const i = y*w + x;
        if (solid[i]) continue;
        if ((x > 0   && solid[i-1]) || (x < w-1 && solid[i+1]) ||
            (y > 0   && solid[i-w]) || (y < h-1 && solid[i+w])) shaded[i] = oc;
      }
    }
  }

  const s = surface(w, h);
  const img = s.x.createImageData(w, h);
  for (let i = 0; i < N; i++){
    if (!shaded[i]) continue;
    const [r,g,b] = hex2rgb(shaded[i]);
    img.data[i*4] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255;
  }
  s.x.putImageData(img, 0, 0);

  // Glow-Ebene: leuchtende Pixel plus ein weicher Kern darum
  let gc = null;
  const ga = Math.round((opt.glowAlpha === undefined ? 1 : opt.glowAlpha) * 255);
  if (glowChars){
    const gs = surface(w, h);
    const gimg = gs.x.createImageData(w, h);
    let any = false;
    for (let i = 0; i < N; i++){
      if (!glowing[i]) continue;
      any = true;
      const [r,g,b] = hex2rgb(col[i]);
      gimg.data[i*4] = r; gimg.data[i*4+1] = g; gimg.data[i*4+2] = b;
      gimg.data[i*4+3] = ga;
    }
    if (any){ gs.x.putImageData(gimg, 0, 0); gc = gs.c; }
  }
  return { c: s.c, g: gc, w, h };
}

/* Waehlt einen Animationsframe; Index darf beliebig gross oder negativ sein. */
const pickFrame = (list, i) => list[(((i | 0) % list.length) + list.length) % list.length];

/* Baut aus einer Frame-Liste (Raster) eine Sprite-Liste. */
const frames = (grids, pal, opt) => grids.map(g => buildSprite(g, pal, opt));

/* Zeichnet ein Sprite mittig auf (x,y). Emissive Anteile gehen in die Glow-Ebene. */
function drawSpr(s, x, y, flip, tint, squash, scale){
  const hw = s.w >> 1, hh = s.h >> 1;
  const k = scale || 1;
  const put = (c2, img) => {
    c2.save();
    c2.translate(Math.round(x), Math.round(y));
    if (flip) c2.scale(-1, 1);
    if (k !== 1) c2.scale(k, k);
    if (squash && squash !== 1) c2.scale(1, squash);
    c2.drawImage(img, -hw, -hh);
    c2.restore();
  };
  put(ctx, s.c);
  if (tint > 0){
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flip) ctx.scale(-1, 1);
    if (k !== 1) ctx.scale(k, k);
    if (squash && squash !== 1) ctx.scale(1, squash);
    ctx.globalAlpha = tint;
    ctx.drawImage(s.c, -hw, -hh);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-hw, -hh, s.w, s.h);
    ctx.restore();
  }
  if (GC && s.g) put(GC, s.g);
}

/* Sprite vergroessert (nur fuer Menues) — bleibt hart gepixelt. */
function drawSprBig(s, x, y, k){
  const w = s.w*k, h = s.h*k;
  const px = Math.round(x - w/2), py = Math.round(y - h/2);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(s.c, px, py, w, h);
  if (GC && s.g) GC.drawImage(s.g, px, py, w, h);
}

/* Lichtflecken werden je Farbe einmal vorgerendert und danach nur noch
   skaliert gezeichnet — ein Farbverlauf pro Partikel und Frame war mit
   Abstand der teuerste Posten in der Darstellung.                            */
const GLOW_CACHE = new Map();
const GLOW_R = 24;
function glowSprite(color){
  let c = GLOW_CACHE.get(color);
  if (!c){
    const s = surface(GLOW_R*2, GLOW_R*2);
    const g = s.x.createRadialGradient(GLOW_R, GLOW_R, 0, GLOW_R, GLOW_R, GLOW_R);
    g.addColorStop(0, rgba(color, 1));
    g.addColorStop(0.45, rgba(color, 0.35));
    g.addColorStop(1, rgba(color, 0));
    s.x.fillStyle = g; s.x.fillRect(0, 0, GLOW_R*2, GLOW_R*2);
    c = s.c; GLOW_CACHE.set(color, c);
  }
  return c;
}
function glowDot(x, y, r, color, alpha = 1){
  if (!GC || alpha <= 0.01) return;
  GC.globalAlpha = alpha;
  GC.drawImage(glowSprite(color), x - r, y - r, r*2, r*2);
  GC.globalAlpha = 1;
}
function glowLine(x0, y0, x1, y1, w, color, alpha = 1){
  if (!GC) return;
  GC.strokeStyle = rgba(color, alpha);
  GC.lineWidth = w;
  GC.beginPath(); GC.moveTo(x0, y0); GC.lineTo(x1, y1); GC.stroke();
}

/* Ist ein Upgrade ausgereizt und das Partner-Upgrade weit genug, verschmelzen
   beide zur Ultimativwaffe des Helden. Wird einmal pro Runde ausgeloest.     */
const EVOLUTIONS = [
  { hero:'chicken',  need:{ multi:4,  power:3 }, name:'INFERNOSTAB',  col:'#ff8f3c',
    desc:['Kugeln entzuenden','brennenden Boden'] },
  { hero:'knight',   need:{ pierce:3, rapid:3 }, name:'KLINGENSTURM', col:'#9fd9ff',
    desc:['Klingen kehren zurueck','und durchbohren alles'] },
  { hero:'mage',     need:{ chain:3,  crit:3  }, name:'STURMLANZE',   col:'#7ee8ff',
    desc:['Bolzen spalten sich','bei jedem Treffer'] },
  { hero:'revenant', need:{ pierce:3, swift:3 }, name:'SEELENERNTE',  col:'#66f5c8',
    desc:['Sicheln kehren zurueck','und ernten Seelen'] },
];
function checkEvolution(){
  if (p.evo) return;
  const ev = EVOLUTIONS.find(e => e.hero === p.base.id);
  if (!ev) return;
  for (const k in ev.need) if (p.up[k] < ev.need[k]) return;
  p.evo = ev;
  banner(ev.name, 'WAFFE ENTWICKELT', ev.col, 3.2);
  flash = Math.max(flash, 0.9); shake = Math.max(shake, 6); hitStop = 0.22;
  burst(p.x, p.y, 40, ev.col, 150, 0.9);
  sfx.win();
}

function newPlayer(chr){

/* Abgeleitete Werte aus Upgrades, bleibendem Fortschritt und Schleife. */
function stats(){
  const u = p.up;
  return {
    maxHp:   p.base.hp + 12*perkLv('mHp') + 25*u.vital,
    speed:   p.base.speed * (1 + 0.12*u.swift) * (1 + 0.04*perkLv('mSpeed')),
    dmg:     (1 + 0.25*u.power) * (1 + 0.06*perkLv('mDmg')),
    cd:      Math.pow(0.82, u.rapid),
    proj:    u.multi,
    pierce:  u.pierce,
    crit:    0.12*u.crit,
    pickup:  20 * (1 + 0.6*u.magnet),
    regen:   0.8*u.regen,
    dashCd:  Math.max(1.1, 2.4 - 0.15*u.swift),
    gold:    1 + 0.2*perkLv('mGold'),
  };
}
/* Obergrenze eines Upgrades — jede New-Game-Schleife hebt sie um eins an. */
const upCap = u => u.max + loopN;

/* Einblendung fuer Evolutionen, Truhen und Phasenwechsel. */
function banner(title, sub, col, life = 2.2){
  const same = banners.find(b => b.title === title);
  if (same){ same.sub = sub; same.col = col; same.life = same.max = life; return; }
  banners.push({ title, sub, col, life, max:life });
  while (banners.length > 2) banners.shift();
}

/* ------------------------------- Partikel ------------------------------- */
const PART_CAP = 360;
function capParts(){
  if (parts.length > PART_CAP) parts.splice(0, parts.length - PART_CAP);
}
function burst(x, y, n, col, spd = 60, life = 0.4){
  for (let i = 0; i < n; i++){
    const a = rnd(0, TAU), s = rnd(spd*0.3, spd);
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life, max:life, col,
                 size: Math.random() < 0.3 ? 2 : 1 });
  }
  capParts();
}
function floatText(x, y, txt, col){
  texts.push({ x, y, txt, col, life:0.7 });
}

/* =============================== Angriffe =============================== */
function nearest(x, y, maxD = 1e9){
  let bestT = null, bd = maxD*maxD;
  for (const e of enemies){
    if (e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd){ bd = d; bestT = e; }
  }
  return bestT;
}

function shoot(x, y, ang, opt){
  bullets.push({
    x, y,
    vx: Math.cos(ang)*opt.spd, vy: Math.sin(ang)*opt.spd,
    r: opt.r, dmg: opt.dmg, pierce: opt.pierce, life: opt.life,
    col: opt.col, kind: opt.kind, hitList: [], ang, trail: opt.trail || 0,
    ignite: opt.ignite || false, boomerang: opt.boomerang || false,
    fork: opt.fork || 0, reap: opt.reap || false, born: 0, spin: rnd(0, TAU),
  });
}

function fireWeapon(){
  const s = stats();
  const t = nearest(p.x, p.y);
  const aim = t ? Math.atan2(t.y - p.y, t.x - p.x) : (p.flip ? Math.PI : 0);

  const evo = !!p.evo;

  if (p.base.weapon === 'fire'){
    const n = 1 + s.proj;
    for (let i = 0; i < n; i++){
      const spread = (i - (n-1)/2) * 0.20;
      shoot(p.x, p.y - 2, aim + spread, {
        spd: evo ? 130 : 150, r: evo ? 4 : 3,
        dmg: (evo ? 17 : 13)*s.dmg, pierce: 1 + s.pierce, life:1.6,
        col:'#ff8a3c', kind:'fire', trail:1, ignite:evo });
    }
    p.fireT = 0.70 * s.cd;
  } else if (p.base.weapon === 'blades'){
    const n = 4 + s.proj;
    for (let i = 0; i < n; i++){
      shoot(p.x, p.y, aim + i*TAU/n, {
        spd:135, r:3, dmg:(evo ? 15 : 12)*s.dmg,
        pierce: evo ? 99 : 2 + s.pierce, life: evo ? 2.4 : 1.5,
        col:'#c3ccdd', kind:'blade', boomerang:evo });
    }
    p.fireT = 0.68 * s.cd;
  } else if (p.base.weapon === 'scythe'){
    const n = 1 + s.proj;
    for (let i = 0; i < n; i++){
      shoot(p.x, p.y, aim + (i - (n-1)/2)*0.42, {
        spd:118, r:8, dmg:(evo ? 24 : 19)*s.dmg,
        pierce: 99, life: evo ? 2.6 : 1.5,
        col:'#66f5c8', kind:'scythe', boomerang:evo, reap:evo });
    }
    p.fireT = 0.92 * s.cd;
  } else { // bolt
    const n = 1 + s.proj;
    for (let i = 0; i < n; i++){
      const spread = (i - (n-1)/2) * 0.13;
      shoot(p.x, p.y - 2, aim + spread, {
        spd:230, r:2, dmg:(evo ? 12 : 9.5)*s.dmg, pierce:3 + s.pierce, life:1.1,
        col:'#7ec8ff', kind:'bolt', trail:1, fork: evo ? 2 : 0 });
    }
    p.fireT = 0.36 * s.cd;
  }
  sfx.shoot();
}

/* Schadensanwendung inkl. Krit, Kettenblitz und Explosionen. */
function hurtEnemy(e, dmg, opt = {}){
  if (e.dead) return;
  const s = stats();
  let d = dmg, crit = false;
  if (!opt.noCrit && Math.random() < s.crit){ d *= 2.2; crit = true; }
  e.hp -= d;
  e.flash = 0.08;
  floatText(e.x + rnd(-3,3), e.y - e.r - 2, Math.round(d), crit ? '#ffe680' : '#ffffff');
  // Funken fliegen entgegen der Einschlagrichtung
  const sa = opt.ang === undefined ? rnd(0, TAU) : opt.ang + Math.PI;
  spark(e.x, e.y, sa, crit ? 9 : 4, crit ? '#ffe680' : '#ff9a5a');
  if (crit){ hitStop = Math.max(hitStop, 0.05); shake = Math.max(shake, 1.6); }
  sfx.hit();

  if (!opt.noChain && p.up.chain > 0){
    const jumps = p.up.chain;
    let src = e, seen = new Set([e]);
    for (let j = 0; j < jumps; j++){
      let nxt = null, bd = 46*46;
      for (const o of enemies){
        if (o.dead || seen.has(o)) continue;
        const dd = dist2(src.x, src.y, o.x, o.y);
        if (dd < bd){ bd = dd; nxt = o; }
      }
      if (!nxt) break;
      parts.push({ arc:[src.x, src.y, nxt.x, nxt.y], life:0.12, max:0.12, col:'#7ec8ff' });
      seen.add(nxt);
      hurtEnemy(nxt, dmg*0.55, { noChain:true });
      src = nxt;
    }
  }

  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if (e.boss) return;               // Boss-Tod laeuft ueber die Inszenierung
  e.dead = true;
  kills++;
  combo++; comboT = 2.6; comboPop = 1;
  addDecal(e.x, e.y, e.elite ? 14 : 7, 'splat', e.gore || '#ff5a5a');
  burst(e.x, e.y, e.elite ? 22 : 10, e.gore || '#ff5a5a', e.elite ? 130 : 80, 0.45);
  const gemN = e.elite ? 5 : 1;
  for (let i = 0; i < gemN; i++)
    gems.push({ x:e.x + rnd(-4,4), y:e.y + rnd(-4,4), vx:rnd(-30,30), vy:rnd(-40,-10),
                val:e.xp || 4, life:14, t:0 });
  p.gold += (e.elite ? 14 : 2) * stats().gold;
  if (p.evo && p.evo.hero === 'revenant')       // Seelenernte: Extra-Splitter
    gems.push({ x:e.x, y:e.y, vx:rnd(-20,20), vy:-30, val:3, life:14, t:0 });
  if (e.elite){
    hitStop = Math.max(hitStop, 0.09); shake = Math.max(shake, 4);
    chests.push({ x:e.x, y:e.y, vy:-40, t:0, open:false });
  }
  sfx.boom();
}

/* Gerichtete Trefferfunken statt gleichmaessiger Streuung. */
function spark(x, y, ang, n, col){
  for (let i = 0; i < n; i++){
    const a = ang + rnd(-0.7, 0.7), sp = rnd(40, 130);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                 life:0.3, max:0.3, col, size: Math.random() < 0.4 ? 2 : 1 });
  }
}

/* Truhe einsammeln: eine von drei Belohnungen. */
function openChest(c){
  c.open = true;
  const roll = Math.random();
  if (roll < 0.45){
    p.pendingLv++;
    banner('SCHATZ', 'EINE VERSTAERKUNG', '#ffd23f');
  } else if (roll < 0.75){
    const heal = stats().maxHp*0.4;
    p.hp = Math.min(stats().maxHp, p.hp + heal);
    banner('SCHATZ', '+' + Math.round(heal) + ' LEBEN', '#ff5a7a');
  } else {
    const g = Math.round(rnd(40, 80) * stats().gold);
    p.gold += g;
    banner('SCHATZ', '+' + g + ' GOLD', '#ffd23f');
  }
  burst(c.x, c.y, 26, '#ffd23f', 120, 0.7);
  flash = Math.max(flash, 0.4);
  sfx.level();
}

function explode(x, y, radius, dmg){
  // Nur groessere Einschlaege hinterlassen eine Spur — sonst matscht der Boden
  // bei Dauerbeschuss zu und das Backen kostet unnoetig Bildrate.
  if (radius >= 18 && Math.random() < 0.5) addDecal(x, y, radius*0.7, 'scorch', '#ff8f3c');
  burst(x, y, 8, '#ffb03a', 110, 0.4);
  parts.push({ ring:true, x, y, r:radius, life:0.2, max:0.2, col:'#ffd23f' });
  shake = Math.max(shake, 2);
  if (dmg <= 0) return;                 // reine Optik (z. B. Meteoreinschlag)
  for (const e of enemies){
    if (e.dead) continue;
    if (dist2(x, y, e.x, e.y) < (radius + e.r)*(radius + e.r))
      hurtEnemy(e, dmg, { noCrit:true, noChain:true });
  }
}

/* ============================ Gegner & Bosse ============================= */
function spawnMinion(kind, elite){
  // Am Rand ausserhalb des Sichtfelds einfliegen lassen
  const side = rndi(0, 3);
  let x, y;
  if (side === 0){ x = rnd(0, CW); y = -12; }
  else if (side === 1){ x = rnd(0, CW); y = CH + 12; }
  else if (side === 2){ x = -12; y = rnd(0, CH); }
  else { x = CW + 12; y = rnd(0, CH); }

  const tier = (1 + stageIdx*0.55 + runTime/95) * (1 + 0.45*loopN);
  const defs = {
    bat:   { spr:SPR.bat,   hp:14*tier, spd:44, r:5, dmg:5,  xp:5, gore:'#6b4d88' },
    imp:   { spr:SPR.imp,   hp:22*tier, spd:52, r:5, dmg:7,  xp:7, gore:'#d8433a' },
    skull: { spr:SPR.skull, hp:30*tier, spd:60, r:5, dmg:9,  xp:9, gore:'#bdb7a8' },
  };
  const d = defs[kind];
  const e = { x, y, vx:0, vy:0, hp:d.hp, maxHp:d.hp, r:d.r, spr:d.spr,
              spd:d.spd, dmg:d.dmg, xp:d.xp, gore:d.gore, flash:0, minion:true,
              wob:rnd(0,TAU), frame:rnd(0,2), fps:rnd(5,8), elite:false, scale:1 };
  if (elite){                          // Elite: dicker, groesser, laesst eine Truhe fallen
    e.elite = true; e.scale = 1.6;
    e.hp = e.maxHp = d.hp*7 + 40;
    e.r = d.r + 3; e.dmg = d.dmg*1.6; e.xp = d.xp*3;
    e.spd = d.spd*0.78; e.fps = d.fps*0.7;
  }
  enemies.push(e);
  return e;
}

function eshoot(x, y, ang, spd, dmg, r, col, life = 6){
  ebullets.push({ x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
                  r, dmg, col, life, t:0 });
}

/* Phasenwechsel: Bildschirmpuls, Hitstop und eine Druckwelle vom Boss aus. */
function phaseBreak(b, title, col){
  flash = Math.max(flash, 0.85); shake = Math.max(shake, 7);
  aberr = 1; hitStop = Math.max(hitStop, 0.18);
  camPunch(0.12); camTilt(rnd(-0.035, 0.035));
  transformArena(b.phase - 1);
  banner(title, b.name + '  ·  PHASE ' + b.phase, col, 2.4);
  waves.push({ x:b.x, y:b.y, r:6, max:260, spd:150, dmg:0, hitP:true, deco:true });
  burst(b.x, b.y, 34, col, 160, 0.8);
  sfx.boss();
}

/* --- Boss 1: Gorgok, der Steinwaechter ---------------------------------- */
function makeGorgok(hp){
  return {
    boss:true, name:'GORGOK', x:CW/2, y:64, vx:0, vy:0, hp, maxHp:hp, r:16,
    spr:SPR.gorgok, dmg:13, flash:0, phase:1, t:0, frame:0, fps:2.2,
    tSpread:1.6, tCharge:4.5, tSummon:3.0, chargeState:0, chargeAng:0, chargeT:0,
    ai(dt){
      this.t += dt;
      if (this.phase === 1 && this.hp < this.maxHp*0.5){
        this.phase = 2; phaseBreak(this, 'ERZUERNT', '#ffd23f');
      }
      const ph = this.phase;

      if (this.chargeState === 0){
        // Traeges Verfolgen
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        this.vx = Math.cos(a) * (ph === 2 ? 26 : 18);
        this.vy = Math.sin(a) * (ph === 2 ? 26 : 18);
      } else if (this.chargeState === 1){
        this.vx = this.vy = 0;
        this.chargeT -= dt;
        if (this.chargeT <= 0){
          this.chargeState = 2; this.chargeT = 0.85;
          this.chargeAng = Math.atan2(p.y - this.y, p.x - this.x);
          camPunch(0.07); sfx.boss();
        }
      } else {
        this.vx = Math.cos(this.chargeAng)*185;
        this.vy = Math.sin(this.chargeAng)*185;
        this.chargeT -= dt;
        burst(this.x, this.y + 8, 1, '#8a8f9c', 30, 0.3);
        if (this.chargeT <= 0){ this.chargeState = 0; this.tCharge = ph === 2 ? 3.6 : 5.2; }
      }

      this.tSpread -= dt;
      if (this.tSpread <= 0 && this.chargeState === 0){
        const n = ph === 2 ? 14 : 9;
        const off = rnd(0, TAU);
        for (let i = 0; i < n; i++)
          eshoot(this.x, this.y, off + i*TAU/n, 56, 8, 3, '#e0c088');
        this.tSpread = ph === 2 ? 2.0 : 2.8;
        camPunch(0.035); sfx.boom();
      }

      this.tCharge -= dt;
      if (this.tCharge <= 0 && this.chargeState === 0){
        this.chargeState = 1; this.chargeT = 0.7;
      }

      this.tSummon -= dt;
      if (this.tSummon <= 0){
        for (let i = 0; i < (ph === 2 ? 4 : 2); i++) spawnMinion('bat');
        this.tSummon = ph === 2 ? 4.0 : 5.5;
      }
    },
  };
}

/* --- Boss 2: Seraphine, die Erzengelin ---------------------------------- */
const RAINBOW = ['#ff5a5a','#ffb03a','#ffe680','#9be15d','#4ad4f0','#7a9dff','#e07aff'];
function makeSeraphine(hp){
  return {
    boss:true, name:'SERAPHINE', x:CW/2, y:56, vx:0, vy:0, hp, maxHp:hp, r:16,
    spr:SPR.seraphine, dmg:14, flash:0, phase:1, t:0, hover:rnd(0,TAU), frame:0, fps:3.2,
    tBeam:3.0, tFan:2.2, tPort:5.0, tSummon:4.0, beamAng:0,
    ai(dt){
      this.t += dt; this.hover += dt*1.8;
      if (this.phase === 1 && this.hp < this.maxHp*0.5){
        this.phase = 2; phaseBreak(this, 'HIMMELSZORN', '#ffe680');
      }
      const ph = this.phase;

      // Sanftes Schweben, haelt Abstand nach oben
      const tx = clamp(p.x, 40, CW-40);
      this.vx = (tx - this.x) * 0.8;
      this.vy = (56 + Math.sin(this.hover)*10 - this.y) * 1.6;

      this.tPort -= dt;
      if (this.tPort <= 0){
        burst(this.x, this.y, 16, '#fdfdff', 90, 0.4);
        this.x = rnd(50, CW-50); this.y = rnd(38, 80);
        burst(this.x, this.y, 16, '#f2c14e', 90, 0.4);
        this.tPort = ph === 2 ? 3.6 : 5.4;
      }

      // Rotierende Regenbogen-Strahlen
      this.tBeam -= dt;
      if (this.tBeam <= 0){
        const n = ph === 2 ? 6 : 4;
        const base = Math.atan2(p.y - this.y, p.x - this.x);
        for (let i = 0; i < n; i++){
          beams.push({ x:this.x, y:this.y, ang:base + i*TAU/n,
                       spin:(i%2 ? 1 : -1) * (ph === 2 ? 0.55 : 0.38),
                       warn:0.9, life:2.2, dmg:10, w:2.5,
                       col:RAINBOW[i % RAINBOW.length], owner:this });
        }
        this.tBeam = ph === 2 ? 4.6 : 6.0;
        camPunch(0.06); sfx.boss();
      }

      this.tFan -= dt;
      if (this.tFan <= 0){
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        for (let i = -2; i <= 2; i++)
          eshoot(this.x, this.y + 6, a + i*0.17, 92, 8, 2, '#fff3a8');
        this.tFan = ph === 2 ? 1.5 : 2.3;
      }

      this.tSummon -= dt;
      if (this.tSummon <= 0){
        for (let i = 0; i < (ph === 2 ? 3 : 2); i++) spawnMinion('imp');
        this.tSummon = ph === 2 ? 4.2 : 6.0;
      }
    },
  };
}

/* --- Boss 3: Abaddon, die Apokalypse ------------------------------------ */
function makeAbaddon(hp){
  return {
    boss:true, name:'ABADDON', x:CW/2, y:62, vx:0, vy:0, hp, maxHp:hp, r:21,
    spr:SPR.abaddon, dmg:17, flash:0, phase:1, t:0, spiral:0, frame:0, fps:2.6,
    tSpiral:0, tMeteor:3.2, tSummon:4.0, tWave:6.0,
    ai(dt){

      if (this.phase === 1 && this.hp < this.maxHp*0.66){
        this.phase = 2; phaseBreak(this, 'DAS SIEGEL BRICHT', '#ff6b2c');
      }
      if (this.phase === 2 && this.hp < this.maxHp*0.30){
        this.phase = 3; phaseBreak(this, 'DAS ENDE', '#ff5a5a');
      }
      const ph = this.phase;

      const a = Math.atan2(p.y - this.y, p.x - this.x);
      const sp = 16 + ph*7;
      this.vx = Math.cos(a)*sp; this.vy = Math.sin(a)*sp*0.6;

      // Dauerhafte Spiralen
      this.tSpiral -= dt;
      if (this.tSpiral <= 0){
        this.spiral += 0.42;
        const arms = ph >= 3 ? 3 : ph === 2 ? 2 : 1;
        for (let k = 0; k < arms; k++)
          eshoot(this.x, this.y, this.spiral + k*TAU/arms, 62, 9, 3, '#ff6b2c');
        this.tSpiral = 0.10;
      }

      this.tMeteor -= dt;
      if (this.tMeteor <= 0){
        const n = 2 + ph;
        for (let i = 0; i < n; i++)
          meteors.push({ x:rnd(20, CW-20), y:rnd(30, CH-20), warn:1.25, warnMax:1.25,
                         r:22, dmg:14, boom:0 });

      this.tSummon -= dt;
      if (this.tSummon <= 0){
        for (let i = 0; i < 1 + ph; i++) spawnMinion('skull');

      }
    },
  };
}

/* ============================ Arenen / Parallax ========================== */
/* Jede Arena besteht aus mehreren Ebenen, die sich unterschiedlich schnell
   gegen die Kamera verschieben. Ebenen koennen einen eigenen Glow-Anteil
   mitbringen (Lava, Sonne), der in die Leuchtebene wandert.                 */

const HORIZON = 94;
const LW = CW + 96;                       // Ebenen sind breiter als der Schirm

function layer(depth, scroll, draw){
  const s = surface(LW, CH), g = surface(LW, CH);
  draw(s.x, g.x);
  return { c:s.c, g:g.c, depth, scroll: scroll || 0 };
}

/* ------------------------- Bodenwerkzeuge -------------------------------- */
/* Bruchsteinpflaster: versetzte Reihen aus verschieden grossen Steinen, jeder
   mit eigener Faerbung, Lichtkante oben und Schattenkante unten. Kein Raster. */
function cobbles(c, rng, x0, y0, x1, y1, pal, opt = {}){
  const rowH = opt.rowH || 6;
  for (let y = y0; y < y1; ){
    const rh = Math.max(3, rowH + (rng() < 0.35 ? 2 : 0) - (rng() < 0.35 ? 1 : 0));
    let x = x0 - rng()*22;
    while (x < x1){
      // Groesse und Hoehe schwanken stark; manche Steine ueberlappen die naechste
      // Reihe und werden dort teils ueberzeichnet — das loest das Raster auf.
      const big = rng() < 0.18;
      const w = (opt.wMin || 5) + (rng()*(opt.wVar || 7)|0) + (big ? 6 + (rng()*10|0) : 0);
      const h = rh - 1 - (rng() < 0.3 ? 1 : 0) + (rng() < 0.24 ? rh : 0);
      const yy = y - (rng() < 0.35 ? 1 : 0) + (rng() < 0.35 ? 1 : 0);
      if (x + w > x0 && x < x1 && yy + h > y0 && h > 0){
        const col = pal[(rng()*pal.length)|0];
        c.fillStyle = col; c.fillRect(x|0, yy|0, w, h);
        c.fillStyle = tone(col, 0.13); c.fillRect(x|0, yy|0, w, 1);
        c.fillStyle = tone(col, -0.3);  c.fillRect(x|0, (yy+h-1)|0, w, 1);
        if (rng() < 0.22){ c.fillStyle = tone(col, -0.42);   // Absplitterung
          c.fillRect((x + rng()*(w-2))|0, (yy + 1 + rng()*Math.max(1,h-2))|0,
                     1 + (rng()*2|0), 1); }
      }
      x += w + 1 + (rng() < 0.3 ? 1 : 0);
    }
    y += rh;
  }
}

/* Weiche, unregelmaessige Flaeche aus ueberlagerten Ellipsen. */
function blob(c, rng, cx, cy, rx, ry, cols, lumps = 7){
  for (let i = 0; i < lumps; i++){
    c.fillStyle = cols[(rng()*cols.length)|0];
    const ox = (rng()-0.5)*rx, oy = (rng()-0.5)*ry;
    c.beginPath();
    c.ellipse(cx+ox, cy+oy, rx*(0.4+rng()*0.5), ry*(0.4+rng()*0.5), 0, 0, TAU);
    c.fill();
  }
}

/* Moosinsel mit Grasbueschseln an der Oberkante. */
function moss(c, rng, cx, cy, rx, ry){
  blob(c, rng, cx, cy, rx, ry, ['#2f4f30','#385c36','#28452a'], 8);
  for (let i = 0; i < rx*0.5; i++){                     // Halme
    const x = cx + (rng()-0.5)*rx*1.7, y = cy + (rng()-0.5)*ry*1.3;
    const h = 2 + (rng()*3|0);
    c.fillStyle = rng() < 0.35 ? '#587c46' : '#3f6338';
    c.fillRect(x|0, (y-h)|0, 1, h);
  }
  if (rng() < 0.5){                                     // vereinzelte Blueten
    c.fillStyle = rng() < 0.5 ? '#d8c85a' : '#c96a86';
    c.fillRect((cx + (rng()-0.5)*rx)|0, (cy + (rng()-0.5)*ry)|0, 1, 1);
  }
}

/* Der alte Weg: ein gepflastertes Band quer durch die Arena mit Bordsteinen. */
function oldRoad(c, rng, y, h, stonePal, kerbCol){
  c.fillStyle = tone(kerbCol, -0.45);                   // Bettung
  c.fillRect(0, y-2, LW, h+4);
  cobbles(c, rng, 0, y, LW, y+h, stonePal, { rowH:6, wMin:6, wVar:8 });
  for (const ky of [y-2, y+h]){                         // Bordsteine
    c.fillStyle = kerbCol; c.fillRect(0, ky, LW, 3);
    c.fillStyle = tone(kerbCol, 0.22); c.fillRect(0, ky, LW, 1);
    c.fillStyle = tone(kerbCol, -0.35);
    for (let x = 0; x < LW; x += 11) c.fillRect(x, ky, 1, 3);
  }
}

/* Der Kampfring: eine Ellipse mit abgesetztem Rand in der Mitte der Arena.
   Er wird in die Bodenebene gebacken und wandert daher mit ihr mit.          */
const RING = { x: LW/2, y: 158, rx: 104, ry: 46 };
function combatRing(c, colRim, colIn, colEdge){
  c.save();
  c.fillStyle = colIn;                                     // eingelassene Flaeche
  c.beginPath(); c.ellipse(RING.x, RING.y, RING.rx, RING.ry, 0, 0, TAU); c.fill();
  c.strokeStyle = colRim; c.lineWidth = 3;                 // Ringmauer
  c.beginPath(); c.ellipse(RING.x, RING.y, RING.rx, RING.ry, 0, 0, TAU); c.stroke();
  c.strokeStyle = colEdge; c.lineWidth = 1;                // Lichtkante oben
  c.beginPath(); c.ellipse(RING.x, RING.y-1, RING.rx, RING.ry, 0, Math.PI, TAU); c.stroke();
  c.strokeStyle = colRim; c.lineWidth = 1;                 // innerer Absatz
  c.beginPath(); c.ellipse(RING.x, RING.y, RING.rx-7, RING.ry-3, 0, 0, TAU); c.stroke();
  for (let i = 0; i < 16; i++){                            // Pflastersteine im Rand
    const a = i*TAU/16;
    c.fillStyle = i % 2 ? colRim : colEdge;
    c.fillRect((RING.x + Math.cos(a)*(RING.rx-3))|0, (RING.y + Math.sin(a)*(RING.ry-1))|0, 3, 2);
  }
  c.restore();
}

/* Zackenlinie fuer Gebirge und Truemmerkanten. */
function jagged(c, rng, y0, amp, step, col, h){
  c.fillStyle = col;
  let y = y0;
  for (let x = 0; x < LW; x += step){
    y = clamp(y + (rng()-0.5)*amp, y0-amp*2, y0+amp*2);
    c.fillRect(x, y|0, step, h - y);
  }
}

const ARENAS = {

      c.globalAlpha = 1;
    };
    A.push(layer(0.04, 4,  cloudBank(11, 42, 7,  '#2f4478', 0.6)));
    A.push(layer(0.12, 9,  cloudBank(23, 58, 9,  '#42588f', 0.66)));
    A.push(layer(0.2, 0, (c, g) => {                            // Marmorsaeulen
      const rng = seeded(37);
      for (let i = 0; i < 7; i++){
        const x = (i*72 + rng()*26)|0, h = 52 + rng()*36, w = 14;
        c.fillStyle = '#8b9cc8'; c.fillRect(x, (HORIZON-h)|0, w, h);
        c.fillStyle = '#b3c1e6'; c.fillRect(x, (HORIZON-h)|0, w, 3);
        c.fillStyle = '#f2c14e'; c.fillRect(x-2, (HORIZON-h)|0, w+4, 2);
        c.fillStyle = '#5e6d99'; c.fillRect(x+w-3, (HORIZON-h)|0, 3, h);
      }
    }));
    A.push(layer(0.4, 14, cloudBank(41, HORIZON-4, 8, '#5a6ea2', 0.8)));
    const isles = [];
    A.push(layer(0.5, 0, (c, g) => {               // Wolkendecke, darauf Marmorinseln
      const rng = seeded(77);
      const MARBLE = ['#5d6a93','#67759f','#525f85','#6f7daa'];

      const gr = c.createLinearGradient(0, HORIZON, 0, CH);   // Wolkendecke
      gr.addColorStop(0, '#38477a'); gr.addColorStop(1, '#212d52');
      c.fillStyle = gr; c.fillRect(0, HORIZON, LW, CH-HORIZON);
      for (let i = 0; i < 150; i++){                          // Wolkenballen
        const x = rng()*LW, y = HORIZON + rng()*(CH-HORIZON), r = 6 + rng()*16;
        c.globalAlpha = 0.28 + rng()*0.3;
        c.fillStyle = rng() < 0.45 ? '#465892' : '#33447a';
        c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
      c.fillStyle = 'rgba(160,185,240,0.13)';                 // Lichtkanten oben
      for (let i = 0; i < 60; i++){
        const x = rng()*LW, y = HORIZON + rng()*(CH-HORIZON), r = 5 + rng()*12;
        c.beginPath(); c.arc(x, y, r, Math.PI, TAU); c.fill();
      }

      // Schwebende Marmorinseln aus Bruchstein, mit Goldkante
      for (let i = 0; i < 8; i++){
        const ix = rng()*LW, iy = HORIZON + 10 + rng()*(CH-HORIZON-20);
        const rx = 16 + rng()*26, ry = 6 + rng()*8;
        c.fillStyle = 'rgba(24,32,64,0.4)';                   // Schatten darunter
        c.beginPath(); c.ellipse(ix, iy+3, rx, ry, 0, 0, TAU); c.fill();
        c.save();
        c.beginPath(); c.ellipse(ix, iy, rx, ry, 0, 0, TAU); c.clip();
        cobbles(c, rng, ix-rx, iy-ry, ix+rx, iy+ry, MARBLE, { rowH:5, wMin:5, wVar:6 });
        c.restore();
        c.strokeStyle = '#9c8134'; c.lineWidth = 1;
        c.beginPath(); c.ellipse(ix, iy, rx, ry, 0, 0, TAU); c.stroke();
        c.strokeStyle = '#b39a4c';
        c.beginPath(); c.ellipse(ix, iy-1, rx, ry, 0, Math.PI, TAU); c.stroke();
        isles.push({ x:ix, y:iy, rx, ry });
      }

      oldRoad(c, rng, 108, 26, MARBLE, '#7a6528');            // Marmorsteg quer durchs Bild

      combatRing(c, '#9c8134', '#4a5b96', '#c9a95a');         // Hauptinsel
      c.save();
      c.beginPath(); c.ellipse(RING.x, RING.y, RING.rx-4, RING.ry-2, 0, 0, TAU); c.clip();
      cobbles(c, rng, RING.x-RING.rx, RING.y-RING.ry, RING.x+RING.rx, RING.y+RING.ry,
              MARBLE, { rowH:5, wMin:5, wVar:6 });
      c.restore();
      c.fillStyle = 'rgba(242,193,78,0.5)';                   // Intarsien
      for (let i = 0; i < 8; i++){
        const ang = i*TAU/8;
        c.fillRect((RING.x + Math.cos(ang)*RING.rx*0.55)|0,
                   (RING.y + Math.sin(ang)*RING.ry*0.55)|0, 5, 3);
      }
      g.fillStyle = 'rgba(255,225,150,0.10)'; g.fillRect(0, HORIZON, LW, 3);
      g.fillStyle = 'rgba(255,215,120,0.06)';
      g.beginPath(); g.ellipse(RING.x, RING.y, RING.rx, RING.ry, 0, 0, TAU); g.fill();
    }));
    return { layers:A, kind:'heaven', tint:'#ffe08a', spots:[], isles, seal:'#ffe066' };
  },

  /* -------------------------------- HOELLE ------------------------------ */
  hell(){
    const A = [];
    A.push(layer(0, 0, (c, g) => {
      const gr = c.createLinearGradient(0, 0, 0, CH);
      gr.addColorStop(0, '#100307'); gr.addColorStop(0.55, '#2c070c'); gr.addColorStop(1, '#4d0f12');
      c.fillStyle = gr; c.fillRect(0, 0, LW, CH);
      g.fillStyle = 'rgba(255,90,40,0.34)';                      // Finsternis-Sonne
      g.beginPath(); g.arc(LW*0.5, 30, 34, 0, TAU); g.fill();
      c.fillStyle = '#c2361f';
      c.beginPath(); c.arc(LW*0.5, 30, 20, 0, TAU); c.fill();
      c.fillStyle = '#160407';
      c.beginPath(); c.arc(LW*0.5-4, 27, 18, 0, TAU); c.fill();
    }));
    A.push(layer(0.06, 0, c => jagged(c, seeded(71), HORIZON-30, 12, 7, '#28080c', CH)));
    A.push(layer(0.18, 0, (c, g) => {                           // Brennende Tuerme
      const rng = seeded(83);
      for (let i = 0; i < 8; i++){
        const x = (i*66 + rng()*22)|0, h = 40 + rng()*46, w = 16 + (rng()*8|0);
        c.fillStyle = '#3a0d11'; c.fillRect(x, (HORIZON-h)|0, w, h);
        c.fillStyle = '#4d1216'; c.fillRect(x, (HORIZON-h)|0, w, 2);
        c.fillStyle = '#ff7a2a'; c.fillRect(x+3, (HORIZON-h+5)|0, 3, 4);
        g.fillStyle = 'rgba(255,120,40,0.26)';
        g.beginPath(); g.arc(x+4, HORIZON-h+6, 8, 0, TAU); g.fill();
      }
    }));
    A.push(layer(0.34, 0, (c, g) => {                           // Lavaspalt am Horizont
      jagged(c, seeded(97), HORIZON-5, 4, 5, '#1c0507', HORIZON+3);
      c.fillStyle = '#ff8f3c'; c.fillRect(0, HORIZON-1, LW, 2);
      g.fillStyle = 'rgba(255,120,40,0.32)'; g.fillRect(0, HORIZON-3, LW, 6);
    }));
    const veins = [];
    A.push(layer(0.5, 0, (c, g) => {               // aufgebrochene Kruste ueber Glut
      const rng = seeded(109);
      const CRUST = ['#2c0e11','#351317','#250b0e','#3d181c'];
      const BASALT = ['#3a1512','#2f100e','#452019','#341410'];

      c.fillStyle = '#1c0a0c'; c.fillRect(0, HORIZON, LW, CH-HORIZON);
      // Grosse Krustenplatten als Grundflaeche
      cobbles(c, rng, -8, HORIZON-2, LW+8, CH+4, CRUST, { rowH:11, wMin:12, wVar:20 });
      for (let i = 0; i < 26; i++)                            // aufgeworfene Schollen
        blob(c, rng, rng()*LW, HORIZON + rng()*(CH-HORIZON), 8 + rng()*18, 3 + rng()*6,
             CRUST, 4);

      // Nur wo die Kruste aufgebrochen ist, scheint der gluehende Grund durch
      for (let i = 0; i < 9; i++){
        const fx = rng()*LW, fy = HORIZON + 8 + rng()*(CH-HORIZON-16);
        const rx = 10 + rng()*22, ry = 4 + rng()*7;
        c.save();
        c.beginPath(); c.ellipse(fx, fy, rx, ry, 0, 0, TAU); c.clip();
        const fg = c.createLinearGradient(0, fy-ry, 0, fy+ry);
        fg.addColorStop(0, '#7a2409'); fg.addColorStop(0.5, '#c04a15'); fg.addColorStop(1, '#5c1a06');
        c.fillStyle = fg; c.fillRect(fx-rx, fy-ry, rx*2, ry*2);
        for (let k = 0; k < 6; k++){                          // Brocken schwimmen darin
          c.fillStyle = CRUST[(rng()*CRUST.length)|0];
          c.fillRect((fx + (rng()-0.5)*rx*1.7)|0, (fy + (rng()-0.5)*ry*1.5)|0,
                     3+(rng()*6|0), 2+(rng()*2|0));
        }
        c.restore();
        c.strokeStyle = '#6b2a12'; c.lineWidth = 1;
        c.beginPath(); c.ellipse(fx, fy, rx, ry, 0, 0, TAU); c.stroke();
        g.fillStyle = 'rgba(255,110,40,0.26)';
        g.beginPath(); g.ellipse(fx, fy, rx, ry, 0, 0, TAU); g.fill();
      }

      for (let i = 0; i < 20; i++){                           // Glutadern als Pfade
        const path = [];
        let x = rng()*LW, y = HORIZON + rng()*(CH-HORIZON);
        for (let k = 0; k < 10; k++){
          path.push([x, y]);
          c.fillStyle = '#e0641f'; c.fillRect(x|0, y|0, 2, 1);
          c.fillStyle = '#ffb03a'; c.fillRect(x|0, y|0, 1, 1);
          g.fillStyle = 'rgba(255,110,40,0.26)'; g.fillRect((x-1)|0, (y-1)|0, 4, 3);
          x += (rng()-0.35)*7; y += (rng()-0.4)*4;
        }
        veins.push({ path, t: rng() });
      }

      oldRoad(c, rng, 108, 26, BASALT, '#5a2a1c');            // Basaltweg quer durchs Bild

      combatRing(c, '#5a1a18', '#260d10', '#8a3020');
      c.save();
      c.beginPath(); c.ellipse(RING.x, RING.y, RING.rx-4, RING.ry-2, 0, 0, TAU); c.clip();
      cobbles(c, rng, RING.x-RING.rx, RING.y-RING.ry, RING.x+RING.rx, RING.y+RING.ry,
              BASALT, { rowH:7, wMin:7, wVar:10 });
      c.restore();

      for (let i = 0; i < 6; i++){                            // Schaedel im Geroell
        const x = (rng()*LW)|0, y = (HORIZON + 14 + rng()*(CH-HORIZON-24))|0;
        c.fillStyle = '#6e6355'; c.fillRect(x, y, 6, 5);
        c.fillStyle = '#1a0508'; c.fillRect(x+1, y+1, 2, 2); c.fillRect(x+4, y+1, 1, 2);
      }
      for (let i = 0; i < 10; i++){                           // Obsidiansplitter
        const x = (rng()*LW)|0, y = (HORIZON + 10 + rng()*(CH-HORIZON-16))|0;
        c.fillStyle = '#1a0508';
        c.beginPath(); c.moveTo(x, y); c.lineTo(x+5, y+3); c.lineTo(x-2, y+4);
        c.closePath(); c.fill();
        c.fillStyle = '#4a1c1a'; c.fillRect(x, y+1, 2, 1);
      }
    }));
    return { layers:A, kind:'hell', tint:'#ff8f3c', spots:[], veins, seal:'#ff8f3c' };
  },
};

/* --------------------------- Vordergrund-Ebene --------------------------- */
/* Laeuft vor den Figuren durch und haelt die Mitte frei, damit sie nur Tiefe
   gibt und nie die Sicht auf das Spielgeschehen nimmt.                       */
function foreground(kind){
  return layer(0.85, kind === 'heaven' ? 7 : 0, (c, g) => {
    const rng = seeded(kind.length*131 + 5);
    const bases = [10, 62, LW-70, LW-16];         // nur an den Raendern
    if (kind === 'ruins'){
      for (const bx of bases){
        const w = 20 + (rng()*12|0), h = 86 + rng()*46;
        c.fillStyle = '#121624'; c.fillRect(bx|0, (CH-h)|0, w, h);
        c.fillStyle = '#2b3252'; c.fillRect(bx|0, (CH-h)|0, 2, h);        // Lichtkante
        c.fillStyle = '#080a12'; c.fillRect((bx+w-2)|0, (CH-h)|0, 2, h);  // Schattenkante
        c.fillStyle = '#1d2338';                                          // Kapitell
        c.fillRect((bx-3)|0, (CH-h)|0, w+6, 5);
        for (let k = 0; k < 7; k++){               // ausgebrochene Oberkante
          c.fillStyle = '#121624';
          c.fillRect((bx + rng()*w)|0, (CH-h-2-rng()*7)|0, 3, 8);
        }
        for (let k = 0; k < 4; k++){               // Risse im Schaft
          c.fillStyle = '#080a12';
          c.fillRect((bx + 4 + rng()*(w-8))|0, (CH-h+10+rng()*(h-20))|0, 1, 4+(rng()*7|0));
        }
      }
      c.fillStyle = '#121624';                     // umgestuerzte Saeule quer
      c.fillRect(0, CH-13, 88, 13); c.fillRect(LW-104, CH-10, 104, 10);
      c.fillStyle = '#1d2338';
      c.fillRect(0, CH-13, 88, 2); c.fillRect(LW-104, CH-10, 104, 2);
    } else if (kind === 'heaven'){
      for (const bx of bases){                     // Wolkenschwaden
        c.globalAlpha = 0.5; c.fillStyle = '#c9d8f7';
        for (let i = 0; i < 16; i++){
          const x = bx + (rng()-0.5)*70, y = CH - 6 - rng()*22, r = 5 + rng()*9;
          c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
        }
        c.globalAlpha = 1;
      }
    } else {
      for (const bx of bases){                     // Knochenspitzen
        for (let i = 0; i < 4; i++){
          const x = bx + i*7 + rng()*4, h = 16 + rng()*26;
          c.fillStyle = '#1a0508';
          c.beginPath(); c.moveTo(x, CH); c.lineTo(x + 4, CH); c.lineTo(x + 2, CH-h);
          c.closePath(); c.fill();
        }
      }
      c.fillStyle = '#2a0a0d'; c.fillRect(0, CH-6, LW, 6);
      g.fillStyle = 'rgba(255,110,40,0.18)'; g.fillRect(0, CH-7, LW, 3);
    }
  });
}

/* ----------------------- Kamera und Umgebungsflirren --------------------- */
const cam = { x:0, y:0 };
let arena = null, amb = [], ambT = 0, lightning = 0;
let weather = [], hazards = [], hazardTimer = 0;

function loadArena(kind){
  arena = ARENAS[kind]();
  arena.fg = foreground(kind);
  arena.floor = arena.layers[arena.layers.length - 1];   // unterste Ebene traegt den Ring
  clearDecals();
  arena.grade = { col:'#ffffff', a:0, ta:0 };
  arena.morph = 0;
  amb = [];
  const n = kind === 'hell' ? 70 : kind === 'heaven' ? 46 : 54;
  for (let i = 0; i < n; i++) amb.push(newAmbient(kind, true));
  weather = []; hazards = [];
  hazardTimer = rnd(5, 8);
  cam.x = cam.y = 0; lightning = 0;
}

/* --------------------------- Boden und Kampfspuren ----------------------- */
/* Der Boden lebt aus drei Quellen: dem eingebackenen Kampfring, dem Siegel
   darueber und den Spuren, die der Kampf hinterlaesst.                       */

/* Versatz der Bodenebene — Siegel und Spuren wandern damit mit. */
function floorShift(){
  if (!arena || !arena.floor) return { x:0, y:0 };
  const L = arena.floor;
  let ox = -((cam.x*L.depth + (L.phase || 0)) % LW);
  if (ox > 0) ox -= LW;
  return { x: Math.round(ox - 48), y: -Math.round(cam.y*L.depth) };
}

/* Bleibende Spuren werden einmal in eine eigene Ebene gemalt und danach nur
   noch als Ganzes gezeichnet. Achtzig Ellipsen pro Frame waren sonst umsonst
   neu gerechnet. Ein sehr langsames Ausbleichen haelt den Boden lesbar.       */
const DECAL = surface(LW, CH);
let decalCount = 0, decalFade = 0;

function clearDecals(){
  DECAL.x.setTransform(1,0,0,1,0,0);
  DECAL.x.globalCompositeOperation = 'source-over';
  DECAL.x.clearRect(0, 0, LW, CH);
  decalCount = 0; decalFade = 0;
}

function addDecal(sx, sy, r, kind, col){
  const f = floorShift();
  const x = sx - f.x, y = sy - f.y;              // in Ebenenkoordinaten
  if (x < -30 || x > LW+30) return;
  const c = DECAL.x, seed = (Math.random()*1000)|0;
  decalCount++;
  if (kind === 'scorch'){
    c.fillStyle = rgba('#120a08', 0.55);
    c.beginPath(); c.ellipse(x, y, r, r*0.45, 0, 0, TAU); c.fill();
    c.strokeStyle = rgba(col, 0.18); c.lineWidth = 1;
    c.beginPath(); c.ellipse(x, y, r*0.8, r*0.36, 0, 0, TAU); c.stroke();
  } else if (kind === 'crater'){
    c.fillStyle = rgba('#0d0f18', 0.6);
    c.beginPath(); c.ellipse(x, y, r, r*0.45, 0, 0, TAU); c.fill();
    c.strokeStyle = rgba(col, 0.22); c.lineWidth = 1;
    c.beginPath(); c.ellipse(x, y-1, r, r*0.45, 0, Math.PI, TAU); c.stroke();
    const rng = seeded(seed);
    c.fillStyle = rgba('#0d0f18', 0.6);
    for (let i = 0; i < 6; i++)                   // Auswurf rundherum
      c.fillRect((x + (rng()-0.5)*r*2.6)|0, (y + (rng()-0.5)*r*1.2)|0, 2, 1);
  } else {                                        // Spritzer
    const rng = seeded(seed);
    c.fillStyle = rgba(col, 0.45);
    for (let i = 0; i < 7; i++){
      const a = rng()*TAU, rr = rng()*r;
      c.fillRect((x + Math.cos(a)*rr)|0, (y + Math.sin(a)*rr*0.5)|0,
                 rng() < 0.3 ? 2 : 1, 1);
    }
  }
}

/* Alte Spuren verblassen sehr langsam, damit der Boden nie zumatscht. */
function fadeDecals(dt){
  if (decalCount < 60) return;
  decalFade -= dt;
  if (decalFade > 0) return;
  decalFade = 2.5;
  const c = DECAL.x;
  c.globalCompositeOperation = 'destination-out';
  c.fillStyle = 'rgba(0,0,0,0.05)';
  c.fillRect(0, 0, LW, CH);
  c.globalCompositeOperation = 'source-over';
}

function drawDecals(){
  const f = floorShift();
  ctx.drawImage(DECAL.c, f.x, f.y);
}

/* Das Siegel: pulsierender Runenkreis unter dem Kampf, wechselt beim
   Phasenwechsel die Farbe.                                                   */
function drawSeal(){
  if (!arena) return;
  const f = floorShift();
  const x = RING.x + f.x, y = RING.y + f.y;
  if (x < -140 || x > CW+140) return;
  const col = arena.morph > 0 ? '#ff6b4a' : arena.seal;
  const puls = 0.5 + 0.5*Math.sin(runTime*1.8);
  const a = 0.11 + 0.07*puls;
  const rot = runTime*0.16;

  ctx.save();
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x, y, RING.rx*0.72, RING.ry*0.72, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, y, RING.rx*0.44, RING.ry*0.44, 0, 0, TAU); ctx.stroke();

  for (let i = 0; i < 12; i++){                          // Runen auf dem Ring
    const ang = rot + i*TAU/12;
    const rx = x + Math.cos(ang)*RING.rx*0.58, ry = y + Math.sin(ang)*RING.ry*0.58;
    ctx.fillStyle = rgba(col, a + 0.09);
    ctx.fillRect(rx|0, ry|0, 2, 3);
    if (i % 3 === 0) ctx.fillRect((rx-2)|0, (ry+1)|0, 6, 1);
  }
  ctx.strokeStyle = rgba(col, a*0.5); ctx.lineWidth = 1;  // gegenlaeufiges Dreieck
  ctx.beginPath();
  for (let i = 0; i < 3; i++){
    const ang = -rot*1.7 + i*TAU/3;
    const px = x + Math.cos(ang)*RING.rx*0.42, py = y + Math.sin(ang)*RING.ry*0.42;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  if (GC){                                               // nur ein Hauch Licht
    GC.strokeStyle = rgba(col, 0.07 + 0.05*puls); GC.lineWidth = 2;
    GC.beginPath(); GC.ellipse(x, y, RING.rx*0.72, RING.ry*0.72, 0, 0, TAU); GC.stroke();
  }
}

/* Bewegter Untergrund: Pfuetzenglanz, Wolkenschatten, fliessende Glut. */
function drawFloorFx(){
  if (!arena) return;
  const f = floorShift();
  if (arena.kind === 'ruins'){
    for (const sp of arena.spots){
      const x = sp.x + f.x, y = sp.y + f.y;
      if (x < -40 || x > CW+40) continue;
      for (let i = 0; i < 3; i++){                       // wandernder Glanz
        const t = (runTime*0.35 + i*0.33 + sp.x*0.01) % 1;
        const yy = y - sp.ry + t*sp.ry*2;
        const w = sp.rx * Math.sqrt(Math.max(0, 1 - Math.pow((yy-y)/sp.ry, 2))) * 0.8;
        ctx.fillStyle = rgba('#9fb4ea', 0.16*(1 - Math.abs(t-0.5)*2) + 0.04);
        ctx.fillRect((x-w)|0, yy|0, (w*2)|0, 1);
      }
    }
  } else if (arena.kind === 'heaven'){
    for (let i = 0; i < 4; i++){                          // ziehende Wolkenschatten
      const sx = ((runTime*9 + i*150) % (CW+240)) - 120;
      const sy = HORIZON + 24 + i*26;
      ctx.fillStyle = 'rgba(18,26,58,0.16)';
      ctx.beginPath(); ctx.ellipse(sx, sy, 62, 13, 0, 0, TAU); ctx.fill();
    }
  } else if (arena.veins){
    for (const v of arena.veins){                         // Glut fliesst durch die Adern
      const t = (runTime*0.35 + v.t) % 1;
      const i = Math.min(v.path.length-1, Math.floor(t*v.path.length));
      const px = v.path[i][0] + f.x, py = v.path[i][1] + f.y;
      if (px < -10 || px > CW+10) continue;
      ctx.fillStyle = rgba('#ffd23f', 0.8);
      ctx.fillRect(px|0, py|0, 2, 1);
      glowDot(px, py, 5, '#ff8f3c', 0.4);
    }
  }
}

/* ------------------------- Verwandlung der Arena ------------------------- */
/* Beim Phasenwechsel kippt die Kulisse sichtbar: Ruinen stuerzen ein, der
   Himmel zieht zu, die Hoelle glueht auf. Dazu Wetter und mehr Gefahren.     */
function transformArena(level){
  if (!arena || arena.morph >= level) return;
  arena.morph = level;
  hazardTimer = Math.min(hazardTimer, 1.4);
  shake = Math.max(shake, 8); camPunch(0.09); camTilt(rnd(-0.03, 0.03));

  if (arena.kind === 'ruins'){
    arena.grade.ta = 0.5; arena.grade.col = '#3a4a86';
    collapseRuins();
    for (let i = 0; i < 90; i++) weather.push(newDrop('rain'));
  } else if (arena.kind === 'heaven'){
    arena.grade.ta = 0.55; arena.grade.col = '#6a6a96';
    stormClouds();
    for (let i = 0; i < 70; i++) weather.push(newDrop('rain'));
  } else {
    arena.grade.ta = 0.30 + 0.12*level; arena.grade.col = '#ff8a5a';
    for (let i = 0; i < 60; i++) weather.push(newDrop('ash'));
    for (let i = 0; i < 30; i++) amb.push(newAmbient('hell', true));
  }
}
/* Die Halle sackt in sich zusammen — dieselbe Ebene, kuerzer und zerborstener. */
function collapseRuins(){
  const L = arena.layers[2];
  const c = L.c.getContext('2d');
  c.clearRect(0, 0, LW, CH);
  const rng = seeded(33);
  for (let i = 0; i < 9; i++){
    const x = (i*58 + rng()*18)|0, h = (46 + rng()*38) * rnd(0.35, 0.62), w = 24 + (rng()*10|0);
    let top = HORIZON - h;
    for (let k = 0; k < w; k++){
      if (k % 3 === 0) top = (HORIZON - h + Math.abs(Math.sin(k*0.9 + i))*7 + rng()*3)|0;
      c.fillStyle = (k === 0 || k === w-1) ? '#39406a' : '#2d3350';
      c.fillRect(x+k, top, 1, HORIZON-top);
    }
    c.fillStyle = '#22273e';                       // Schuttkegel davor
    for (let k = 0; k < 14; k++)
      c.fillRect((x - 4 + rng()*(w+8))|0, (HORIZON - 5 + rng()*6)|0, 2 + (rng()*3|0), 2);
  }
  const g = L.g.getContext('2d');
  g.clearRect(0, 0, LW, CH);                       // Fackeln sind erloschen
  for (let i = 0; i < 40; i++)                     // aufsteigender Staub
    amb.push(newAmbient('ruins', true));
}
/* Der Himmel zieht zu: die Wolkenbaenke werden dunkel und dicht. */
function stormClouds(){
  for (const idx of [1, 2, 4]){
    const L = arena.layers[idx];
    if (!L) continue;
    const c = L.c.getContext('2d');
    c.clearRect(0, 0, LW, CH);
    const rng = seeded(11 + idx*7);
    const y = idx === 4 ? HORIZON-4 : 42 + idx*10;
    c.globalAlpha = 0.8; c.fillStyle = idx === 4 ? '#2a3050' : '#1c2340';
    for (let i = 0; i < 70; i++){
      const x = rng()*LW, yy = y + (rng()-0.5)*26, r = 7 + rng()*11;
      c.beginPath(); c.arc(x, yy, r, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
    L.g.getContext('2d').clearRect(0, 0, LW, CH);
  }
}
function newDrop(kind){
  return kind === 'rain'
    ? { k:'rain', x:rnd(-30, CW+30), y:rnd(-CH, CH), vx:-26, vy:rnd(300, 400), len:rnd(5, 11) }
    : { k:'ash',  x:rnd(-20, CW+20), y:rnd(-CH, CH), vx:rnd(-14, 6), vy:rnd(16, 34),
        sway:rnd(0, TAU), r:rnd(0.8, 1.8) };
}

/* ----------------------------- Arena-Gefahren ---------------------------- */
/* Jede Arena hat eine eigene Gefahr. Alle werden angekuendigt, treffen nur
   waehrend ihrer aktiven Phase und lassen sich durch Bewegung vermeiden.     */
function spawnHazard(){
  if (!arena) return;
  const k = arena.kind;
  if (k === 'ruins')
    hazards.push({ kind:'rubble', x:rnd(24, CW-24), y:rnd(HORIZON+16, CH-14),
                   warn:1.3, warnMax:1.3, life:0.35, r:17, dmg:12, hitP:false });
  else if (k === 'heaven')
    hazards.push({ kind:'pillar', x:rnd(40, CW-40), vx:pick([-24, 24]),
                   warn:1.1, warnMax:1.1, life:2.6, lifeMax:2.6, w:7, dmg:9, tick:0 });
  else
    hazards.push({ kind:'geyser', x:rnd(20, CW-20), y:rnd(HORIZON+20, CH-10),
                   warn:1.2, warnMax:1.2, life:0.9, lifeMax:0.9, w:8, h:58, dmg:13, tick:0 });
}
function updateHazards(dt){
  hazardTimer -= dt;
  if (hazardTimer <= 0 && hazards.length < 5){
    spawnHazard();
    const fast = arena && arena.morph > 0;
    hazardTimer = fast ? rnd(4.0, 6.0) : rnd(7.5, 11);
  }
  for (const h of hazards){
    if (h.warn > 0){ h.warn -= dt; if (h.warn <= 0) onHazardStart(h); continue; }
    h.life -= dt;
    if (h.kind === 'pillar'){
      h.x += h.vx*dt;
      if (h.x < 20 || h.x > CW-20) h.vx = -h.vx;
      h.tick -= dt;
      if (h.tick <= 0 && p.iframe <= 0 && Math.abs(p.x - h.x) < h.w + 4){
        damagePlayer(h.dmg); h.tick = 0.6;
      }
      if (Math.random() < 0.3)
        parts.push({ x:h.x + rnd(-h.w, h.w), y:rnd(0, CH), vx:0, vy:-40,
                     life:0.35, max:0.35, col:'#fff3a8', size:1 });
    } else if (h.kind === 'geyser'){
      h.tick -= dt;
      if (h.tick <= 0 && p.iframe <= 0 &&
          Math.abs(p.x - h.x) < h.w + 4 && p.y > h.y - h.h && p.y < h.y + 8){
        damagePlayer(h.dmg); h.tick = 0.5;
      }
      if (Math.random() < 0.55)
        parts.push({ x:h.x + rnd(-h.w, h.w), y:h.y - rnd(0, h.h), vx:rnd(-10,10), vy:-70,
                     life:0.4, max:0.4, col: Math.random() < 0.4 ? '#ffe066' : '#ff8f3c', size:1 });
    }
  }
  hazards = hazards.filter(h => h.warn > 0 || h.life > 0);
}
function onHazardStart(h){
  if (h.kind === 'rubble'){
    explode(h.x, h.y, h.r, 0);
    addDecal(h.x, h.y, h.r*0.85, 'crater', '#8f9ac0');
    burst(h.x, h.y, 18, '#6b7290', 120, 0.6);
    shake = Math.max(shake, 4); camPunch(0.05);
    if (p.iframe <= 0 && dist2(h.x, h.y, p.x, p.y) < (h.r+5)*(h.r+5)) damagePlayer(h.dmg);
    sfx.boom();
  } else if (h.kind === 'geyser'){
    addDecal(h.x, h.y, 13, 'scorch', '#ff8f3c');
    burst(h.x, h.y, 16, '#ff8f3c', 130, 0.6);
    shake = Math.max(shake, 3); camPunch(0.04);
    sfx.boom();
  } else sfx.boss();
}
function drawHazardWarnings(){
  for (const h of hazards){
    if (h.warn <= 0) continue;
    const puls = 0.35 + 0.45*Math.abs(Math.sin(h.warn*15));
    if (h.kind === 'rubble'){
      const k = clamp(1 - h.warn/(h.warnMax || 1.3), 0, 1);
      ctx.fillStyle = rgba('#0b0913', 0.45);       // Schatten waechst mit
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r*k, h.r*k*0.45, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba('#c9d4f0', puls); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r*0.45, 0, 0, TAU); ctx.stroke();
      const ry = h.y - (1-k)*90;                   // fallender Brocken
      ctx.fillStyle = '#4a5170'; ctx.fillRect((h.x-4)|0, ry|0, 8, 7);
      ctx.fillStyle = '#69718f'; ctx.fillRect((h.x-4)|0, ry|0, 8, 2);
    } else if (h.kind === 'geyser'){
      ctx.strokeStyle = rgba('#ff8f3c', puls); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.w+4, 4, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgba('#ff5a1e', 0.3*puls);
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.w, 3, 0, 0, TAU); ctx.fill();
      glowDot(h.x, h.y, 12, '#ff8f3c', 0.35*puls);
    } else {
      ctx.strokeStyle = rgba('#fff3a8', puls*0.7); ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(h.x, 0); ctx.lineTo(h.x, CH); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}
function drawHazards(){
  for (const h of hazards){
    if (h.warn > 0) continue;
    if (h.kind === 'pillar'){
      const a = clamp(h.life, 0, 1);
      const g = ctx.createLinearGradient(h.x - h.w, 0, h.x + h.w, 0);
      g.addColorStop(0, rgba('#fff3a8', 0)); g.addColorStop(0.5, rgba('#fff8d8', 0.55*a));
      g.addColorStop(1, rgba('#fff3a8', 0));
      ctx.fillStyle = g; ctx.fillRect(h.x - h.w*2, 0, h.w*4, CH);
      ctx.fillStyle = rgba('#ffffff', 0.75*a); ctx.fillRect((h.x-1)|0, 0, 2, CH);
      glowLine(h.x, 0, h.x, CH, h.w*2.5, '#ffe066', 0.5*a);
      ctx.strokeStyle = rgba('#fff3a8', 0.5*a); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(h.x, CH-14, h.w*2, 5, 0, 0, TAU); ctx.stroke();
    } else if (h.kind === 'geyser'){
      // Nach oben schmaler werdende, flackernde Saeule statt starrem Balken
      const a = clamp(h.life/(h.lifeMax || 0.9), 0, 1);
      const seg = 14, sh = h.h/seg;
      for (let i = 0; i < seg; i++){
        const t = i/seg;
        const flick = 1 + Math.sin(runTime*26 + i*1.7)*0.22;
        const w = Math.max(1, h.w * (1 - t*0.72) * flick);
        const col = t < 0.22 ? '#fff8d8' : t < 0.55 ? '#ffb03a' : '#ff5a1e';
        ctx.fillStyle = rgba(col, (1 - t*0.55) * a);
        ctx.fillRect(Math.round(h.x - w), Math.round(h.y - sh*(i+1)),
                     Math.max(2, Math.round(w*2)), Math.ceil(sh) + 1);
      }
      ctx.fillStyle = rgba('#fff8d8', 0.85*a);      // heisser Kern
      ctx.fillRect((h.x - 1)|0, (h.y - h.h*0.55)|0, 3, h.h*0.55);
      ctx.fillStyle = rgba('#ff8f3c', 0.5*a);       // Glutring am Boden
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.w*1.6, 4, 0, 0, TAU); ctx.fill();
      glowLine(h.x, h.y, h.x, h.y - h.h*0.7, h.w*2.4, '#ff8f3c', 0.55*a);
      glowDot(h.x, h.y, 16, '#ffe066', 0.5*a);
    }
  }
}
function newAmbient(kind, spread){
  if (kind === 'hell')
    return { k:'ember', x:rnd(-20, CW+20), y: spread ? rnd(0, CH) : CH+4,
             vx:rnd(-6, 6), vy:rnd(-26, -12), life:rnd(1.5, 4), max:4,
             col: Math.random() < 0.35 ? '#ffe066' : '#ff8f3c', r:rnd(0.6, 1.6) };
  if (kind === 'heaven')
    return { k:'feather', x:rnd(-20, CW+20), y: spread ? rnd(0, CH) : -6,
             vx:rnd(-4, 10), vy:rnd(6, 16), life:rnd(3, 7), max:7,
             col:'#ffffff', r:rnd(0.8, 1.8), sway:rnd(0, TAU) };
  return { k:'dust', x:rnd(-20, CW+20), y: spread ? rnd(0, CH) : CH+4,
           vx:rnd(-8, 8), vy:rnd(-9, -3), life:rnd(2, 6), max:6,
           col:'#8f9ac0', r:rnd(0.6, 1.4), sway:rnd(0, TAU) };
}
function updateArena(dt){
  if (!arena) return;
  ambT += dt;
  const px = p ? p.x : CW/2, py = p ? p.y : CH/2;
  cam.x = lerp(cam.x, (px - CW/2) * 0.16, 1 - Math.pow(0.001, dt));
  cam.y = lerp(cam.y, (py - CH/2) * 0.06, 1 - Math.pow(0.001, dt));
  for (const a of arena.layers) a.phase = (a.phase || 0) + a.scroll*dt;

  for (let i = 0; i < amb.length; i++){
    const a = amb[i];
    a.life -= dt;
    a.x += a.vx*dt; a.y += a.vy*dt;
    if (a.sway !== undefined){ a.sway += dt*2; a.x += Math.sin(a.sway)*10*dt; }
    if (a.life <= 0 || a.y < -10 || a.y > CH+10) amb[i] = newAmbient(arena.kind, false);
  }
  if (arena.kind === 'ruins' || arena.morph > 0){
    lightning -= dt;
    const gap = arena.morph > 0 ? rnd(1.2, 3.5) : rnd(4, 11);
    if (lightning < -gap) lightning = 0.22;
  }
  arena.grade.a = lerp(arena.grade.a, arena.grade.ta, 1 - Math.pow(0.15, dt));
  fadeDecals(dt);
  arena.fg.phase = (arena.fg.phase || 0) + arena.fg.scroll*dt;

  for (const w of weather){
    w.x += w.vx*dt; w.y += w.vy*dt;
    if (w.sway !== undefined){ w.sway += dt*2.2; w.x += Math.sin(w.sway)*8*dt; }
    if (w.y > CH + 12 || w.x < -40 || w.x > CW + 40){
      w.y = -rnd(4, 40); w.x = rnd(-30, CW+30);
    }
  }
}
function drawArenaBack(){
  if (!arena) return;
  for (const L of arena.layers){
    let ox = -((cam.x*L.depth + L.phase) % LW);
    if (ox > 0) ox -= LW;
    const oy = -Math.round(cam.y*L.depth);
    for (let x = ox - 48; x < CW; x += LW){
      ctx.drawImage(L.c, Math.round(x), oy);
      if (GC) GC.drawImage(L.g, Math.round(x), oy);
    }
  }
  drawFloorFx();
  drawDecals();
  drawSeal();
  if (arena.kind === 'ruins' && lightning > 0){
    const a = lightning/0.22;
    ctx.fillStyle = rgba('#aebcf0', a*0.22); ctx.fillRect(0, 0, CW, CH);
  }
  // Umgebungsflirren hinter den Figuren
  for (let i = 0; i < amb.length; i++){
    const a = amb[i];
    if (a.k === 'feather') continue;
    const al = clamp(a.life/a.max, 0, 1) * 0.85;
    ctx.fillStyle = rgba(a.col, al);
    ctx.fillRect(a.x|0, a.y|0, a.r < 1.2 ? 1 : 2, a.r < 1.2 ? 1 : 2);
    if (a.k === 'ember' && (i & 2) === 0) glowDot(a.x, a.y, 3, a.col, al*0.5);
  }
}
function drawArenaFront(){
  if (!arena) return;
  for (const a of amb){
    if (a.k !== 'feather') continue;
    const al = clamp(a.life/a.max, 0, 1) * 0.9;
    ctx.fillStyle = rgba(a.col, al);
    ctx.fillRect(a.x|0, a.y|0, 1, 2);
  }
  // Vordergrund-Saeulen und Schwaden laufen vor den Figuren durch
  const L = arena.fg;
  let ox = -((cam.x*L.depth + (L.phase || 0)) % LW);
  if (ox > 0) ox -= LW;
  const oy = -Math.round(cam.y*L.depth);
  for (let x = ox - 48; x < CW; x += LW){
    ctx.drawImage(L.c, Math.round(x), oy);
    if (GC) GC.drawImage(L.g, Math.round(x), oy);
  }
  // Wetter nach der Verwandlung
  if (weather.length){
    ctx.strokeStyle = 'rgba(186,208,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const w of weather){                       // alle Tropfen in einem Pfad
      if (w.k !== 'rain') continue;
      ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + w.vx*0.02, w.y + w.len);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(190,150,130,0.55)';
    for (const w of weather){
      if (w.k === 'rain') continue;
      ctx.fillRect(w.x|0, w.y|0, w.r < 1.3 ? 1 : 2, w.r < 1.3 ? 1 : 2);
    }
  }
  // Bodennebel als Abschluss
  const g = ctx.createLinearGradient(0, CH-26, 0, CH);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, arena.kind === 'hell' ? 'rgba(40,4,6,0.5)' :
                    arena.kind === 'heaven' ? 'rgba(120,150,220,0.35)' : 'rgba(14,16,28,0.5)');
  ctx.fillStyle = g; ctx.fillRect(0, CH-26, CW, 26);
}
/* ============================== Stage-Fluss ============================== */
function startRun(charIdx, keepPlayer){
  if (!keepPlayer){ p = newPlayer(CHARS[charIdx]); loopN = 0; }
  stageIdx = 0; runTime = 0; kills = 0; combo = 0;
  startStage();
}
/* Neue Schleife: Held und Verstaerkungen bleiben, alles wird haerter. */
function startNewGamePlus(){
  loopN++;
  meta.loops = Math.max(meta.loops, loopN); saveMeta();
  p.hp = stats().maxHp;
  startRun(0, true);
}
function stageHp(){
  return Math.round(STAGES[stageIdx].hp * Math.pow(1.6, loopN));
}
function startStage(){
  enemies = []; bullets = []; ebullets = []; gems = [];
  parts = []; texts = []; beams = []; meteors = []; waves = [];
  pools = []; chests = []; banners = []; hazards = [];
  const st = STAGES[stageIdx];
  loadArena(st.bg);
  bossGhost = 1; hpGhost = 1;
  boss = BOSS_FACTORY[stageIdx](stageHp());
  enemies.push(boss);
  p.x = CW/2; p.y = CH - 45; p.vx = p.vy = 0; p.iframe = 1.2;
  spawnTimer = 2.4; eliteTimer = rnd(14, 20); introT = INTRO_LEN;
  view.zoom = view.tz = 1; view.cx = view.tx = CW/2; view.cy = view.ty = CH/2;
